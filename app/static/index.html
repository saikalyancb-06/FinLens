                }
            };

            // ---- Scanning ---------------------------------------------------

            const pollScans = (ids) => {
                let ticks = 0;
                const interval = trackTimer(setInterval(async () => {
                    ticks += 1;
                    try {
                        const results = await Promise.all(
                            ids.map(id => apiFetch(`/email/scans/${id}`).catch(() => null))
                        );
                        const live = results.filter(Boolean);
                        if (live.length) setScans(live);

                        const finished = live.length === ids.length &&
                            live.every(s => s.status === 'COMPLETED' || s.status === 'FAILED');

                        if (finished || ticks > 400) {
                            dropTimer(interval);
                            setLoading(false);
                            if (finished) {
                                const found = live.reduce((n, s) => n + (s.statements_found || 0), 0);
                                const extracted = live.reduce((n, s) => n + (s.transactions_extracted || 0), 0);
                                const failed = live.some(s => s.status === 'FAILED');
                                setMsg(failed
                                    ? 'Scan finished with errors. See the scan panel below for details.'
                                    : `Scan complete. Found ${found} financial document${found === 1 ? '' : 's'}.`);
                                await loadEmailData();
                                if (extracted > 0 && onImportComplete) onImportComplete();
                            } else {
                                setMsg('Stopped watching this scan — it is taking unusually long. Reload to check its result.');
                            }
                        }
                    } catch (e) {}
                }, 1500));
            };

            const handleScan = async (connectionId) => {
                setValidationErr('');
                setLoading(true);
                setScans([]);
                setMsg(connectionId
                    ? 'Scanning this mailbox for financial documents...'
                    : 'Scanning every connected mailbox for financial documents...');
                try {
                    const qs = `?auto_import=true${connectionId ? `&connection_id=${connectionId}` : ''}`;
                    const res = await apiFetch(`/email/scans${qs}`, { method: 'POST' });
                    const started = (res && res.scans) || [];
                    setScans(started);
                    if (!started.length) {
                        setLoading(false);
                        setMsg('No mailbox was scanned.');
                        return;
                    }
                    pollScans(started.map(s => s.id));
                } catch (err) {
                    setLoading(false);
                    setMsg(`Scan error: ${err.message}`);
                }
            };

            // ---- Importing --------------------------------------------------

            const handleImportSingle = async (attId, filename, targetAccId, pdfPassword) => {
                const effectiveAccId = targetAccId || mappingSelection[attId] || selectedBankAccountId;
                if (!effectiveAccId) {
                    const errText = "Please select a bank account before importing the document.";
                    setValidationErr(errText);
                    setMsg(`⚠️ ${errText}`);
                    return;
                }
                setValidationErr('');
                try {
                    setMsg(` Importing '${filename}'...`);
                    const payload = {
                        bank_account_id: effectiveAccId,
                        account_id: effectiveAccId
                    };
                    const passToUse = pdfPassword || passwordInputs[attId];
                    if (passToUse) payload.pdf_password = passToUse;

                    const res = await apiFetch(`/email/import/${attId}`, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    setMsg(` Imported '${filename}'! Created ${res.transactions_created || res.summary?.total_stored || 0} transactions.`);
                    await loadEmailData();
                    if (onImportComplete) onImportComplete();
                } catch (err) {
                    setMsg(` Import failed: ${err.message}`);
                    await loadEmailData();
                }
            };

            const handleMapAndImport = async (attId, filename, pdfPassword) => {
                const targetAccId = mappingSelection[attId] || selectedBankAccountId;
                if (!targetAccId) {
                    const errText = "Please select a bank account before importing the document.";
                    setValidationErr(errText);
                    setMsg(`⚠️ ${errText}`);
                    return;
                }
                setValidationErr('');
                try {
                    setMsg(` Mapping statement to Bank Master account...`);
                    await apiFetch(`/email/statements/${attId}/map-account`, {
                        method: 'POST',
                        body: JSON.stringify({ bank_account_id: targetAccId, account_id: targetAccId })
                    });
                    await handleImportSingle(attId, filename, targetAccId, pdfPassword || passwordInputs[attId]);
                } catch (err) {
                    setMsg(` Account mapping failed: ${err.message}`);
                }
            };

            const handleImportAll = async () => {
                if (bankAccounts.length === 0) {
                    setValidationErr("No bank account available. Please add a bank account first.");
                    return;
                }
                const anyMissing = statements.some(s => s.import_status === 'PENDING' && !getEffectiveAccountId(s));
                if (anyMissing && !selectedBankAccountId) {
                    const errText = "Please select a bank account before importing the document.";
                    setValidationErr(errText);
                    setMsg(`⚠️ ${errText}`);
                    return;
                }
                setValidationErr('');
                setMsg(' Importing all pending bank statements...');
                try {
                    const payload = selectedBankAccountId ? { bank_account_id: selectedBankAccountId, account_id: selectedBankAccountId } : undefined;
                    const res = await apiFetch('/email/import-all', {
                        method: 'POST',
                        body: payload ? JSON.stringify(payload) : undefined
                    });
                    setMsg(` Successfully imported ${res.imported_count || 0} statement files!`);
                    await loadEmailData();
                    if (onImportComplete) onImportComplete();
                } catch (err) {
                    setMsg(` Import all failed: ${err.message}`);
                }
            };

            // ---- Small presentational helpers -------------------------------

            const statusBadgeClass = (status) => {
                if (status === 'CONNECTED') return 'badge badge-ok';
                if (status === 'NEEDS_REAUTH' || status === 'ERROR') return 'badge badge-warn';
                if (status === 'REVOKED') return 'badge badge-danger';
                return 'badge';
            };

            const scanCounters = (s) => (
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: '1rem', marginTop: '0.6rem' }}>
                    <ScanCounter label="Messages" value={s.messages_scanned} />
                    <ScanCounter label="Candidates" value={s.candidates_found} />
                    <ScanCounter label="Downloaded" value={s.documents_downloaded} />
                    <ScanCounter label="Statements" value={s.statements_found} />
                    <ScanCounter label="Duplicates" value={s.duplicates_skipped} />
                    <ScanCounter label="Transactions" value={s.transactions_extracted} />
                    <ScanCounter label="Failures" value={s.failures} />
                </div>
            );

            return (
                <div>
                    {/* Top 4 KPI Cards */}
                    <div className="stats-grid" style={{ marginBottom: '1.5rem' }}>
                        <div className="stat-card">
                            <div className="stat-label">CONNECTED MAILBOXES</div>
                            <div className="stat-value">{connections.length}</div>
                            <div className="stat-change" style={{ overflow: 'hidden', textOverflow: 'ellipsis' }}>
                                {connections.length === 0
                                    ? 'No mailbox connected'
                                    : connections.map(c => c.email_address).join(', ')}
                            </div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-label">LAST SCAN</div>
                            <div className="stat-value" style={{ fontSize: '0.75rem' }}>
                                {lastScan ? lastScan.substring(0, 16) : 'Never'}
                            </div>
                            <div className="stat-change">Across every connected mailbox</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-label">DOCUMENTS FOUND</div>
                            <div className="stat-value">{statements.length}</div>
                            <div className="stat-change">PDF / CSV / XLSX files</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-label">PENDING IMPORTS</div>
                            <div className="stat-value">{pendingCount}</div>
                            <div className="stat-change">Ready to extract</div>
                        </div>
                    </div>

                    {/* Nothing connected yet: single email-first connection input */}
                    {connections.length === 0 && (
                        <div className="card" style={{ marginBottom: '1.5rem' }}>
                            <div className="card-body" style={{ textAlign: 'center', padding: '2.5rem 1.5rem' }}>
                                <div style={{ fontSize: '0.78rem', fontWeight: 'bold', marginBottom: '0.4rem', color: 'var(--black)' }}>
                                    Connect your email to find your financial statements.
                                </div>
                                <div style={{ fontSize: '0.52rem', color: 'var(--gray-600)', marginBottom: '1.5rem' }}>
                                    Enter your work or personal email address. We automatically detect and route to Google Workspace, Microsoft 365, or IMAP.
                                </div>
                                <form
                                    onSubmit={(e) => { e.preventDefault(); handleRouteAndConnect(); }}
                                    style={{ display: 'flex', gap: '0.6rem', justifyContent: 'center', maxWidth: '540px', margin: '0 auto', flexWrap: 'wrap' }}
                                >
                                    <input
                                        type="email"
                                        value={emailInput}
                                        onChange={(e) => setEmailInput(e.target.value)}
                                        placeholder="name@company.com or name@gmail.com"
                                        disabled={routingBusy}
                                        style={{ flex: '1 1 300px', padding: '0.45rem 0.75rem', fontSize: '0.54rem', border: '1px solid var(--gray-400)', background: '#fff', height: '38px', boxSizing: 'border-box' }}
                                        required
                                    />
                                    <button
                                        type="submit"
                                        className="btn btn-primary"
                                        disabled={routingBusy || !emailInput.trim()}
                                        style={{ height: '38px', padding: '0.45rem 1.5rem', whiteSpace: 'nowrap' }}
                                    >
                                        {routingBusy ? 'Connecting...' : 'Connect Mailbox'}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {providerWarning && (
                        <div style={{ marginBottom: '1.5rem', padding: '0.6rem 0.85rem', background: '#fffbeb', border: '1px solid #fde68a', color: '#78350f', borderRadius: '4px', fontSize: '0.5rem' }}>
                            {providerWarning}
                        </div>
                    )}

                    {/* Application-password (IMAP) connect form */}
                    {showImapForm && (
                        <div className="card" style={{ marginBottom: '1.5rem' }}>
                            <div className="card-header">
                                <h3>CONNECT ANOTHER EMAIL PROVIDER</h3>
                                <span style={{ fontSize: '0.48rem', color: 'var(--gray-600)' }}>Any IMAP mailbox — custom domain, university, company, Yahoo, Zoho, Fastmail</span>
                            </div>
                            <div className="card-body">
                                <div style={{ display: 'flex', flexWrap: 'wrap', gap: '1rem' }}>
                                    <div style={{ display: 'flex', flexDirection: 'column', gap: '0.3rem' }}>
                                        <label htmlFor="imap-email" style={{ fontSize: '0.48rem', fontWeight: 'bold', color: 'var(--gray-800)', textTransform: 'uppercase', letterSpacing: '0.5px' }}>
                                            Email address <span style={{ color: '#dc2626' }}>*</span>
                                        </label>
                                        <input
                                            id="imap-email"
                                            type="email"
                                            value={imapForm.email_address}
                                            onChange={e => setImapForm({ ...imapForm, email_address: e.target.value })}
                                            onBlur={handleImapSuggest}
                                            placeholder="you@yourdomain.com"
                                            style={{ fontSize: '0.51rem', padding: '0.4rem 0.6rem', border: '1px solid var(--gray-300)', borderRadius: '4px', minWidth: '230px' }}
                                        />
                                    </div>
                                    <div style={{ display: 'flex', flexDirection: 'column', gap: '0.3rem' }}>
                                        <label htmlFor="imap-host" style={{ fontSize: '0.48rem', fontWeight: 'bold', color: 'var(--gray-800)', textTransform: 'uppercase', letterSpacing: '0.5px' }}>
                                            IMAP host
                                        </label>
                                        <input
                                            id="imap-host"
                                            type="text"
                                            value={imapForm.imap_host}
                                            onChange={e => setImapForm({ ...imapForm, imap_host: e.target.value })}
                                            placeholder="imap.yourdomain.com"
                                            style={{ fontSize: '0.51rem', padding: '0.4rem 0.6rem', border: '1px solid var(--gray-300)', borderRadius: '4px', minWidth: '210px' }}
                                        />
                                    </div>
                                    <div style={{ display: 'flex', flexDirection: 'column', gap: '0.3rem' }}>
                                        <label htmlFor="imap-port" style={{ fontSize: '0.48rem', fontWeight: 'bold', color: 'var(--gray-800)', textTransform: 'uppercase', letterSpacing: '0.5px' }}>
                                            Port
                                        </label>
                                        <input
                                            id="imap-port"
                                            type="number"
                                            value={imapForm.imap_port}
                                            onChange={e => setImapForm({ ...imapForm, imap_port: e.target.value })}
                                            style={{ fontSize: '0.51rem', padding: '0.4rem 0.6rem', border: '1px solid var(--gray-300)', borderRadius: '4px', width: '90px' }}
                                        />
                                    </div>
                                    <div style={{ display: 'flex', alignItems: 'flex-end', paddingBottom: '0.45rem' }}>
                                        <label htmlFor="imap-ssl" style={{ fontSize: '0.5rem', display: 'flex', alignItems: 'center', gap: '0.35rem', fontWeight: '600' }}>
                                            <input
                                                id="imap-ssl"
                                                type="checkbox"
                                                checked={!!imapForm.use_ssl}
                                                onChange={e => setImapForm({ ...imapForm, use_ssl: e.target.checked })}
                                            />
                                            Use SSL
                                        </label>
                                    </div>
                                    <div style={{ display: 'flex', flexDirection: 'column', gap: '0.3rem' }}>
                                        <label htmlFor="imap-username" style={{ fontSize: '0.48rem', fontWeight: 'bold', color: 'var(--gray-800)', textTransform: 'uppercase', letterSpacing: '0.5px' }}>
                                            Username (optional)
                                        </label>
                                        <input
                                            id="imap-username"
                                            type="text"
                                            value={imapForm.imap_username}
                                            onChange={e => setImapForm({ ...imapForm, imap_username: e.target.value })}
                                            placeholder="Defaults to the email address"
                                            style={{ fontSize: '0.51rem', padding: '0.4rem 0.6rem', border: '1px solid var(--gray-300)', borderRadius: '4px', minWidth: '200px' }}
                                        />
                                    </div>
                                    <div style={{ display: 'flex', flexDirection: 'column', gap: '0.3rem' }}>
                                        <label htmlFor="imap-app-password" style={{ fontSize: '0.48rem', fontWeight: 'bold', color: 'var(--gray-800)', textTransform: 'uppercase', letterSpacing: '0.5px' }}>
                                            Application-specific password <span style={{ color: '#dc2626' }}>*</span>
                                        </label>
                                        <input
                                            id="imap-app-password"
                                            type="password"
                                            value={imapForm.app_password}
                                            onChange={e => setImapForm({ ...imapForm, app_password: e.target.value })}
                                            placeholder="App password"
                                            style={{ fontSize: '0.51rem', padding: '0.4rem 0.6rem', border: '1px solid var(--gray-300)', borderRadius: '4px', minWidth: '210px' }}
                                        />
                                    </div>
                                </div>

                                <div style={{ fontSize: '0.45rem', color: '#64748b', marginTop: '0.55rem' }}>
                                    Use an application-specific password issued by your provider — not your normal email password. It is encrypted before it is stored.
                                </div>

                                {imapErr && (
                                    <div style={{ marginTop: '0.7rem', padding: '0.6rem 0.85rem', background: '#fef2f2', border: '1px solid #fca5a5', color: '#991b1b', borderRadius: '4px', fontSize: '0.5rem', fontWeight: '600' }}>
                                        {imapErr}
                                    </div>
                                )}

                                <div style={{ marginTop: '0.9rem', display: 'flex', gap: '0.6rem' }}>
                                    <button className="btn btn-primary" onClick={handleConnectImap} disabled={imapBusy}>
                                        {imapBusy ? 'Connecting...' : 'Connect Mailbox'}
                                    </button>
                                    <button className="btn" onClick={() => { setShowImapForm(false); setImapErr(''); }} disabled={imapBusy}>
                                        Cancel
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Connected mailboxes */}
                    {connections.length > 0 && (
                        <div className="card" style={{ marginBottom: '1.5rem' }}>
                            <div className="card-header" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '0.75rem' }}>
                                <h3>CONNECTED MAILBOXES</h3>
                                <form
                                    onSubmit={(e) => { e.preventDefault(); handleRouteAndConnect(); }}
                                    style={{ display: 'flex', gap: '0.5rem', alignItems: 'center', flexWrap: 'wrap' }}
                                >
                                    <input
                                        type="email"
                                        value={emailInput}
                                        onChange={(e) => setEmailInput(e.target.value)}
                                        placeholder="Add another email (e.g. name@company.com)"
                                        disabled={routingBusy}
                                        style={{ padding: '0.35rem 0.6rem', fontSize: '0.5rem', border: '1px solid var(--gray-300)', width: '250px', height: '32px', boxSizing: 'border-box' }}
                                    />
                                    <button
                                        type="submit"
                                        className="btn btn-sm btn-primary"
                                        disabled={routingBusy || !emailInput.trim()}
                                        style={{ height: '32px' }}
                                    >
                                        {routingBusy ? 'Connecting...' : 'Connect'}
                                    </button>
                                </form>
                            </div>
                            <div className="card-body" style={{ padding: 0 }}>
                                <div className="table-responsive">
                                    <table>
                                        <thead>
                                            <tr>
                                                <th>MAILBOX</th>
                                                <th>STATUS</th>
                                                <th className="date-col">LAST SCAN</th>
                                                <th>ACTIONS</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {connections.map(conn => (
                                                <tr key={conn.id}>
                                                    <td>
                                                        <div style={{ fontWeight: 'bold' }}>{conn.email_address}</div>
                                                        <div style={{ fontSize: '0.45rem', color: 'var(--gray-600)' }}>
                                                            {conn.provider_label || conn.provider}
                                                            {conn.imap_host ? ` · ${conn.imap_host}` : ''}
                                                        </div>
                                                    </td>
                                                    <td>
                                                        <span className={statusBadgeClass(conn.status)}>{conn.status}</span>
                                                        {conn.status_detail && (
                                                            <div style={{ fontSize: '0.432rem', color: '#64748b', marginTop: '0.2rem', maxWidth: '260px' }}>
                                                                {conn.status_detail}
                                                            </div>
                                                        )}
                                                    </td>
                                                    <td style={{ whiteSpace: 'nowrap', fontSize: '0.48rem' }}>
                                                        {conn.last_scan ? conn.last_scan.substring(0, 16) : 'Never'}
                                                    </td>
                                                    <td style={{ whiteSpace: 'nowrap' }}>
                                                        <button
                                                            className="btn btn-sm"
                                                            onClick={() => handleScan(conn.id)}
                                                            disabled={loading || scanRunning}
                                                        >
                                                            Scan
                                                        </button>
                                                        {conn.status !== 'CONNECTED' && (
                                                            <button
                                                                className="btn btn-sm btn-primary"
                                                                style={{ marginLeft: '0.35rem' }}
                                                                onClick={() => handleReconnect(conn)}
                                                            >
                                                                Reconnect
                                                            </button>
                                                        )}
                                                        <button
                                                            className="btn btn-sm"
                                                            style={{ marginLeft: '0.35rem' }}
                                                            onClick={() => handleDisconnect(conn)}
                                                        >
                                                            Disconnect
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Action & Mandatory Bank Account Selection Bar */}
                    <div style={{ background: 'var(--white)', padding: '1.25rem', border: '1px solid var(--gray-200)', marginBottom: '1.5rem', display: 'flex', flexWrap: 'wrap', gap: '1.5rem', alignItems: 'flex-end', justifyContent: 'space-between' }}>
                        <div style={{ display: 'flex', flexWrap: 'wrap', gap: '1rem', alignItems: 'flex-end' }}>
                            <button className="btn" onClick={() => handleScan(null)} disabled={loading || scanRunning || connections.length === 0}>
                                {(loading || scanRunning) ? 'Scanning Mailboxes...' : 'Scan All Mailboxes'}
                            </button>

                            {/* Mandatory Bank Account Selector */}
                            <div style={{ display: 'flex', flexDirection: 'column', gap: '0.35rem' }}>
                                <label htmlFor="bank-account-import-select" style={{ fontSize: '0.48rem', fontWeight: 'bold', color: 'var(--gray-800)', textTransform: 'uppercase', letterSpacing: '0.5px' }}>
                                    Bank Account <span style={{ color: '#dc2626' }}>*</span>
                                </label>
                                <select
                                    id="bank-account-import-select"
                                    value={selectedBankAccountId}
                                    onChange={e => {
                                        setSelectedBankAccountId(e.target.value);
                                        setValidationErr('');
                                    }}
                                    style={{
                                        fontSize: '0.51rem',
                                        padding: '0.45rem 0.75rem',
                                        border: validationErr ? '2px solid #dc2626' : '1px solid var(--gray-300)',
                                        borderRadius: '4px',
                                        minWidth: '240px',
                                        background: '#f8fafc',
                                        fontWeight: '500'
                                    }}
                                >
                                    <option value="">Select Bank Account</option>
                                    {bankAccounts.map(a => (
                                        <option key={a.id} value={a.id}>
                                            {a.bank_name || a.bank_code} — {a.account_number_masked}
                                        </option>
                                    ))}
                                </select>
                            </div>
                        </div>

                        <div>
                            {pendingCount > 0 && connections.length > 0 && (
                                <button
                                    className="btn btn-primary"
                                    onClick={handleImportAll}
                                    disabled={bankAccounts.length === 0}
                                >
                                    Import All Pending ({pendingCount})
                                </button>
                            )}
                        </div>
                    </div>

                    {validationErr && (
                        <div style={{ marginBottom: '1.5rem', padding: '0.75rem 1rem', background: '#fef2f2', border: '1px solid #fca5a5', color: '#991b1b', borderRadius: '6px', fontWeight: '600', fontSize: '0.525rem', display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                            <span>⚠️</span>
                            <span>{validationErr}</span>
                        </div>
                    )}

                    {msg && (
                        <div style={{ marginBottom: '1.5rem', padding: '0.75rem', background: 'var(--gray-100)', border: '1px solid var(--gray-400)', fontWeight: '600', fontSize: '0.51rem' }}>
                            {msg}
                        </div>
                    )}

                    {/* Scan progress / result panel */}
                    {scans.length > 0 && (
                        <div className="card" style={{ marginBottom: '1.5rem' }}>
                            <div className="card-header">
                                <h3>{scanRunning ? 'SCAN IN PROGRESS' : 'LAST SCAN'}</h3>
                                <span style={{ fontSize: '0.48rem', color: 'var(--gray-600)' }}>
                                    {scanRunning ? 'Reading only statement-like messages' : 'Summary of the most recent run'}
                                </span>
                            </div>
                            <div className="card-body">
                                {scans.map(s => {
                                    const pct = Math.max(0, Math.min(100, s.progress_pct || 0));
                                    const failed = s.status === 'FAILED';
                                    const done = s.status === 'COMPLETED';
                                    return (
                                        <div key={s.id} style={{ marginBottom: '1rem' }}>
                                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', gap: '1rem', flexWrap: 'wrap' }}>
                                                <div style={{ fontSize: '0.51rem', fontWeight: 'bold' }}>
                                                    {s.email_address || 'Mailbox'}
                                                    <span style={{ fontWeight: 'normal', color: 'var(--gray-600)', marginLeft: '0.35rem' }}>
                                                        {s.provider ? `(${s.provider})` : ''}
                                                    </span>
                                                </div>
                                                <div style={{ fontSize: '0.48rem', color: 'var(--gray-700)' }}>
                                                    {s.stage || s.status} {done || failed ? '' : `· ${pct}%`}
                                                </div>
                                            </div>

                                            {!done && !failed && (
                                                <div style={{ height: '6px', background: 'var(--gray-200)', borderRadius: '3px', overflow: 'hidden', marginTop: '0.4rem' }}>
                                                    <div style={{ width: `${pct}%`, height: '100%', background: '#2563eb', transition: 'width 0.3s ease' }}></div>
                                                </div>
                                            )}

                                            {scanCounters(s)}

                                            {failed && (
                                                <div style={{ marginTop: '0.6rem', padding: '0.6rem 0.85rem', background: '#fffbeb', border: '1px solid #fde68a', color: '#78350f', borderRadius: '4px', fontSize: '0.5rem' }}>
                                                    <strong>This mailbox could not be scanned.</strong>{' '}
                                                    {s.error_detail || s.error_reason || 'No further detail was reported.'}
                                                </div>
                                            )}

                                            {done && s.error_detail && (
                                                <div style={{ marginTop: '0.6rem', padding: '0.6rem 0.85rem', background: '#fffbeb', border: '1px solid #fde68a', color: '#78350f', borderRadius: '4px', fontSize: '0.5rem' }}>
                                                    {s.error_detail}
                                                </div>
                                            )}
                                        </div>

        function RpaSubTab({ onImportComplete, navigate }) {
            const [supportedBanks, setSupportedBanks] = useState([]);

            const [selectedBank, setSelectedBank] = useState('');
            const [startDate, setStartDate] = useState('2026-08-01');
            const [endDate, setEndDate] = useState('2026-08-31');
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [accountNumber, setAccountNumber] = useState('');
            const [dob, setDob] = useState('');
            const [userAcknowledged, setUserAcknowledged] = useState(true);

            const [activeJobId, setActiveJobId] = useState(null);
            const [jobStatus, setJobStatus] = useState(null);
            const [errorMessage, setErrorMessage] = useState('');
            const [loading, setLoading] = useState(false);

            const [otpInput, setOtpInput] = useState('');
            const [pdfPasswordInput, setPdfPasswordInput] = useState('');
            const [submittingAuth, setSubmittingAuth] = useState(false);
            const [rpaJobs, setRpaJobs] = useState([]);

            const loadSupportedBanks = async () => {
                try {
                    const banks = await apiFetch('/rpa/banks');
                    if (Array.isArray(banks) && banks.length > 0) {
                        setSupportedBanks(banks);
                        setSelectedBank(banks[0].key || banks[0].bank_name || 'sbi');
                    }
                } catch (e) {
                    console.error('Failed to load RPA supported banks', e);
                    setSupportedBanks([
                        { key: 'sbi', name: 'State Bank of India (SBI Online)' },
                        { key: 'hdfc', name: 'HDFC Bank NetBanking' },
                        { key: 'icici', name: 'ICICI Corporate Banking' },
                        { key: 'canara', name: 'Canara Bank NetBanking' }
                    ]);
                    setSelectedBank('sbi');
                }
            };

            const loadRecentJobs = async () => {
                try {
                    const list = await apiFetch('/rpa/jobs');
                    if (Array.isArray(list)) setRpaJobs(list);
                } catch (e) {}
            };

            useEffect(() => {
                loadSupportedBanks();
                loadRecentJobs();
            }, []);

            // Status Polling Effect
            useEffect(() => {
                if (!activeJobId) return;

                let intervalId = null;
                const pollStatus = async () => {
                    try {
                        const data = await apiFetch(`/rpa/status/${activeJobId}`);
                        setJobStatus(data.status);
                        if (data.error_message) setErrorMessage(data.error_message);

                        if (data.status === 'SUCCESS' || data.status === 'COMPLETED') {
                            clearInterval(intervalId);
                            setLoading(false);
                            loadRecentJobs();
                            if (onImportComplete) onImportComplete();
                            window.dispatchEvent(new Event('transactions_updated'));
                        } else if (data.status === 'FAILED') {
                            clearInterval(intervalId);
                            setLoading(false);
                            loadRecentJobs();
                        }
                    } catch (err) {
                        console.error('Error polling RPA job status:', err);
                    }
                };

                pollStatus();
                intervalId = setInterval(pollStatus, 2000);

                return () => clearInterval(intervalId);
            }, [activeJobId]);

            const handleStartJob = async (e) => {
                e.preventDefault();
                if (!userAcknowledged) {
                    alert('You must acknowledge automated access authorization to proceed.');
                    return;
                }
                setLoading(true);
                setErrorMessage('');
                setJobStatus('STARTING');
                setOtpInput('');
                setPdfPasswordInput('');

                try {
                    const payload = {
                        bank_name: selectedBank,
                        start_date: startDate,
                        end_date: endDate,
                        username: username,
                        password: password,
                        user_acknowledged: userAcknowledged
                    };
                    if (accountNumber) payload.account_number = accountNumber;
                    if (dob) payload.dob = dob;

                    const res = await apiFetch('/rpa/start', {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });

                    // Clear credential state immediately after submission
                    setUsername('');
                    setPassword('');

                    setActiveJobId(res.job_id);
                    setJobStatus(res.status || 'QUEUED');
                } catch (err) {
                    setErrorMessage(err.message || 'Failed to start RPA download job.');
                    setJobStatus('FAILED');
                    setLoading(false);
                }
            };

            const handleSubmitOtp = async (e) => {
                e.preventDefault();
                if (!otpInput.trim()) return;
                setSubmittingAuth(true);
                try {
                    await apiFetch(`/rpa/otp/${activeJobId}`, {
                        method: 'POST',
                        body: JSON.stringify({ otp: otpInput.trim() })
                    });
                    setOtpInput('');
                    setJobStatus('VERIFYING_OTP');
                } catch (err) {
                    setErrorMessage(err.message || 'Failed to submit OTP');
                } finally {
                    setSubmittingAuth(false);
                }
            };

            const handleSubmitPdfPassword = async (e) => {
                e.preventDefault();
                if (!pdfPasswordInput.trim()) return;
                setSubmittingAuth(true);
                try {
                    await apiFetch(`/rpa/pdf-password/${activeJobId}`, {
                        method: 'POST',
                        body: JSON.stringify({ pdf_password: pdfPasswordInput.trim() })
                    });
                    setPdfPasswordInput('');
                    setJobStatus('RESUMING');
                } catch (err) {
                    setErrorMessage(err.message || 'Failed to submit PDF password');
                } finally {
                    setSubmittingAuth(false);
                }
            };

            const handleReset = () => {
                setActiveJobId(null);
                setJobStatus(null);
                setErrorMessage('');
                setLoading(false);
                setOtpInput('');
                setPdfPasswordInput('');
            };

            const getStatusBadge = (status) => {
                switch (status) {
                    case 'QUEUED':
                    case 'STARTING':
                    case 'LOGGING_IN':
                        return <span className="badge badge-warn"> {status}</span>;
                    case 'AWAITING_OTP':
                    case 'VERIFYING_OTP':
                        return <span className="badge badge-warning" style={{ background: '#fef3c7', color: '#92400e' }}> AWAITING OTP</span>;
                    case 'AWAITING_PDF_PASSWORD':
                        return <span className="badge badge-warning" style={{ background: '#fef3c7', color: '#92400e' }}> AWAITING PDF PASSWORD</span>;
                    case 'DOWNLOADING':
                    case 'PARSING':
                    case 'IMPORTING':
                        return <span className="badge badge-dark"> {status}</span>;
                    case 'SUCCESS':
                    case 'COMPLETED':
                        return <span className="badge badge-ok"> SUCCESS</span>;
                    case 'FAILED':
                        return <span className="badge badge-error"> FAILED</span>;
                    default:
                        return <span className="badge">{status || 'PENDING'}</span>;
                }
            };

            return (
                <div>
                    {/* Top KPI Summary */}
                    <div className="stats-grid" style={{ marginBottom: '1.5rem' }}>
                        <div className="stat-card">
                            <div className="stat-label">RPA ENGINE MODE</div>
                            <div className="stat-value" style={{ fontSize: '0.72rem' }}>Playwright Headless</div>
                            <div className="stat-change">Direct Bank Portal Downloader</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-label">REGISTERED ADAPTERS</div>
                            <div className="stat-value">{supportedBanks.length || 4} Banks</div>

                    {/* Recent Jobs Table */}
                    {rpaJobs.length > 0 && (

                                                    {(j.job_id || String(j.id)).substring(0, 13)}...
                                                </td>
                                                <td style={{ fontWeight: '600' }}>{(j.bank_name || 'sbi').toUpperCase()}</td>
                                                <td style={{ fontSize: '0.48rem' }}>{j.start_date || j.date_range_start} to {j.end_date || j.date_range_end}</td>
                                                <td style={{ fontSize: '0.48rem' }}>{j.created_at ? String(j.created_at).substring(0, 16) : '—'}</td>
                                                <td>{getStatusBadge(j.status)}</td>

        }

        function IngestionView({ navigate }) {
            const [subtab, setSubtab] = useState('upload');

            const [uploadMsg, setUploadMsg] = useState('');
            const [uploadStatus, setUploadStatus] = useState('');
            const [userFiles, setUserFiles] = useState([]);
            const [selectedFileId, setSelectedFileId] = useState(null);
            const [categorizedTxns, setCategorizedTxns] = useState([]);
            const [loadingTxns, setLoadingTxns] = useState(false);
            // Account binding for manual upload. The list comes off the filter
            // context rather than a second /v1/bank-master/accounts request:
            // AppLayout fetches the identical unfiltered list on mount, so this
            // tab was paying for the same round trip again before its upload
            // control could enable itself.
            const { accounts: uploadAccounts = [] } = React.useContext(FilterContext);
            const [selectedUploadAccountId, setSelectedUploadAccountId] = useState('');
            // Manual upload password handling
            const [manualPdfPassword, setManualPdfPassword] = useState('');
            const [showManualPasswordPrompt, setShowManualPasswordPrompt] = useState(false);
            const [pendingFile, setPendingFile] = useState(null);

            // Search, Filter, Sort & Pagination state for Categorized Transactions Output
            const [catSearchText, setCatSearchText] = useState('');
            const [catCategoryFilter, setCatCategoryFilter] = useState('');
            const [catStartDate, setCatStartDate] = useState('');
            const [catEndDate, setCatEndDate] = useState('');
            const [catPageSize, setCatPageSize] = useState(50);
            const [catCurrentPage, setCatCurrentPage] = useState(1);
            const [catSortField, setCatSortField] = useState('date');
            const [catSortDir, setCatSortDir] = useState('desc');

            const loadUserFiles = async () => {
                try {
                    const files = await apiFetch('/files/');
                    setUserFiles(files);
                } catch (e) {}
            };

            const loadTxnsForFile = async (fileId) => {
                setLoadingTxns(true);
                setSelectedFileId(fileId);
                setCatCurrentPage(1);
                try {
                    const url = fileId ? `/transactions?file_id=${fileId}&limit=50000` : '/transactions?limit=50000';
                    const txns = await apiFetch(url);
                    setCategorizedTxns(Array.isArray(txns) ? txns : []);
                } catch (e) {
                    console.error(e);
                } finally {
                    setLoadingTxns(false);
                }
            };

            // Dynamic categories list from loaded dataset
            const catCategoriesList = React.useMemo(() => {
                const set = new Set();
                categorizedTxns.forEach(t => {
                    if (t.final_category) set.add(t.final_category);
                });
                return Array.from(set).sort();
            }, [categorizedTxns]);

            // Filtered dataset
            const filteredCategorizedTxns = React.useMemo(() => {
                let res = categorizedTxns || [];
                if (catSearchText) {
                    const q = catSearchText.toLowerCase();
                    res = res.filter(t => (t.description || '').toLowerCase().includes(q));
                }
                if (catCategoryFilter) {
                    res = res.filter(t => (t.final_category || '').toLowerCase() === catCategoryFilter.toLowerCase());
                }
                if (catStartDate) {
                    res = res.filter(t => t.date && String(t.date).substring(0, 10) >= catStartDate);
                }
                if (catEndDate) {
                    res = res.filter(t => t.date && String(t.date).substring(0, 10) <= catEndDate);
                }
                return res;
            }, [categorizedTxns, catSearchText, catCategoryFilter, catStartDate, catEndDate]);

            // Sorted dataset
            const sortedCategorizedTxns = React.useMemo(() => {
                const arr = [...filteredCategorizedTxns];
                arr.sort((a, b) => {
                    let va = a[catSortField];
                    let vb = b[catSortField];
                    if (catSortField === 'date') {
                        va = a.date || '';
                        vb = b.date || '';
                    } else if (catSortField === 'debit' || catSortField === 'credit' || catSortField === 'balance') {
                        va = Number(va) || 0;
                        vb = Number(vb) || 0;
                    } else {
                        va = String(va || '').toLowerCase();
                        vb = String(vb || '').toLowerCase();
                    }
                    if (va < vb) return catSortDir === 'asc' ? -1 : 1;
                    if (va > vb) return catSortDir === 'asc' ? 1 : -1;
                    return 0;
                });
                return arr;
            }, [filteredCategorizedTxns, catSortField, catSortDir]);

            // Paginated dataset slice
            const catTotalPages = Math.max(1, Math.ceil(sortedCategorizedTxns.length / catPageSize));
            const paginatedCategorizedTxns = React.useMemo(() => {
                const start = (catCurrentPage - 1) * catPageSize;
                return sortedCategorizedTxns.slice(start, start + catPageSize);
            }, [sortedCategorizedTxns, catCurrentPage, catPageSize]);

            const handleCatSort = (field) => {
                if (catSortField === field) {
                    setCatSortDir(d => d === 'asc' ? 'desc' : 'asc');
                } else {
                    setCatSortField(field);
                    setCatSortDir('asc');
                }
            };

            useEffect(() => {
                loadUserFiles();
                loadTxnsForFile(null);
            }, []);

            // The default selection used to be set inside the accounts fetch that
            // this tab no longer makes. Guarded on "nothing chosen yet" so a
            // later refresh of the shared list cannot yank the account out from
            // under someone who is midway through picking one.
            useEffect(() => {
                if (!selectedUploadAccountId && uploadAccounts.length > 0) {
                    setSelectedUploadAccountId(uploadAccounts[0].id);
                }
            }, [uploadAccounts]);

            const pollFileStatus = (fileId, filename) => {
                setUploadStatus('PROCESSING');
                setUploadMsg(` Processing '${filename}' via Rule + CatBoost ML Pipeline...`);

                let attempts = 0;
                const interval = setInterval(async () => {
                    attempts++;
                    try {
                        const fileData = await apiFetch(`/files/${fileId}`);
                        if (fileData.status === 'COMPLETED') {
                            clearInterval(interval);
                            setUploadStatus('COMPLETED');
                            setUploadMsg(` '${filename}' successfully parsed & categorized!`);
                            loadTxnsForFile(fileId);
                            loadUserFiles();
                            window.dispatchEvent(new Event('transactions_updated'));
                        } else if (fileData.status === 'FAILED') {
                            clearInterval(interval);
                            setUploadStatus('FAILED');
                            setUploadMsg(` Processing failed for '${filename}'`);
                        } else if (attempts >= 15) {
                            clearInterval(interval);
                            setUploadStatus('COMPLETED');
                            setUploadMsg(` Processing finished for '${filename}'`);
                            loadTxnsForFile(fileId);
                            window.dispatchEvent(new Event('transactions_updated'));
                        }
                    } catch (err) {
                        console.error(err);
                    }
                }, 1000);
            };

            const handleFileUpload = async (e, passwordOverride) => {
                let file = (e && e.target && e.target.files) ? e.target.files[0] : (pendingFile || null);
                if (!file) return;
                setPendingFile(file);

                const formData = new FormData();
                formData.append('file', file);
                const pwdToUse = passwordOverride || manualPdfPassword;
                if (pwdToUse) {
                    formData.append('pdf_password', pwdToUse);
                }

                setUploadMsg(`Uploading '${file.name}'...`);
                setUploadStatus('UPLOADING');
                try {
                    const token = localStorage.getItem('access_token');
                    const accountParam = selectedUploadAccountId ? `?account_id=${selectedUploadAccountId}` : '';
                    const res = await fetch(`/files/upload${accountParam}`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` },
                        body: formData
                    });
                    const data = await res.json();
                    if (res.ok) {
                        setShowManualPasswordPrompt(false);
                        setManualPdfPassword('');
                        pollFileStatus(data.file_id, file.name);
                    } else {
                        const detailStr = String(data.detail || '');
                        if (detailStr.includes('PDF_PASSWORD_REQUIRED') || detailStr.includes('PASSWORD_INVALID')) {
                            setShowManualPasswordPrompt(true);
                            setUploadStatus('PASSWORD_REQUIRED');
                            setUploadMsg(detailStr.includes('PASSWORD_INVALID')
                                ? ` Invalid PDF document password for '${file.name}'. Please check and try again.`
                                : ` '${file.name}' is password-protected. Please enter the document password to unlock & process.`);
                        } else {
                            setUploadStatus('FAILED');
                            setUploadMsg(` Upload failed: ${data.detail}`);
                        }
                    }
                } catch (err) {
                    setUploadStatus('FAILED');
                    setUploadMsg(` Error: ${err.message}`);
                }
            };

            const handleSampleUpload = async () => {
                const sampleCsv = `Date,Description,Debit,Credit,Balance
2026-01-02,SALARY CREDIT HDFC BANK,0.00,250000.00,550000.00
2026-01-05,SWIGGY BANGALORE UPI/409812,450.00,0.00,549550.00
2026-01-08,ELECTRICITY BILL BESCOM,3200.00,0.00,546350.00
2026-01-12,VENDOR PAYMENT INFOSYS LTD,45000.00,0.00,501350.00
2026-01-18,DIVIDEND RECEIVED TATA MOTORS,0.00,12500.00,513850.00
2026-01-22,AWS CLOUD SERVICES BILL,8900.00,0.00,504950.00
2026-01-28,TRANSFER TO SAVINGS A/C,20000.00,0.00,484950.00`;

                const blob = new Blob([sampleCsv], { type: 'text/csv' });
                const sampleFile = new File([blob], 'sample_statement.csv', { type: 'text/csv' });
                
                const event = { target: { files: [sampleFile] } };
                handleFileUpload(event);
            };

            const clearAllOutputs = async () => {
                if (!confirm("Are you sure you want to clear all categorized outputs?")) return;
                try {
                    await apiFetch('/transactions/clear', { method: 'DELETE' });
                    setSelectedFileId('');
                    setCategorizedTxns([]);
                    setUploadMsg('All categorized outputs cleared.');
                    await loadUserFiles();
                    await loadTxnsForFile(null);
                    window.dispatchEvent(new Event('transactions_updated'));
                } catch (e) {
                    console.error(e);
                }
            };

            return (
                <div>
                    <div className="card">
                        <div className="card-header" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '0.75rem' }}>
                            <h3>Multi-Channel Statement Ingestion</h3>
                            <div style={{ display: 'flex', gap: '0.5rem', flexWrap: 'wrap' }}>
                                {['upload', 'rpa', 'aa', 'email'].map(t => (
                                    <button key={t} className={`btn btn-sm ${subtab === t ? 'btn-primary' : ''}`} onClick={() => setSubtab(t)}>
                                        {t === 'upload' ? 'MANUAL UPLOAD' : t === 'rpa' ? 'RPA AUTOMATION' : t === 'aa' ? 'ACCOUNT AGGREGATOR' : 'EMAIL PICKUP'}
                                    </button>
                                ))}
                            </div>
                        </div>
                        <div className="card-body">
                            {subtab === 'upload' && (
                                <div>
                                    <div style={{ border: '2px dashed var(--gray-400)', padding: '2.5rem 1.5rem', textAlign: 'center', background: 'var(--white)' }}>
                                        <h4>Manual File Upload</h4>
                                        <p style={{ color: 'var(--gray-600)', margin: '0.5rem 0 0.75rem' }}>Upload Bank Statements (PDF, CSV, Excel)</p>
                                        {/* Account binding selector */}
                                        {uploadAccounts.length > 0 ? (
                                            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '0.75rem', margin: '1.25rem auto 1.5rem', maxWidth: '600px', flexWrap: 'wrap' }}>
                                                <label style={{ margin: 0, fontWeight: 'bold', fontSize: '0.52rem', whiteSpace: 'nowrap', color: 'var(--gray-800)', letterSpacing: '0.5px' }}>BIND TO ACCOUNT:</label>
                                                <select
                                                    value={selectedUploadAccountId}
                                                    onChange={e => setSelectedUploadAccountId(e.target.value)}
                                                    style={{ width: 'auto', flex: '1 1 auto', minWidth: '260px', maxWidth: '400px', height: '36px', padding: '0.35rem 0.75rem', fontSize: '0.52rem', border: '1px solid var(--gray-400)', background: '#fff', color: 'var(--gray-900)', boxSizing: 'border-box' }}
                                                >
                                                    {uploadAccounts.map(a => (
                                                        <option key={a.id} value={a.id}>
                                                            {a.account_number_masked} — {a.bank_name || a.bank_code} {a.entity_name ? `(${a.entity_name})` : ''}
                                                        </option>

        // --- Reconciliation View Component ---
        function ReconciliationView() {
            const [phase, setPhase] = useState('upload'); // 'upload' | 'running' | 'results' | 'error'
            const [accountId, setAccountId] = useState('');
            // Same unfiltered account list AppLayout already holds. Fetching it
            // again here meant the Bank Account select on this tab could not be
            // populated until a round trip that had already been made completed
            // a second time.
            const { accounts = [] } = React.useContext(FilterContext);
            // ledger_convention: 'STANDARD' = normal CSV (Debit=Out, Credit=In)
            //                     'DEBIT_IN'  = Tally style (Debit=In, Credit=Out)
            const [ledgerConvention, setLedgerConvention] = useState('STANDARD');
            const [periodFrom, setPeriodFrom] = useState('');
            const [periodTo, setPeriodTo] = useState('');
            const [runResult, setRunResult] = useState(null);
            const [matches, setMatches] = useState([]);
            const [statusMsg, setStatusMsg] = useState('');
            const [errorMsg, setErrorMsg] = useState('');
            const [dragOver, setDragOver] = useState(false);

            const isFormValid = Boolean(accountId && periodFrom && periodTo && periodFrom <= periodTo);

            const validateInputs = () => {
                if (!accountId) {
                    alert('Please select a Bank Account before running reconciliation.');
                    return false;
                }
                if (!periodFrom) {
                    alert('Please select the Period Start date before running reconciliation.');
                    return false;
                }
                if (!periodTo) {
                    alert('Please select the Period End date before running reconciliation.');
                    return false;
                }
                if (periodFrom > periodTo) {
                    alert('Period Start cannot be after Period End.');
                    return false;
                }
                return true;
            };

            const runFullFlow = async (file) => {
                if (!validateInputs()) return;

                setPhase('running');
                setErrorMsg('');

                try {
                    // Step 1: Upload & auto-preview
                    setStatusMsg(' Reading your books file...');
                    const token = localStorage.getItem('access_token');
                    const formData = new FormData();
                    formData.append('file', file);

                    const previewRes = await fetch('/v1/reconciliation/imports', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` },
                        body: formData
                    });
                    const previewData = await previewRes.json();
                    if (!previewRes.ok) throw new Error(previewData.detail || 'Could not read the file');

                    if (previewData.is_bank_statement) {
                        throw new Error('This looks like a bank statement, not a books ledger. Please upload the file exported from Tally or your accounting software — not the bank PDF.');
                    }

                    // Step 2: Auto-confirm with detected mapping (no user intervention)
                    setStatusMsg(' Matching columns automatically...');
                    const mapping = previewData.detected_mapping || {};
                    const acctId = accountId;
                    if (!acctId) {
                        throw new Error('Please select a bank account before running reconciliation.');
                    }

                    const confirmRes = await fetch('/v1/reconciliation/imports/confirm', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify({
                            account_id: acctId,
                            column_mapping: mapping,
                            date_format: '%Y-%m-%d',
                            save_as_template: false,
                            template_name: '',
                            ledger_convention: ledgerConvention,
                            rows: previewData.sample_rows
                        })
                    });
                    const confirmData = await confirmRes.json();
                    if (!confirmRes.ok) throw new Error(confirmData.detail || 'Could not import the books file');

                    const batchId = confirmData.batch_id;
                    const runFrom = periodFrom || confirmData.period_from;
                    const runTo = periodTo || confirmData.period_to;

                    // Step 3: Run reconciliation
                    setStatusMsg('️ Comparing your books against the bank statement...');
                    const runRes = await apiFetch('/v1/reconciliation/runs', {
                        method: 'POST',
                        body: JSON.stringify({
                            account_id: acctId,
                            period_from: runFrom,
                            period_to: runTo,
                            import_batch_id: batchId,
                            force: true
                        })
                    });

                    // Step 4: Fetch full run detail
                    setStatusMsg(' Preparing your report...');
                    // In parallel: both are keyed on the run id that step 3 just
                    // returned, so neither depends on the other, but they were
                    // awaited one after the other — the results screen waited out
                    // two full round trips before it could appear at all.
                    const [runDetail, matchList] = await Promise.all([
                        apiFetch(`/v1/reconciliation/runs/${runRes.run_id}`),
                        apiFetch(`/v1/reconciliation/runs/${runRes.run_id}/matches?status=pending_review`).catch(() => [])
                    ]);

                    setRunResult(runDetail);
                    setMatches(Array.isArray(matchList) ? matchList : []);
                    setPhase('results');
                } catch (err) {
                    setErrorMsg(err.message || 'Something went wrong. Please try again.');
                    setPhase('error');
                }
            };

            const handleFileDrop = (e) => {
                e.preventDefault();
                setDragOver(false);
                if (!validateInputs()) return;
                const f = e.dataTransfer.files[0];
                if (f) runFullFlow(f);
            };

            const handleFileInput = (e) => {
                const f = e.target.files[0];
                if (!f) return;
                if (!validateInputs()) {
                    e.target.value = '';
                    return;
                }
                runFullFlow(f);
            };

            // Helper: format paise to ₹ string
            const rs = (paise) => '₹' + (paise / 100).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

            // Verdict labels in plain English
            const verdictInfo = (verdict, residual, actionCount) => {
                if (!verdict) return { label: '—', subtext: '', color: '#6b7280', bg: '#f3f4f6', icon: '' };
                const clean = verdict === 'reconciled_clean';
                const exceptions = verdict === 'reconciled_with_exceptions';
                if (clean) return { 
                    label: 'All Clear — Books match Bank ', 
                    subtext: 'Books and bank balances match completely with zero outstanding items.',
                    color: '#166534', bg: '#f0fdf4', border: '#bbf7d0', icon: '' 
                };
                if (exceptions) return { 
                    label: 'Reconciled with Outstanding Items', 
                    subtext: actionCount > 0 
                        ? `Books and bank balances reconcile, but ${actionCount} transaction${actionCount === 1 ? ' requires' : 's require'} action.`
                        : 'Books and bank balances reconcile, but outstanding items exist.',
                    color: '#92400e', bg: '#fffbeb', border: '#fde68a', icon: '️' 
                };
                return { 
                    label: 'Difference Found — Needs Attention', 
                    subtext: residual > 0 
                        ? `Unexplained difference: ${rs(Math.abs(residual))} — bank shows more than books`
                        : `Unexplained difference: ${rs(Math.abs(residual))} — books show more than bank`,
                    color: '#991b1b', bg: '#fef2f2', border: '#fecaca', icon: '' 
                };
            };

            // Plain English item descriptions
            const itemLabel = (item) => {
                const cat = (item.category || item.brs_category || '').toLowerCase();
                if (cat === 'interest_credit') {
                    return { label: 'Interest received', icon: '' };
                }
                if (cat === 'direct_credit') {
                    return { label: 'Direct credit', icon: '' };
                }
                if (cat === 'bank_charge') {
                    return { label: 'Bank charge', icon: '' };
                }
                if (cat === 'standing_instruction') {
                    return { label: 'Standing instruction', icon: '' };
                }
                if (cat === 'dishonoured_cheque') {
                    return { label: 'Dishonoured cheque', icon: '️' };
                }
                if (cat === 'unmatched_bank_transaction') {
                    return { label: 'Unexplained bank transaction', icon: '' };
                }
                if (cat.includes('unpresented')) {
                    return { label: 'Cheque issued but not yet cleared at bank', icon: '' };
                }
                if (cat.includes('uncleared') || cat.includes('transit')) {
                    return { label: 'Payment made but not yet shown in bank', icon: '' };
                }
                if (cat === 'duplicate_ledger_credit') {
                    return { label: 'Duplicate ledger credit — books overcounted (reversed)', icon: '️' };
                }
                if (cat === 'duplicate_ledger_debit') {
                    return { label: 'Duplicate ledger debit — books overcounted (reversed)', icon: '️' };
                }
                return { label: item.category || 'Timing difference', icon: '' };
            };

            // Human-readable exception reasons
            const formatExceptionReason = (reason) => {
                if (!reason) return '';
                const r = String(reason).toLowerCase();
                if (r === 'journal_entry_required') return 'Journal entry required';
                if (r === 'deposit_in_transit_delayed') return 'Payment made but not yet shown in bank';
                if (r === 'stale_cheque_write_back_required') return 'Stale cheque — write back required';
                if (r === 'duplicate_ledger_row') return 'Duplicate ledger entry';
                return reason.replace(/_/g, ' ');
            };

            return (
                <div>
                    {/* Upload phase */}
                    {phase === 'upload' && (
                        <div className="card" style={{ marginBottom: '1.5rem' }}>
                            <div className="card-header">
                                <h3>Bank Reconciliation</h3>
                                <span style={{ fontSize: '0.48rem', color: 'var(--gray-600)' }}>Upload your Tally/ERP books ledger to compare against the bank statement</span>
                            </div>
                            <div className="card-body">
                                {/* Account + Period + Convention row */}
                                <div style={{ display: 'flex', gap: '1.5rem', marginBottom: '1.5rem', alignItems: 'flex-end', flexWrap: 'wrap' }}>
                                    <div>
                                        <label style={{ display: 'block', fontWeight: 'bold', fontSize: '0.48rem', marginBottom: '0.4rem' }}>
                                            BANK ACCOUNT <span style={{ color: '#dc2626' }}>*</span>
                                        </label>
                                        <select
                                            value={accountId}
                                            onChange={e => setAccountId(e.target.value)}
                                            style={{ minWidth: '240px' }}
                                            id="recon-account-select"
                                        >
                                            <option value="">-- Select Bank Account --</option>
                                            {accounts.map(a => (
                                                <option key={a.id} value={a.id}>
                                                    {a.account_number_masked} — {a.bank_name || a.bank_code}
                                                </option>
                                            ))}
                                        </select>
                                    </div>
                                    <div>
                                        <label style={{ display: 'block', fontWeight: 'bold', fontSize: '0.48rem', marginBottom: '0.4rem' }}>
                                            PERIOD START <span style={{ color: '#dc2626' }}>*</span>
                                        </label>
                                        <input type="date" value={periodFrom} onChange={e => setPeriodFrom(e.target.value)} />
                                    </div>
                                    <div>
                                        <label style={{ display: 'block', fontWeight: 'bold', fontSize: '0.48rem', marginBottom: '0.4rem' }}>
                                            PERIOD END <span style={{ color: '#dc2626' }}>*</span>
                                        </label>
                                        <input type="date" value={periodTo} onChange={e => setPeriodTo(e.target.value)} />
                                    </div>
                                    <div>
                                        <label style={{ display: 'block', fontWeight: 'bold', fontSize: '0.48rem', marginBottom: '0.4rem' }}>LEDGER FORMAT</label>
                                        <select
                                            value={ledgerConvention}
                                            onChange={e => setLedgerConvention(e.target.value)}
                                            id="recon-convention-select"
                                            style={{ minWidth: '260px' }}
                                        >
                                            <option value="STANDARD">STANDARD — Debit=Out, Credit=In (CSV/Excel)</option>
                                            <option value="DEBIT_IN">DEBIT_IN — Debit=In, Credit=Out (Tally)</option>
                                        </select>
                                    </div>
                                </div>

                                {!isFormValid && (
                                    <div style={{ color: '#991b1b', background: '#fef2f2', border: '1px solid #fecaca', padding: '0.45rem 0.8rem', marginBottom: '1.25rem', fontSize: '0.48rem' }}>
                                        * Bank Account, Period Start, and Period End are required before running reconciliation.
                                    </div>
                                )}

                                {/* Drop zone */}
                                <div
                                    onDragOver={e => { e.preventDefault(); setDragOver(true); }}
                                    onDragLeave={() => setDragOver(false)}
                                    onDrop={handleFileDrop}
                                    style={{
                                        border: `2px dashed ${dragOver ? 'var(--primary)' : 'var(--gray-400)'}`,
                                        borderRadius: '8px',
                                        padding: '4rem 2rem',
                                        textAlign: 'center',
                                        background: dragOver ? 'rgba(59,130,246,0.04)' : 'var(--white)',
                                        transition: 'all 0.2s',
                                        opacity: isFormValid ? 1 : 0.7
                                    }}
                                >
                                    <div style={{ fontSize: '1.8rem', marginBottom: '1rem' }}></div>
                                    <h4 style={{ marginBottom: '0.5rem' }}>Drop your Books Ledger here</h4>
                                    <p style={{ color: 'var(--gray-600)', marginBottom: '1.5rem', fontSize: '0.54rem' }}>
                                        Upload the CSV or Excel file exported from Tally, QuickBooks, or your accounting software.<br />
                                        <strong>Do not upload the bank PDF here</strong> — use "Statement Ingestion" for that.
                                    </p>
                                    <input type="file" id="recon-file-input" style={{ display: 'none' }} accept=".csv,.xlsx,.xls" onChange={handleFileInput} disabled={!isFormValid} />
                                    {isFormValid ? (
                                        <label htmlFor="recon-file-input" className="btn btn-primary" style={{ cursor: 'pointer', padding: '0.75rem 2rem', fontSize: '0.6rem' }}>
