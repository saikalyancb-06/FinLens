                                            Choose Books File
                                        </label>
                                    ) : (
                                        <button type="button" onClick={validateInputs} className="btn btn-primary" style={{ cursor: 'not-allowed', padding: '0.75rem 2rem', fontSize: '0.6rem', opacity: 0.6 }}>
                                            Choose Books File
                                        </button>
                                    )}
                                </div>

                                {/* How it works */}
                                <div style={{ marginTop: '2rem', display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '1rem' }}>
                                    {[
                                        { num: '1', title: 'Upload', desc: 'Drop your Tally/ERP export — we auto-detect all columns' },
                                        { num: '2', title: 'Compare', desc: 'We match every entry against your bank statement automatically' },
                                        { num: '3', title: 'Report', desc: 'See exactly what matches, what\'s pending, and what needs attention' }
                                    ].map(s => (
                                        <div key={s.num} style={{ background: 'var(--gray-100)', borderRadius: '8px', padding: '1.25rem', textAlign: 'center' }}>
                                            <div style={{ width: '36px', height: '36px', borderRadius: '50%', background: 'var(--black)', color: 'var(--white)', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 0.75rem', fontWeight: 'bold', fontSize: '0.6rem' }}>{s.num}</div>
                                            <div style={{ fontWeight: 'bold', marginBottom: '0.4rem' }}>{s.title}</div>
                                            <div style={{ fontSize: '0.48rem', color: 'var(--gray-600)' }}>{s.desc}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Running phase */}
                    {phase === 'running' && (
                        <div className="card">
                            <div className="card-body" style={{ padding: '4rem', textAlign: 'center' }}>
                                <div style={{ fontSize: '1.8rem', marginBottom: '1rem', animation: 'spin 1.5s linear infinite', display: 'inline-block' }}>️</div>
                                <h3 style={{ marginBottom: '0.5rem' }}>Working on it…</h3>
                                <p style={{ color: 'var(--gray-600)', fontSize: '0.57rem' }}>{statusMsg}</p>
                            </div>
                        </div>
                    )}

                    {/* Error phase */}
                    {phase === 'error' && (
                        <div className="card">
                            <div className="card-body" style={{ padding: '3rem', textAlign: 'center' }}>
                                <div style={{ fontSize: '1.8rem', marginBottom: '1rem' }}></div>
                                <h3 style={{ color: '#991b1b', marginBottom: '0.75rem' }}>Something went wrong</h3>
                                <p style={{ color: 'var(--gray-600)', marginBottom: '1.5rem', maxWidth: '500px', margin: '0 auto 1.5rem' }}>{errorMsg}</p>
                                <button className="btn btn-primary" onClick={() => { setPhase('upload'); setErrorMsg(''); }}>Try Again</button>
                            </div>
                        </div>
                    )}

                    {/* Results phase */}
                    {phase === 'results' && runResult && (() => {
                        const bookItems = (runResult.items || []).filter(i => i.side === 'book');
                        const bankItems = (runResult.items || []).filter(i => i.side === 'bank');
                        const actionRequiredCount = bankItems.length;
                        const vInfo = verdictInfo(runResult.verdict, runResult.residual_paise, actionRequiredCount);
                        const residual = runResult.residual_paise || 0;

                        return (
                            <div>
                                {/* Top action bar */}
                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.5rem' }}>
                                    <div>
                                        <h2 style={{ fontSize: '0.9rem', fontWeight: 'bold', marginBottom: '0.25rem' }}>Reconciliation Report</h2>
                                        <p style={{ color: 'var(--gray-600)', fontSize: '0.51rem' }}>{periodFrom} to {periodTo}</p>
                                    </div>
                                    <div style={{ display: 'flex', gap: '0.75rem' }}>
                                        <button className="btn btn-sm" onClick={() => { setPhase('upload'); setRunResult(null); setMatches([]); }}>
                                             Start New
                                        </button>
                                        <button 
                                            className="btn btn-sm btn-primary"
                                            onClick={async () => {
                                                try {
                                                    const token = localStorage.getItem('access_token');
                                                    if (!token) {
                                                        alert('Session expired. Please log in again.');
                                                        return;
                                                    }
                                                    const res = await fetch(`/v1/reconciliation/runs/${runResult.id}/export`, {
                                                        headers: { 'Authorization': `Bearer ${token}` }
                                                    });
                                                    if (!res.ok) {
                                                        const errData = await res.json().catch(() => ({}));
                                                        throw new Error(errData.detail || `Server returned status ${res.status}`);
                                                    }
                                                    const blob = await res.blob();
                                                    const url = window.URL.createObjectURL(blob);
                                                    const a = document.createElement('a');
                                                    a.href = url;
                                                    a.download = `BRS_Reconciliation_${runResult.id}.pdf`;
                                                    document.body.appendChild(a);
                                                    a.click();
                                                    a.remove();
                                                    window.URL.revokeObjectURL(url);
                                                } catch (e) {
                                                    alert('Error downloading report: ' + e.message);
                                                }
                                            }}
                                        >
                                             Download Report
                                        </button>
                                    </div>
                                </div>

                                {/* Verdict banner */}
                                <div style={{
                                    background: vInfo.bg,
                                    border: `2px solid ${vInfo.border || '#e5e7eb'}`,
                                    borderRadius: '12px',
                                    padding: '1.5rem 2rem',
                                    marginBottom: '1.5rem',
                                    display: 'flex',
                                    alignItems: 'center',
                                    gap: '1.25rem'
                                }}>
                                    <div style={{ fontSize: '1.5rem' }}>{vInfo.icon}</div>
                                    <div style={{ flex: 1 }}>
                                        <div style={{ fontWeight: 'bold', fontSize: '0.75rem', color: vInfo.color }}>{vInfo.label}</div>
                                        <div style={{ marginTop: '0.25rem', fontSize: '0.54rem', color: vInfo.color }}>{vInfo.subtext}</div>
                                    </div>
                                </div>

                                {/* Summary KPIs */}
                                <div className="stats-grid" style={{ marginBottom: '1.5rem' }}>
                                    <div className="stat-card">
                                        <div className="stat-label">{runResult.has_book_opening ? 'BOOK CLOSING BALANCE' : 'BOOK CLOSING POSITION'}</div>
                                        <div className="stat-value" style={{ fontSize: '0.78rem' }}>{rs(runResult.book_closing_paise || 0)}</div>
                                        <div className="stat-change">
                                            {runResult.has_book_opening 
                                                ? `Opening book balance ${rs(runResult.opening_balance_paise || 0)} + net movement ${rs(runResult.net_movement_paise || 0)}` 
                                                : `Opening balance ${rs(runResult.opening_balance_paise || 0)} + net book movement ${rs(runResult.net_movement_paise || 0)}`}
                                        </div>
                                    </div>
                                    <div className="stat-card">
                                        <div className="stat-label">BALANCE AS PER BANK</div>
                                        <div className="stat-value" style={{ fontSize: '0.78rem' }}>{rs(runResult.bank_closing_paise || 0)}</div>
                                        <div className="stat-change">Closing balance per bank statement</div>
                                    </div>
                                    <div className="stat-card">
                                        <div className="stat-label">TIMING DIFFERENCES</div>
                                        <div className="stat-value">{bookItems.length}</div>
                                        <div className="stat-change">Entries with known timing gap</div>
                                    </div>
                                    <div className="stat-card">
                                        <div className="stat-label">JOURNAL ENTRIES REQUIRED</div>
                                        <div className="stat-value">{bankItems.length}</div>
                                        <div className="stat-change">Bank entries needing journal entry</div>
                                    </div>
                                </div>

                                {/* BRS Bridge — simplified */}
                                <div className="card" style={{ marginBottom: '1.5rem' }}>
                                    <div className="card-header">
                                        <h3>How the Balances Reconcile</h3>
                                        <span style={{ fontSize: '0.48rem', color: 'var(--gray-600)' }}>Starting from your books, we explain every difference to arrive at the bank balance</span>
                                    </div>
                                    <div className="card-body" style={{ padding: 0 }}>
                                        <table>
                                            <tbody>
                                                {!runResult.has_book_opening && (
                                                    <>
                                                        <tr>
                                                            <td style={{ padding: '0.6rem 1.25rem', color: 'var(--gray-700)' }}>
                                                                 Opening Balance (before period)
                                                            </td>
                                                            <td className="number-cell" style={{ padding: '0.6rem 1.25rem' }}>
                                                                {rs(runResult.opening_balance_paise || 0)}
                                                            </td>
                                                        </tr>
                                                        <tr>
                                                            <td style={{ padding: '0.6rem 1.25rem', color: 'var(--gray-700)' }}>
                                                                 Net In-Period Book Movement
                                                            </td>
                                                            <td className="number-cell" style={{ color: (runResult.net_movement_paise || 0) >= 0 ? '#166534' : '#991b1b', padding: '0.6rem 1.25rem' }}>
                                                                {(runResult.net_movement_paise || 0) >= 0 ? '+ ' : '− '}{rs(Math.abs(runResult.net_movement_paise || 0))}
                                                            </td>
                                                        </tr>
                                                        <tr style={{ background: 'var(--gray-100)', borderTop: '1px solid var(--gray-300)' }}>
                                                            <td style={{ padding: '0.9rem 1.25rem', fontWeight: 'bold' }}>
                                                                 BOOK CLOSING POSITION
                                                            </td>
                                                            <td className="number-cell" style={{ fontWeight: 'bold', fontSize: '0.63rem', padding: '0.9rem 1.25rem' }}>
                                                                {rs(runResult.book_closing_paise || 0)}
                                                            </td>
                                                        </tr>
                                                    </>
                                                )}
                                                {runResult.has_book_opening && (
                                                    <tr style={{ background: 'var(--gray-100)' }}>
                                                        <td style={{ padding: '0.9rem 1.25rem', fontWeight: 'bold' }}>
                                                             BOOK CLOSING BALANCE
                                                        </td>
                                                        <td className="number-cell" style={{ fontWeight: 'bold', fontSize: '0.63rem', padding: '0.9rem 1.25rem' }}>
                                                            {rs(runResult.book_closing_paise || 0)}
                                                        </td>
                                                    </tr>
                                                )}

                                                {bookItems.length > 0 && (
                                                    <tr><td colSpan="2" style={{ padding: '0.75rem 1.25rem 0.25rem', fontSize: '0.492rem', fontWeight: 'bold', color: 'var(--primary)', textTransform: 'uppercase', letterSpacing: '0.05em', borderTop: '1px solid var(--gray-200)' }}>TIMING DIFFERENCES</td></tr>
                                                )}

                                                {bookItems.filter(i => i.direction === 'add').length > 0 && (
                                                    <>
                                                        <tr><td colSpan="2" style={{ padding: '0.4rem 1.25rem 0.2rem 1.75rem', fontSize: '0.45rem', fontWeight: 'bold', color: 'var(--gray-600)', textTransform: 'uppercase' }}>Add: Payments in books not yet cleared at bank</td></tr>
                                                        {bookItems.filter(i => i.direction === 'add').map(it => {
                                                            const { label, icon } = itemLabel(it);
                                                            const excReason = formatExceptionReason(it.exception_reason);
                                                            const showExcBadge = it.exception_flag && excReason && 
                                                                excReason.toLowerCase() !== label.toLowerCase() && 
                                                                !label.toLowerCase().includes(excReason.toLowerCase());
                                                            return (
                                                                <tr key={it.id}>
                                                                    <td style={{ padding: '0.4rem 1.25rem 0.4rem 2.25rem', color: 'var(--gray-700)' }}>
                                                                        {icon} {label}
                                                                        {showExcBadge && (
                                                                            <span className="badge badge-warn" style={{ marginLeft: '0.5rem', fontSize: '0.42rem' }}>{excReason}</span>
                                                                        )}
                                                                        {it.age_days ? <span style={{ fontSize: '0.432rem', color: 'var(--gray-500)', marginLeft: '0.5rem' }}>{it.age_days} days old</span> : null}
                                                                    </td>
                                                                    <td className="number-cell" style={{ color: '#166534', padding: '0.4rem 1.25rem' }}>+ {rs(it.amount_paise)}</td>
                                                                </tr>
                                                            );
                                                        })}
                                                    </>
                                                )}

                                                {bookItems.filter(i => i.direction === 'subtract').length > 0 && (
                                                    <>
                                                        <tr><td colSpan="2" style={{ padding: '0.4rem 1.25rem 0.2rem 1.75rem', fontSize: '0.45rem', fontWeight: 'bold', color: 'var(--gray-600)', textTransform: 'uppercase' }}>Less: Uncleared deposits / Duplicate book entries</td></tr>
                                                        {bookItems.filter(i => i.direction === 'subtract').map(it => {
                                                            const { label, icon } = itemLabel(it);
                                                            const excReason = formatExceptionReason(it.exception_reason);
                                                            const showExcBadge = it.exception_flag && excReason && 
                                                                excReason.toLowerCase() !== label.toLowerCase() && 
                                                                !label.toLowerCase().includes(excReason.toLowerCase());
                                                            return (
                                                                <tr key={it.id}>
                                                                    <td style={{ padding: '0.4rem 1.25rem 0.4rem 2.25rem', color: 'var(--gray-700)' }}>
                                                                        {icon} {label}
                                                                        {showExcBadge && (
                                                                            <span className="badge badge-warn" style={{ marginLeft: '0.5rem', fontSize: '0.42rem' }}>{excReason}</span>
                                                                        )}
                                                                    </td>
                                                                    <td className="number-cell" style={{ color: '#991b1b', padding: '0.4rem 1.25rem' }}>− {rs(it.amount_paise)}</td>
                                                                </tr>
                                                            );
                                                        })}
                                                    </>
                                                )}

                                                {bankItems.length > 0 && (
                                                    <tr><td colSpan="2" style={{ padding: '0.75rem 1.25rem 0.25rem', fontSize: '0.492rem', fontWeight: 'bold', color: 'var(--primary)', textTransform: 'uppercase', letterSpacing: '0.05em', borderTop: '1px solid var(--gray-200)' }}>BANK ENTRIES NOT IN BOOKS</td></tr>
                                                )}

                                                {bankItems.filter(i => i.direction === 'add').length > 0 && (
                                                    <>
                                                        <tr><td colSpan="2" style={{ padding: '0.4rem 1.25rem 0.2rem 1.75rem', fontSize: '0.45rem', fontWeight: 'bold', color: 'var(--gray-600)', textTransform: 'uppercase' }}>Add: Bank credits not yet in books</td></tr>
                                                        {bankItems.filter(i => i.direction === 'add').map(it => {
                                                            const { label, icon } = itemLabel(it);
                                                            return (
                                                                <tr key={it.id}>
                                                                    <td style={{ padding: '0.4rem 1.25rem 0.4rem 2.25rem', color: 'var(--gray-700)' }}>
                                                                        {icon} {label}
                                                                        <span style={{ marginLeft: '0.5rem', fontSize: '0.45rem', color: '#92400e', fontWeight: 'bold' }}>— Action: Post journal entry</span>
                                                                    </td>
                                                                    <td className="number-cell" style={{ color: '#166534', padding: '0.4rem 1.25rem' }}>+ {rs(it.amount_paise)}</td>
                                                                </tr>
                                                            );
                                                        })}
                                                    </>
                                                )}

                                                {bankItems.filter(i => i.direction === 'subtract').length > 0 && (
                                                    <>
                                                        <tr><td colSpan="2" style={{ padding: '0.4rem 1.25rem 0.2rem 1.75rem', fontSize: '0.45rem', fontWeight: 'bold', color: 'var(--gray-600)', textTransform: 'uppercase' }}>Less: Bank debits/charges not yet in books</td></tr>
                                                        {bankItems.filter(i => i.direction === 'subtract').map(it => {
                                                            const { label, icon } = itemLabel(it);
                                                            return (
                                                                <tr key={it.id}>
                                                                    <td style={{ padding: '0.4rem 1.25rem 0.4rem 2.25rem', color: 'var(--gray-700)' }}>
                                                                        {icon} {label}
                                                                        <span style={{ marginLeft: '0.5rem', fontSize: '0.45rem', color: '#92400e', fontWeight: 'bold' }}>— Action: Post journal entry</span>
                                                                    </td>
                                                                    <td className="number-cell" style={{ color: '#991b1b', padding: '0.4rem 1.25rem' }}>− {rs(it.amount_paise)}</td>
                                                                </tr>
                                                            );
                                                        })}
                                                    </>
                                                )}

                                                <tr style={{ background: 'var(--gray-100)', borderTop: '2px solid var(--gray-300)' }}>
                                                    <td style={{ padding: '0.9rem 1.25rem', fontWeight: 'bold' }}>
                                                         COMPUTED BANK BALANCE (after adjustments)
                                                    </td>
                                                    <td className="number-cell" style={{ fontWeight: 'bold', fontSize: '0.63rem', padding: '0.9rem 1.25rem' }}>
                                                        {rs(runResult.computed_bank_closing_paise || 0)}
                                                    </td>
                                                </tr>
                                                <tr>
                                                    <td style={{ padding: '0.9rem 1.25rem', fontWeight: 'bold' }}>
                                                         ACTUAL BANK STATEMENT BALANCE
                                                    </td>
                                                    <td className="number-cell" style={{ fontWeight: 'bold', fontSize: '0.63rem', padding: '0.9rem 1.25rem' }}>
                                                        {rs(runResult.bank_closing_paise || 0)}
                                                    </td>
                                                </tr>
                                                {residual !== 0 && (
                                                    <tr style={{ background: '#fef2f2' }}>
                                                        <td style={{ padding: '0.9rem 1.25rem', fontWeight: 'bold', color: '#991b1b' }}>
                                                            ️ RESIDUAL DIFFERENCE (unexplained difference)
                                                        </td>
                                                        <td className="number-cell" style={{ fontWeight: 'bold', color: '#991b1b', padding: '0.9rem 1.25rem' }}>
                                                            {rs(Math.abs(residual))}
                                                        </td>
                                                    </tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                                {/* Bank items needing journal entries */}
                                {bankItems.length > 0 && (
                                    <div className="card" style={{ marginBottom: '1.5rem' }}>
                                        <div className="card-header">
                                            <h3>️ Bank Entries Not in Your Books ({bankItems.length})</h3>
                                            <span style={{ fontSize: '0.48rem', color: 'var(--gray-600)' }}>These appeared in the bank statement but were not found in your books — you need to post a journal entry for each</span>
                                        </div>
                                        <div className="card-body" style={{ padding: 0 }}>
                                            <table>
                                                <thead>
                                                    <tr>
                                                        <th>What it is</th>
                                                        <th>Type</th>
                                                        <th className="number-cell">Amount</th>
                                                        <th>Action Needed</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {bankItems.map(it => {
                                                        const { label, icon } = itemLabel(it);
                                                        return (
                                                            <tr key={it.id}>
                                                                <td>{icon} {label}</td>
                                                                <td><span className={`badge ${it.direction === 'add' ? 'badge-ok' : ''}`}>{it.direction === 'add' ? 'Credit (Money In)' : 'Debit (Money Out)'}</span></td>
                                                                <td className="number-cell" style={{ color: it.direction === 'add' ? '#166534' : '#991b1b' }}>
                                                                    {it.direction === 'add' ? '+' : '−'} {rs(it.amount_paise)}
                                                                </td>
                                                                <td style={{ fontSize: '0.468rem', color: '#92400e' }}>Post journal entry</td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}

                                {/* Pending review matches */}
                                {matches.length > 0 && (
                                    <div className="card" style={{ marginBottom: '1.5rem' }}>
                                        <div className="card-header">
                                            <h3> Needs Your Review ({matches.length})</h3>
                                            <span style={{ fontSize: '0.48rem', color: 'var(--gray-600)' }}>These entries look similar but we're not 100% sure — please confirm or reject each one</span>
                                        </div>
                                        <div className="card-body" style={{ padding: 0 }}>
                                            <table>
                                                <thead>
                                                    <tr>
                                                        <th>Why we think they match</th>
                                                        <th>Decision</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {matches.map(m => (
                                                        <tr key={m.match_id}>
                                                            <td style={{ fontSize: '0.51rem' }}>{m.reason}</td>
                                                            <td style={{ whiteSpace: 'nowrap' }}>
                                                                <button className="btn btn-sm btn-primary" style={{ marginRight: '0.5rem' }} onClick={async () => {
                                                                    await apiFetch(`/v1/reconciliation/matches/${m.match_id}/confirm`, { method: 'POST' });
                                                                    setMatches(matches.filter(x => x.match_id !== m.match_id));
                                                                }}> Yes, they match</button>
                                                                <button className="btn btn-sm" onClick={async () => {
                                                                    await apiFetch(`/v1/reconciliation/matches/${m.match_id}/reject`, { method: 'POST' });
                                                                    setMatches(matches.filter(x => x.match_id !== m.match_id));
                                                                }}> Not a match</button>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}
                            </div>
                        );
                    })()}
                </div>
            );
        }

        // --- Review Queue View Component (Cross-Source Deduplication & BRS Pending Review Queue) ---

        // --- Categorization Review Tab -------------------------------------
        // Surfaces transactions a human still needs to look at. Since the
        // `Other / Uncategorized` bucket was removed, most rows here DO carry a
        // category — they were placed by rail and direction and are waiting for
        // someone to confirm the purpose. Only `needs_category` rows have no
        // category at all. The tab is therefore "Manual Review", not
        // "Uncategorized": calling it the latter told the reader something
        // untrue about every row in it. Backend: /v1/review-queue.
        function CategorizationReviewTab({ onCountChange }) {
            const PAGE_SIZE = 25;

            const [items, setItems] = useState([]);
            const [categories, setCategories] = useState([]);
            const [categoryOptions, setCategoryOptions] = useState([]);
            const [eventTypes, setEventTypes] = useState([]);
            const [eventSel, setEventSel] = useState({});
            const [summary, setSummary] = useState(null);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [msg, setMsg] = useState('');
            const [savingId, setSavingId] = useState(null);
            const [selection, setSelection] = useState({});
            // Which rows are showing their raw bank narration. Mirrors
            // `openGroup` in the counterparty view: the verbatim text is
            // evidence you go looking for, not something to read past on
            // every row.
            const [openNarr, setOpenNarr] = useState({});
            const [offset, setOffset] = useState(0);
            const [hasMore, setHasMore] = useState(false);
            // Counterparty mode. The decision a reviewer actually makes is about
            // a PARTY, not a row: knowing KUMAR FISH is a food supplier settles
            // every KUMAR FISH transaction at once. On a real statement this
            // turned 599 questions into 181, so it is the default view.
            const [viewMode, setViewMode] = useState('counterparties');
            const [groups, setGroups] = useState([]);
            const [groupSel, setGroupSel] = useState({});
            const [groupEventSel, setGroupEventSel] = useState({});
            const [savingKey, setSavingKey] = useState(null);
            const [openGroup, setOpenGroup] = useState(null);
            const [groupsError, setGroupsError] = useState(null);
            const [health, setHealth] = useState(null);

            /* One round trip, not five. These endpoints are independent of each
               other, but they were five sequential awaits, so opening this tab
               cost five serial latencies and the panels appeared one at a time in
               a visible cascade. allSettled rather than all, because the error
               split here is deliberate and has to survive: the first three are
               what the tab IS, so a failure in any of them still raises the
               panel-level error, while counterparties and grouping-health each
               still cost only their own panel when they break. Applying all the
               results in one tick also collapses the cascade into one paint. */
            const load = async (nextOffset = 0, append = false) => {
                setLoading(true);
                setError(null);
                // Still fetched only once per mount, as before — an already
                // loaded category list is not requested again.
                const needCats = categories.length === 0;
                const [catsOut, summaryOut, rowsOut, groupsOut, healthOut] = await Promise.allSettled([
                    needCats ? apiFetch('/v1/review-queue/categories') : Promise.resolve(null),
                    apiFetch('/v1/review-queue/summary'),
                    // include_suggestions=false now the chips are gone. It is not a
                    // display flag: the server re-runs the classifier over every
                    // row to produce them, so asking for output nothing renders
                    // was paying for a page of predictions to throw away.
                    apiFetch(`/v1/review-queue?limit=${PAGE_SIZE}&offset=${nextOffset}&include_suggestions=false`),
                    apiFetch('/v1/review-queue/counterparties?limit=500'),
                    apiFetch('/v1/review-queue/grouping-health')
                ]);
                try {
                    try {
                        if (needCats) {
                            if (catsOut.status === 'rejected') throw catsOut.reason;
                            setCategories(Array.isArray(catsOut.value) ? catsOut.value : []);
                        }

                        if (summaryOut.status === 'rejected') throw summaryOut.reason;
                        const summaryRes = summaryOut.value;
                        setSummary(summaryRes);
                        // Category is the required axis; event type is optional.
                        setCategoryOptions(summaryRes.available_categories
                            || summaryRes.available_purposes || []);
                        setEventTypes(summaryRes.available_event_types || []);
                        if (onCountChange) onCountChange(summaryRes.total_requiring_review || 0);

                        if (rowsOut.status === 'rejected') throw rowsOut.reason;
                        const list = Array.isArray(rowsOut.value) ? rowsOut.value : [];
                        setItems(prev => (append ? [...prev, ...list] : list));
                        setOffset(nextOffset);
                        setHasMore(list.length === PAGE_SIZE);
                    } catch (err) {
                        setError(err.message || 'Failed to load the categorization review queue');
                    }

                    // Requested on every refresh, not just the first: categorising
                    // one party changes the counts on every other view.
                    if (groupsOut.status === 'fulfilled') {
                        setGroups(Array.isArray(groupsOut.value) ? groupsOut.value : []);
                        setGroupsError(null);
                    } else {
                        // A failure here must not blank the transaction list,
                        // which is the fallback way to get the work done — but it
                        // must NOT render as "nothing to categorize" either. An
                        // empty list and a broken endpoint look identical on
                        // screen, and that is how a 500 gets mistaken for
                        // "counterparty grouping barely covers anything".
                        setGroups([]);
                        setGroupsError((groupsOut.reason && groupsOut.reason.message)
                            || 'Could not group by counterparty');
                    }

                    // How well this statement's format was understood. Coverage
                    // alone cannot answer that — the shape fallback keeps it near
                    // 100% on a bank this code has never seen.
                    setHealth(healthOut.status === 'fulfilled' ? healthOut.value : null);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => { load(0, false); }, []);

            const assign = async (transactionId, category, eventType) => {
                if (!category) return;
                setSavingId(transactionId);
                setMsg('');
                try {
                    const res = await apiFetch(`/v1/review-queue/${transactionId}`, {
                        method: 'PATCH',
                        body: JSON.stringify({
                            category,
                            event_type: eventType || eventSel[transactionId] || null
                        })
                    });
                    // Drop the row locally so the reviewer sees immediate progress
                    // rather than waiting on a full refetch.
                    setItems(prev => prev.filter(i => i.transaction_id !== transactionId));
                    setSummary(prev => prev ? {
                        ...prev,
                        total_requiring_review: Math.max(0, (prev.total_requiring_review || 1) - 1),
                        uncategorized: Math.max(0, (prev.uncategorized || 1) - 1)
                    } : prev);
                    if (onCountChange && summary) {
                        onCountChange(Math.max(0, (summary.total_requiring_review || 1) - 1));
                    }
                    setMsg(`Categorized as ${res.new_category} (was ${res.previous_category}).`);
                } catch (err) {
                    setError(`Could not save category: ${err.message}`);
                } finally {
                    setSavingId(null);
                }
            };

            const [recatBusy, setRecatBusy] = useState(false);
            const recategorize = async () => {
                setRecatBusy(true);
                setMsg('');
                setError(null);
                try {
                    const r = await apiFetch('/v1/review-queue/recategorize', { method: 'POST' });
                    const bits = Object.entries(r.by_method || {})
                        .map(([m, n]) => `${n} by ${m.replace(/_/g, ' ')}`).join(', ');
                    setMsg(
                        `Re-checked ${r.examined} transaction${r.examined === 1 ? '' : 's'}: `
                        + `${r.categorized} categorized${bits ? ' (' + bits + ')' : ''}, `
                        + `${r.still_unresolved} still need a decision`
                        + (r.skipped_manual ? `, ${r.skipped_manual} left alone because you categorized them yourself` : '')
                        + '.'
                    );
                    await load(0, false);
                } catch (err) {
                    setError(`Could not re-categorize: ${err.message}`);
                } finally {
                    setRecatBusy(false);
                }
            };

            const assignGroup = async (group, category, eventType) => {
                if (!category) return;
                setSavingKey(group.counterparty_key);
                setMsg('');
                setError(null);
                try {
                    const res = await apiFetch(
                        `/v1/review-queue/counterparties/${encodeURIComponent(group.counterparty_key)}`,
                        {
                            method: 'POST',
                            body: JSON.stringify({ category, event_type: eventType || null })
                        }
                    );
                    const cleared = res.transactions_updated || 0;
                    setGroups(prev => prev.filter(g => g.counterparty_key !== group.counterparty_key));
                    // Every row belonging to this party leaves the transaction
                    // list too, so switching views does not show work already done.
                    setItems(prev => prev.filter(i => !(i.narration || '').toUpperCase()
                        .includes(group.counterparty_key)));
                    setSummary(prev => prev ? {
                        ...prev,
                        total_requiring_review: Math.max(0, (prev.total_requiring_review || 0) - cleared),
                        uncategorized: Math.max(0, (prev.uncategorized || 0) - cleared)
                    } : prev);
                    if (onCountChange && summary) {
                        onCountChange(Math.max(0, (summary.total_requiring_review || 0) - cleared));
                    }
                    setMsg(`${res.display_name} categorized as ${res.category}. `
                        + `${cleared} transaction${cleared === 1 ? '' : 's'} cleared, `
                        + `and future uploads naming this party will be categorized automatically.`);
                } catch (err) {
                    setError(`Could not categorize this counterparty: ${err.message}`);
                } finally {
                    setSavingKey(null);
                }
            };

            return (
                <div>
                    {summary && (
                        <div style={{ display: 'flex', gap: '0.75rem', marginBottom: '0.9rem', flexWrap: 'wrap' }}>
                            {/* flex: '0 0 auto' is load-bearing. `.card` carries a
                                global width:100%, so without it each of these
                                stacks full-width down the page instead of sitting
                                in a row. */}
                            <div className="card" style={{ padding: '0.6rem 0.9rem', minWidth: '150px', width: 'auto', flex: '0 0 auto', marginBottom: 0 }}>
                                <div style={{ fontSize: '0.45rem', color: 'var(--gray-600)', textTransform: 'uppercase' }}>Awaiting review</div>
                                <div style={{ fontSize: '0.9rem', fontWeight: 'bold' }}>{summary.total_requiring_review}</div>
                            </div>
                            <div className="card" style={{ padding: '0.6rem 0.9rem', minWidth: '150px', width: 'auto', flex: '0 0 auto', marginBottom: 0 }}>
                                <div style={{ fontSize: '0.45rem', color: 'var(--gray-600)', textTransform: 'uppercase' }}>Parties to decide</div>
                                {/* DECISIONS, not the sum of decisions and
                                    nods. This tile used to show every group in
                                    the queue — 135, of which 107 were rows that
                                    already had a category and only wanted
                                    confirming. That reads as 135 questions and
                                    it was 28. */}
                                <div style={{ fontSize: '0.9rem', fontWeight: 'bold' }}>
                                    {summary.counterparties_needing_category !== undefined
                                        ? summary.counterparties_needing_category
                                        : (summary.counterparties_total !== undefined
                                            ? summary.counterparties_total : groups.length)}
                                </div>
                                {summary.counterparties_confirm_only > 0 && (
                                    <div style={{ fontSize: '0.4rem', color: 'var(--gray-600)' }}>
                                        + {summary.counterparties_confirm_only} only need confirming
                                    </div>
                                )}
                            </div>
                            {/* Two different jobs, shown as two numbers. Needs a
                                category = no category at all, the real backlog.
                                Confirm = already categorized from the narration,
                                wants a yes/no. */}
                            <div className="card" style={{ padding: '0.6rem 0.9rem', minWidth: '150px', width: 'auto', flex: '0 0 auto', marginBottom: 0 }}>
                                <div style={{ fontSize: '0.45rem', color: 'var(--gray-600)', textTransform: 'uppercase' }}>Needs a category</div>
                                <div style={{ fontSize: '0.9rem', fontWeight: 'bold', color: (summary.needs_category || 0) > 0 ? '#b45309' : 'inherit' }}>
                                    {summary.needs_category !== undefined ? summary.needs_category : summary.uncategorized}
                                </div>
                            </div>
                            <div className="card" style={{ padding: '0.6rem 0.9rem', minWidth: '150px', width: 'auto', flex: '0 0 auto', marginBottom: 0 }}>
                                <div style={{ fontSize: '0.45rem', color: 'var(--gray-600)', textTransform: 'uppercase' }}>Categorized, confirm</div>
                                <div style={{ fontSize: '0.9rem', fontWeight: 'bold' }}>{summary.awaiting_confirmation || 0}</div>
                            </div>
                        </div>
                    )}

                    {msg && (
                        <div style={{ background: '#ecfdf5', border: '1px solid #a7f3d0', color: '#065f46', padding: '0.75rem 1rem', borderRadius: '4px', marginBottom: '1rem', fontSize: '0.54rem' }}>
                            {msg}
                        </div>
                    )}
                    {error && (
                        <div style={{ background: '#fef2f2', border: '1px solid #fecaca', color: '#991b1b', padding: '0.75rem 1rem', borderRadius: '4px', marginBottom: '1rem', fontSize: '0.54rem' }}>
                            {error}
                        </div>
                    )}

                    {/* Two ways to do the same work. Counterparty mode asks one
                        question per trading partner; transaction mode asks one per
                        row and stays available for the rows that have no
                        counterparty at all (bank charges, cash, interest). */}
                    <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', marginBottom: '0.75rem', flexWrap: 'wrap' }}>
                        <button
                            className={viewMode === 'counterparties' ? 'btn btn-sm btn-primary' : 'btn btn-sm'}
                            onClick={() => setViewMode('counterparties')}>
                            By counterparty ({groups.length})
                        </button>
                        <button
                            className={viewMode === 'transactions' ? 'btn btn-sm btn-primary' : 'btn btn-sm'}
                            onClick={() => setViewMode('transactions')}>
                            One by one ({summary ? summary.total_requiring_review : items.length})
                        </button>
                        <button className="btn btn-sm" onClick={recategorize} disabled={recatBusy}
                            title="Re-run the current rules and your saved counterparties over transactions already uploaded. Anything you categorized yourself is left untouched.">
                            {recatBusy ? 'Re-checking...' : 'Re-categorize existing'}
                        </button>
                        <span style={{ fontSize: '0.45rem', color: 'var(--gray-600)' }}>
                            One decision settles every matching transaction, now and on future uploads.
                            Rows that name no counterparty are grouped by the kind of charge instead.
                        </span>
                    </div>

                    {viewMode === 'counterparties' ? (
                        loading && groups.length === 0 ? (
                            <div className="card" style={{ padding: '2rem', textAlign: 'center', color: 'var(--gray-600)' }}>
                                Grouping transactions by counterparty...
                            </div>
                        ) : groupsError ? (
                            <div className="card" style={{ padding: '1.5rem', textAlign: 'center' }}>
                                <div style={{ color: '#991b1b', fontWeight: 'bold', fontSize: '0.6rem', marginBottom: '0.4rem' }}>
                                    Counterparty grouping is unavailable
                                </div>
                                <div style={{ color: 'var(--gray-600)', fontSize: '0.5rem', marginBottom: '0.6rem' }}>
                                    {groupsError}
                                </div>
                                <div style={{ color: 'var(--gray-600)', fontSize: '0.5rem' }}>
                                    This is a server error, not an empty queue —
                                    {' '}{summary ? summary.total_requiring_review : items.length} transaction(s) still need review.
                                    {' '}<a href="#" onClick={e => { e.preventDefault(); setViewMode('transactions'); }}>Review them one by one</a> while it is fixed.
                                </div>
                            </div>
                        ) : groups.length === 0 ? (
                            <div className="card" style={{ padding: '2rem', textAlign: 'center', color: 'var(--gray-600)' }}>
                                No counterparties are waiting on a decision.
                                {summary && summary.total_requiring_review > 0 && (
                                    <div style={{ marginTop: '0.5rem', fontSize: '0.5rem', color: '#b45309' }}>
                                        …but {summary.total_requiring_review} transaction
                                        {summary.total_requiring_review === 1 ? '' : 's'} are still
                                        unresolved. If this says zero while the Categories tab
                                        reports work outstanding, the two screens are reading
                                        different columns — run
                                        {' '}<code>python scripts/queue_vs_categories.py</code>.
                                    </div>
                                )}
                                {items.length > 0 && (
                                    <div style={{ marginTop: '0.5rem', fontSize: '0.5rem' }}>
                                        {items.length} row{items.length === 1 ? '' : 's'} could not be grouped at all —
                                        these carry nothing but a reference number, so there is no safe way to batch them.
                                        {' '}<a href="#" onClick={e => { e.preventDefault(); setViewMode('transactions'); }}>Review them one by one</a>.
                                    </div>
                                )}
                            </div>
                        ) : (
                        <div className="card" style={{ padding: 0 }}>
                            <div className="table-responsive">
                                <table className="transactions-table" style={{ width: '100%' }}>
                                    <thead>
                                        <tr>
                                            <th style={{ minWidth: '180px' }}>Counterparty / charge type</th>
                                            <th className="number-cell" style={{ width: '50px' }}>Rows</th>
                                            <th className="number-cell amount-col" style={{ width: '90px' }}>Paid out</th>
                                            <th className="number-cell amount-col" style={{ width: '90px' }}>Received</th>
                                            <th style={{ width: '130px', whiteSpace: 'nowrap' }}>Period</th>
                                            <th style={{ width: '230px' }}>Categorize all of them as</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {groups.map(g => {
                                            const busy = savingKey === g.counterparty_key;
                                            const isOpen = openGroup === g.counterparty_key;
                                            return (
                                            <tr key={g.counterparty_key} style={{ verticalAlign: 'middle' }}>
                                                <td style={{ padding: '0.24rem 0.5rem' }}>
                                                    <div style={{ display: 'flex', alignItems: 'center', gap: '0.35rem', flexWrap: 'nowrap' }}>
                                                        <span style={{ fontWeight: '600', color: 'var(--black)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', maxWidth: '160px' }} title={g.display_name}>
                                                            {g.display_name}
                                                        </span>
                                                        <span style={{ fontSize: '0.408rem', color: 'var(--gray-500)', textTransform: 'uppercase', whiteSpace: 'nowrap' }}>
                                                            [{g.kind === 'pattern' ? 'Charge' : g.channel}]
                                                        </span>
                                                        <button className="mini-btn" style={{ padding: '0.04rem 0.22rem', fontSize: '0.408rem', flexShrink: 0 }}
                                                            onClick={() => setOpenGroup(isOpen ? null : g.counterparty_key)}>
                                                            {isOpen ? 'Hide' : 'Narrations'}
                                                        </button>
                                                    </div>
                                                    {(g.also_known_as || []).length > 0 && (
                                                        <div style={{ display: 'flex', alignItems: 'center', gap: '0.35rem', fontSize: '0.408rem', color: 'var(--gray-500)', marginTop: '0.05rem', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                                                            <span title={'also written ' + g.also_known_as.join(', ')}>
                                                                also: {g.also_known_as.slice(0, 2).join(', ')}{g.also_known_as.length > 2 ? '…' : ''}
                                                            </span>
                                                        </div>
                                                    )}
                                                    {isOpen && (
                                                        <div style={{ marginTop: '0.3rem', fontSize: '0.408rem', color: 'var(--gray-600)', lineHeight: '1.4', maxHeight: '120px', overflowY: 'auto' }}>
                                                            {(g.sample_narrations || []).map((n, i) => (
                                                                <div key={i} style={{ wordBreak: 'break-all' }}>{n}</div>
                                                            ))}
                                                            {g.transaction_count > (g.sample_narrations || []).length && (
                                                                <div style={{ fontStyle: 'italic' }}>
                                                                    + {g.transaction_count - (g.sample_narrations || []).length} more
                                                                </div>
                                                            )}
                                                        </div>
                                                    )}
                                                </td>
                                                <td className="number-cell" style={{ fontWeight: '600' }}>{g.transaction_count}</td>
                                                <td className="number-cell amount-col" style={{ whiteSpace: 'nowrap' }}>
                                                    {g.total_debit ? window.money(g.total_debit) : '\u2014'}
                                                </td>
                                                <td className="number-cell amount-col" style={{ whiteSpace: 'nowrap' }}>
                                                    {g.total_credit ? window.money(g.total_credit) : '\u2014'}
                                                </td>
                                                <td style={{ fontSize: '0.45rem', color: 'var(--gray-600)', whiteSpace: 'nowrap' }}>
                                                    {g.first_seen && g.last_seen ? `${g.first_seen} – ${g.last_seen}` : (g.first_seen || g.last_seen || '\u2014')}
                                                </td>
                                                <td style={{ padding: '0.24rem 0.5rem' }}>
                                                    <div style={{ display: 'flex', gap: '0.3rem', alignItems: 'center' }}>
                                                        <select
                                                            value={groupSel[g.counterparty_key] !== undefined
                                                                ? groupSel[g.counterparty_key]
                                                                : (g.known_category || g.current_category || '')}
                                                            disabled={busy}
                                                            onChange={e => setGroupSel(prev => ({ ...prev, [g.counterparty_key]: e.target.value }))}
                                                            style={{ flex: 1, minWidth: '120px', padding: '0.18rem 0.35rem', fontSize: '0.48rem' }}>
                                                            <option value="">Select a category...</option>
                                                            {(categoryOptions.length ? categoryOptions : categories).map(c => (
                                                                <option key={c} value={c}>{c}</option>
                                                            ))}
                                                        </select>
                                                        <button
                                                            className="btn btn-sm btn-primary"
                                                            style={{ whiteSpace: 'nowrap', padding: '0.18rem 0.45rem', fontSize: '0.45rem', flexShrink: 0 }}
                                                            disabled={busy || !(groupSel[g.counterparty_key] !== undefined
                                                                ? groupSel[g.counterparty_key]
                                                                : (g.known_category || g.current_category || ''))}
                                                            onClick={() => assignGroup(g,
                                                                groupSel[g.counterparty_key] !== undefined
                                                                    ? groupSel[g.counterparty_key]
                                                                    : (g.known_category || g.current_category || ''),
                                                                groupEventSel[g.counterparty_key])}>
                                                            {busy ? 'Applying...' : `Apply (${g.transaction_count})`}
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        )
                    ) : loading && items.length === 0 ? (
                        <div className="card" style={{ padding: '2rem', textAlign: 'center', color: 'var(--gray-600)' }}>
                            Loading transactions awaiting categorization...
                        </div>
                    ) : items.length === 0 ? (
                        <div className="card" style={{ padding: '2rem', textAlign: 'center', color: 'var(--gray-600)' }}>
                            Nothing to review. Every transaction has a confident category.
                        </div>
                    ) : (
                        <div className="card" style={{ padding: 0 }}>
                            <div className="table-responsive">
                                <table className="transactions-table" style={{ width: '100%', tableLayout: 'fixed' }}>
                                    {/* Same shape as the "By counterparty" table above:
                                        identical columns, identical density, identical
                                        controls. The two tabs are the same job at two
                                        grains — one question per trading party, or one
                                        per row — and making them look like different
                                        screens made the switch feel like losing your
                                        place. What differs is only what genuinely differs:
                                        a date instead of a row count and a period. */}
                                    <thead>
                                        {/* Percentages summing to 100, with table-layout:fixed on the
                                            table so the declared widths are authoritative and long text
                                            wraps inside its column instead of demanding its own
                                            intrinsic width and pushing the decision control off screen.

                                            "Transaction", not "Counterparty / charge type": this tab
                                            lists individual transactions. The counterparty is how each
                                            one is labelled, but the row IS a transaction, and borrowing
                                            the group tab's heading described the wrong thing. */}
                                        <tr>
                                            <th style={{ width: '38%' }}>Transaction</th>
                                            <th style={{ width: '12%', whiteSpace: 'nowrap' }}>Date</th>
                                            <th className="number-cell amount-col" style={{ width: '14%' }}>Paid out</th>
                                            <th className="number-cell amount-col" style={{ width: '14%' }}>Received</th>
                                            <th style={{ width: '22%' }}>Categorize it as</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {items.map(item => {
                                            const busy = savingId === item.transaction_id;
                                            const narrOpen = !!openNarr[item.transaction_id];
                                            const name = item.counterparty || item.narration || '—';
                                            const badge = item.group_kind === 'pattern'
                                                ? 'Charge'
                                                : (item.group_channel && item.group_channel !== 'plain'
                                                    ? item.group_channel : 'party');
                                            const chosen = selection[item.transaction_id] || '';
                                            return (
                                            <tr key={item.transaction_id} style={{ verticalAlign: 'middle' }}>
                                                <td style={{ padding: '0.24rem 0.5rem' }}>
                                                    <div style={{ display: 'flex', alignItems: 'center', gap: '0.35rem', flexWrap: 'nowrap' }}>
                                                        <span style={{ fontWeight: '600', color: 'var(--black)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', maxWidth: '160px' }} title={name}>
                                                            {name}
                                                        </span>
                                                        <span style={{ fontSize: '0.408rem', color: 'var(--gray-500)', textTransform: 'uppercase', whiteSpace: 'nowrap' }}>
                                                            [{badge}]
                                                        </span>
                                                        <button className="mini-btn" style={{ padding: '0.04rem 0.22rem', fontSize: '0.408rem', flexShrink: 0 }}
                                                            onClick={() => setOpenNarr(prev => ({ ...prev, [item.transaction_id]: !narrOpen }))}>
                                                            {narrOpen ? 'Hide' : 'Narration'}
                                                        </button>
                                                        {/* On the name line, not under it. One answer settles the
                                                            whole group and that is worth saying where the question
                                                            is asked — but as a second line it cost every row ~10px
                                                            of height, which is the thing that made this table feel
                                                            heavier than the counterparty one. */}
                                                        {item.group_size > 1 && (
                                                            <a href="#" onClick={e => { e.preventDefault(); setViewMode('counterparties'); }}
                                                               title={`${item.group_size} rows share this counterparty — decide them together`}
                                                               style={{ fontSize: '0.408rem', whiteSpace: 'nowrap', flexShrink: 0 }}>
                                                                ×{item.group_size} together
                                                            </a>
                                                        )}
                                                    </div>
                                                    {narrOpen && (
                                                        <div style={{ marginTop: '0.3rem', fontSize: '0.408rem', color: 'var(--gray-600)', lineHeight: '1.4', wordBreak: 'break-all' }}>
                                                            {item.narration || '—'}
                                                        </div>
                                                    )}
                                                </td>
                                                <td style={{ fontSize: '0.45rem', color: 'var(--gray-600)', whiteSpace: 'nowrap' }}>
                                                    {item.txn_date || '—'}
                                                </td>
                                                {/* Split into two money columns like the group tile. A single
                                                    signed Amount column makes the reader decode the direction
                                                    from a label; two columns put money out and money in in
                                                    different places, which is how a ledger is read. */}
                                                <td className="number-cell amount-col" style={{ whiteSpace: 'nowrap' }}>
                                                    {item.direction === 'credit' ? '—' : window.money(item.amount)}
                                                </td>
                                                <td className="number-cell amount-col" style={{ whiteSpace: 'nowrap' }}>
                                                    {item.direction === 'credit' ? window.money(item.amount) : '—'}
                                                </td>
                                                <td style={{ padding: '0.24rem 0.5rem' }}>
                                                    <div style={{ display: 'flex', gap: '0.3rem', alignItems: 'center' }}>
                                                        <select
                                                            value={chosen}
                                                            disabled={busy}
                                                            onChange={e => setSelection(prev => ({ ...prev, [item.transaction_id]: e.target.value }))}
                                                            style={{ flex: 1, minWidth: '120px', padding: '0.18rem 0.35rem', fontSize: '0.48rem' }}>
                                                            <option value="">Select a category...</option>
                                                            {(categoryOptions.length ? categoryOptions : categories).map(c => (
                                                                <option key={c} value={c}>{c}</option>
                                                            ))}
                                                        </select>
                                                        <button
                                                            className="btn btn-sm btn-primary"
                                                            style={{ whiteSpace: 'nowrap', padding: '0.18rem 0.45rem', fontSize: '0.45rem', flexShrink: 0 }}
                                                            disabled={busy || !chosen}
                                                            onClick={() => assign(item.transaction_id, chosen)}>
                                                            {busy ? 'Saving...' : 'Apply'}
                                                        </button>
                                                    </div>
                                                    {/* One control, one decision. The event-type select and the
                                                        suggested-category chips that used to sit here are gone
                                                        deliberately: this cell asks "what was this for", and every
                                                        extra widget beside the answer is another thing to read
                                                        before giving it. Event type is optional metadata and is
                                                        still settable from the transaction detail view. */}
                                                </td>
                                            </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>

                            {hasMore && (
                                <div style={{ padding: '0.9rem', textAlign: 'center', borderTop: '1px solid var(--gray-200)' }}>
                                    <button className="btn btn-sm" disabled={loading}
                                            onClick={() => load(offset + PAGE_SIZE, true)}>
                                        {loading ? 'Loading…' : 'Load more'}
                                    </button>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        function ReviewQueueView() {
            const [activeTab, setActiveTab] = useState('categorization'); // 'categorization' | 'dedup' | 'brs'
            const [catCount, setCatCount] = useState(0);
            const [dedupMatches, setDedupMatches] = useState([]);
            const [brsMatches, setBrsMatches] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [actionMsg, setActionMsg] = useState('');

            const loadQueueData = async () => {
                setLoading(true);
                setError(null);
                let runsErr = null;
                try {
                    /* 1 and 2 together. Pending duplicates and the reconciliation
                       run list have nothing to do with each other, but they were
                       awaited in sequence, so the tab paid both latencies end to
                       end before the first list could appear. The run list keeps
                       its own catch and is rethrown afterwards so that a broken
                       /runs endpoint still leaves the duplicates list on screen,
                       exactly as it did when the two were sequential. Step 3 below
                       stays chained — it needs the id of the run this returns. */
                    const [dedupRes, runsRes] = await Promise.all([
                        apiFetch('/v1/deduplication/matches?status_filter=pending_review'),
                        apiFetch('/v1/reconciliation/runs').catch(e => { runsErr = e; return null; })
                    ]);
                    setDedupMatches(Array.isArray(dedupRes) ? dedupRes : []);
                    if (runsErr) throw runsErr;

                    let pendingBrs = [];
                    if (Array.isArray(runsRes) && runsRes.length > 0) {
                        const latestRun = runsRes[0];
                        const matchRes = await apiFetch(`/v1/reconciliation/runs/${latestRun.id}/matches?status=pending_review`);
                        if (Array.isArray(matchRes)) {
                            pendingBrs = matchRes;
                        }
                    }
                    setBrsMatches(pendingBrs);
                } catch (err) {
                    setError(err.message || 'Failed to load review queue items');
                } finally {
                    setLoading(false);
                }
            };


            useEffect(() => {
                loadQueueData();
            }, []);

            const handleConfirmDedup = async (matchId) => {
