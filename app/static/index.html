                setActionMsg('');
                try {
                    await apiFetch(`/v1/deduplication/matches/${matchId}/confirm`, { method: 'POST' });
                    setDedupMatches(prev => prev.filter(m => m.id !== matchId));
                    setActionMsg('Duplicate match confirmed successfully.');
                } catch (err) {
                    alert(`Failed to confirm match: ${err.message}`);
                }
            };

            const handleRejectDedup = async (matchId) => {
                setActionMsg('');
                try {
                    await apiFetch(`/v1/deduplication/matches/${matchId}/reject`, { method: 'POST' });
                    setDedupMatches(prev => prev.filter(m => m.id !== matchId));
                    setActionMsg('Duplicate match rejected successfully.');
                } catch (err) {
                    alert(`Failed to reject match: ${err.message}`);
                }
            };

            const handleConfirmBRS = async (matchId) => {
                setActionMsg('');
                try {
                    await apiFetch(`/v1/reconciliation/matches/${matchId}/confirm`, { method: 'POST' });
                    setBrsMatches(prev => prev.filter(m => m.match_id !== matchId));
                    setActionMsg('BRS match candidate confirmed successfully.');
                } catch (err) {
                    alert(`Failed to confirm BRS match: ${err.message}`);
                }
            };

            const handleRejectBRS = async (matchId) => {
                setActionMsg('');
                try {
                    await apiFetch(`/v1/reconciliation/matches/${matchId}/reject`, { method: 'POST' });
                    setBrsMatches(prev => prev.filter(m => m.match_id !== matchId));
                    setActionMsg('BRS match candidate rejected successfully.');
                } catch (err) {
                    alert(`Failed to reject BRS match: ${err.message}`);
                }
            };

            return (
                <div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '0.65rem', marginBottom: '1rem' }}>
                        <div>
                            <h2 style={{ fontSize: '0.9rem', fontWeight: 'bold', marginBottom: '0.25rem' }}>Review Queue</h2>
                            <p style={{ color: 'var(--gray-600)', fontSize: '0.54rem' }}>
                                Human-in-the-loop review for transactions the classifier could not decide, ambiguous duplicates, and BRS match candidates.
                            </p>
                        </div>
                        <button className="btn btn-sm" onClick={loadQueueData} disabled={loading}>
                             Refresh Queue
                        </button>
                    </div>

                    {actionMsg && (
                        <div style={{ background: '#ecfdf5', border: '1px solid #a7f3d0', color: '#065f46', padding: '0.75rem 1rem', borderRadius: '4px', marginBottom: '1.5rem', fontSize: '0.54rem' }}>
                             {actionMsg}
                        </div>
                    )}

                    {error && (
                        <div style={{ background: '#fef2f2', border: '1px solid #fecaca', color: '#991b1b', padding: '0.75rem 1rem', borderRadius: '4px', marginBottom: '1.5rem', fontSize: '0.54rem' }}>
                             {error}
                        </div>
                    )}

                    {/* Navigation Tabs */}
                    <div style={{ display: 'flex', borderBottom: '1px solid var(--gray-300)', marginBottom: '1.5rem' }}>
                        <button
                            style={{
                                padding: '0.75rem 1.25rem',
                                border: 'none',
                                background: 'none',
                                borderBottom: activeTab === 'categorization' ? '2px solid var(--primary-color)' : 'none',
                                fontWeight: activeTab === 'categorization' ? 'bold' : 'normal',
                                color: activeTab === 'categorization' ? 'var(--primary-color)' : 'var(--gray-600)',
                                cursor: 'pointer',
                                fontSize: '0.57rem'
                            }}
                            onClick={() => setActiveTab('categorization')}
                        >
                            Manual Review ({catCount})
                        </button>
                        <button
                            style={{
                                padding: '0.75rem 1.25rem',
                                border: 'none',
                                background: 'none',
                                borderBottom: activeTab === 'dedup' ? '2px solid var(--primary-color)' : 'none',
                                fontWeight: activeTab === 'dedup' ? 'bold' : 'normal',
                                color: activeTab === 'dedup' ? 'var(--primary-color)' : 'var(--gray-600)',
                                cursor: 'pointer',
                                fontSize: '0.57rem'
                            }}
                            onClick={() => setActiveTab('dedup')}
                        >
                            Cross-Source Duplicates ({dedupMatches.length})
                        </button>
                        <button
                            style={{
                                padding: '0.75rem 1.25rem',
                                border: 'none',
                                background: 'none',
                                borderBottom: activeTab === 'brs' ? '2px solid var(--primary-color)' : 'none',
                                fontWeight: activeTab === 'brs' ? 'bold' : 'normal',
                                color: activeTab === 'brs' ? 'var(--primary-color)' : 'var(--gray-600)',
                                cursor: 'pointer',
                                fontSize: '0.57rem'
                            }}
                            onClick={() => setActiveTab('brs')}
                        >
                            BRS Match Candidates ({brsMatches.length})
                        </button>
                    </div>

                    {activeTab === 'categorization' ? (
                        <CategorizationReviewTab onCountChange={setCatCount} />
                    ) : loading ? (
                        <div style={{ padding: '2rem', textAlign: 'center', color: 'var(--gray-600)' }}>
                            Loading review queue items...
                        </div>
                    ) : activeTab === 'dedup' ? (
                        dedupMatches.length === 0 ? (
                            <div className="card" style={{ padding: '2rem', textAlign: 'center', color: 'var(--gray-600)' }}>
                                 Clear! No cross-source duplicate matches currently pending review.
                            </div>
                        ) : (
                            <div className="card" style={{ overflowX: 'auto' }}>
                                <table>
                                    <thead>
                                        <tr>
                                            <th>Match Details</th>
                                            <th>Duplicate Candidate (Alert/Txn)</th>
                                            <th>Canonical Transaction (Kept)</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {dedupMatches.map(m => (
                                            <tr key={m.id}>
                                                <td>
                                                    <span className="badge" style={{ background: '#fffbebf', color: '#b45309', border: '1px solid #fcd34d', marginBottom: '0.25rem', display: 'inline-block' }}>
                                                        {m.tier}
                                                    </span>
                                                </td>
                                                <td>
                                                    {m.duplicate_txn ? (
                                                        <div>
                                                            <div style={{ fontWeight: '600' }}>{m.duplicate_txn.narration}</div>
                                                            <div style={{ fontSize: '0.48rem', color: 'var(--gray-600)' }}>
                                                                Source: <span className="badge">{m.duplicate_txn.source_type}</span> | Date: {m.duplicate_txn.txn_date}
                                                            </div>
                                                            <div style={{ fontSize: '0.48rem', color: 'var(--gray-600)' }}>
                                                                Amount: ₹{((m.duplicate_txn.amount_paise || 0) / 100).toLocaleString('en-IN', { minimumFractionDigits: 2 })} | Ref: {m.duplicate_txn.reference_no || 'None'}
                                                            </div>
                                                        </div>
                                                    ) : <span>Transaction ID: {m.duplicate_txn_id}</span>}
                                                </td>
                                                <td>
                                                    {m.kept_txn ? (
                                                        <div>
                                                            <div style={{ fontWeight: '600' }}>{m.kept_txn.narration}</div>
                                                            <div style={{ fontSize: '0.48rem', color: 'var(--gray-600)' }}>
                                                                Source: <span className="badge">{m.kept_txn.source_type}</span> | Date: {m.kept_txn.txn_date}
                                                            </div>
                                                            <div style={{ fontSize: '0.48rem', color: 'var(--gray-600)' }}>
                                                                Amount: ₹{((m.kept_txn.amount_paise || 0) / 100).toLocaleString('en-IN', { minimumFractionDigits: 2 })} | Ref: {m.kept_txn.reference_no || 'None'}
                                                            </div>
                                                        </div>
                                                    ) : <span>Transaction ID: {m.kept_txn_id}</span>}
                                                </td>
                                                <td>
                                                    <div style={{ display: 'flex', gap: '0.5rem' }}>
                                                        <button className="btn btn-sm btn-primary" onClick={() => handleConfirmDedup(m.id)}>
                                                            Confirm Duplicate
                                                        </button>
                                                        <button className="btn btn-sm" onClick={() => handleRejectDedup(m.id)}>
                                                            Reject (Keep Distinct)
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )
                    ) : (
                        brsMatches.length === 0 ? (
                            <div className="card" style={{ padding: '2rem', textAlign: 'center', color: 'var(--gray-600)' }}>
                                 Clear! No BRS match candidates currently pending review.
                            </div>
                        ) : (
                            <div className="card" style={{ overflowX: 'auto' }}>
                                <table>
                                    <thead>
                                        <tr>
                                            <th>Tier</th>
                                            <th>Reason</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {brsMatches.map(m => (
                                            <tr key={m.match_id}>
                                                <td><span className="badge">{m.tier}</span></td>
                                                <td>{m.reason}</td>
                                                <td>
                                                    <div style={{ display: 'flex', gap: '0.5rem' }}>
                                                        <button className="btn btn-sm btn-primary" onClick={() => handleConfirmBRS(m.match_id)}>
                                                            Confirm Match
                                                        </button>
                                                        <button className="btn btn-sm" onClick={() => handleRejectBRS(m.match_id)}>
                                                            Reject
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )
                    )}
                </div>
            );
        }

        // --- Bank Master & Entities Management View Component ---
        function BankMasterView() {
            const { selectedBankId, setSelectedBankId } = React.useContext(FilterContext);
            const [entities, setEntities] = useState([]);
            const [accounts, setAccounts] = useState([]);
            const [banks, setBanks] = useState([]);
            const [loading, setLoading] = useState(true);
            const [newEntityName, setNewEntityName] = useState('');
            const [msg, setMsg] = useState('');

            const loadData = async () => {
                setLoading(true);
                try {
                    const [entData, accData, bData] = await Promise.all([
                        apiFetch('/v1/bank-master/entities'),
                        apiFetch('/v1/bank-master/accounts'),
                        apiFetch('/v1/bank-master/banks')
                    ]);
                    setEntities(entData);
                    setAccounts(accData);
                    setBanks(bData);
                } catch (e) {
                    setMsg('Failed to load bank master data');
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => { loadData(); }, []);

            const handleCreateEntity = async (e) => {
                e.preventDefault();
                if (!newEntityName.trim()) return;
                try {
                    await apiFetch('/v1/bank-master/entities', {
                        method: 'POST',
                        body: JSON.stringify({ name: newEntityName })
                    });
                    setNewEntityName('');
                    setMsg(' Entity created successfully');
                    loadData();
                } catch (err) {
                    setMsg(' Error creating entity: ' + err.message);
                }
            };

            const [newAccEntityId, setNewAccEntityId] = useState('');
            const [newAccBankId, setNewAccBankId] = useState('');
            const [newAccType, setNewAccType] = useState('CURRENT');
            const [newAccNumber, setNewAccNumber] = useState('');
            const [newAccCurrency, setNewAccCurrency] = useState('INR');
            const [editingAccId, setEditingAccId] = useState(null);
            const [editEntityId, setEditEntityId] = useState('');
            const [editAccountType, setEditAccountType] = useState('CURRENT');

            const handleCreateAccount = async (e) => {
                e.preventDefault();
                const num = newAccNumber.trim();
                if (!/^\d{12}$/.test(num)) {
                    setMsg(' Please enter a valid 12-digit bank account number');
                    return;
                }
                try {
                    await apiFetch('/v1/bank-master/accounts', {
                        method: 'POST',
                        body: JSON.stringify({
                            entity_id: newAccEntityId || null,
                            bank_id: newAccBankId || null,
                            account_type: newAccType,
                            account_number: newAccNumber.trim(),
                            currency: newAccCurrency
                        })
                    });
                    setNewAccNumber('');
                    setMsg(' Bank account created successfully');
                    loadData();
                } catch (err) {
                    setMsg(' Error creating bank account: ' + err.message);
                }
            };

            const handleUpdateAccount = async (accountId) => {
                try {
                    await apiFetch(`/v1/bank-master/accounts/${accountId}`, {
                        method: 'PATCH',
                        body: JSON.stringify({
                            entity_id: editEntityId || null,
                            account_type: editAccountType
                        })
                    });
                    setEditingAccId(null);
                    setMsg(' Account updated successfully');
                    loadData();
                } catch (err) {
                    setMsg(' Error updating account: ' + err.message);
                }
            };

            return (
                <div>
                    {msg && <div style={{ padding: '0.75rem', background: 'var(--gray-100)', marginBottom: '1rem', fontWeight: 'bold' }}>{msg}</div>}

                    {/* Entities Section */}
                    <div className="card" style={{ marginBottom: '1.5rem' }}>
                        <div className="card-header">
                            <h3>Business Entities ({entities.length})</h3>
                        </div>
                        <div className="card-body">
                            <form onSubmit={handleCreateEntity} style={{ display: 'flex', gap: '1rem', marginBottom: '1.5rem' }}>
                                <input
                                    type="text"
                                    placeholder="Enter Entity Name (e.g. ACME Pvt Ltd)"
                                    value={newEntityName}
                                    onChange={e => setNewEntityName(e.target.value)}
                                    style={{ flex: 1 }}
                                />
                                <button type="submit" className="btn btn-primary">Add Entity</button>
                            </form>

                            {entities.length === 0 ? (
                                <p style={{ color: 'var(--gray-600)' }}>No business entities registered yet. Add your first entity above.</p>
                            ) : (
                                <table>
                                    <thead>
                                        <tr><th>Entity Name</th><th>Tax ID</th><th>Status</th><th>Action</th></tr>
                                    </thead>
                                    <tbody>
                                        {entities.map(ent => (
                                            <tr key={ent.id}>
                                                <td style={{ fontWeight: 'bold' }}>{ent.name}</td>
                                                <td>{ent.tax_id || '—'}</td>
                                                <td><span className="badge badge-ok">Active</span></td>
                                                <td>
                                                    <button className="btn btn-sm" onClick={async () => {
                                                        if (confirm(`Delete entity "${ent.name}"?`)) {
                                                            try {
                                                                await apiFetch(`/v1/bank-master/entities/${ent.id}`, { method: 'DELETE' });
                                                                loadData();
                                                            } catch (err) { alert(err.message); }
                                                        }
                                                    }}>Delete</button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            )}
                        </div>
                    </div>

                    {/* Add Bank Account Section */}
                    <div className="card" style={{ marginBottom: '1.5rem' }}>
                        <div className="card-header">
                            <h3>Add Bank Account</h3>
                        </div>
                        <div className="card-body">
                            <form onSubmit={handleCreateAccount} style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(210px, 1fr))', gap: '1rem', alignItems: 'end' }}>
                                <div>
                                    <label style={{ display: 'block', marginBottom: '0.4rem', fontSize: '0.51rem', fontWeight: 'bold', whiteSpace: 'nowrap' }}>Entity</label>
                                    <select value={newAccEntityId} onChange={e => setNewAccEntityId(e.target.value)} style={{ width: '100%' }}>
                                        <option value="">-- Select Entity --</option>
                                        {entities.map(ent => (
                                            <option key={ent.id} value={ent.id}>{ent.name}</option>
                                        ))}
                                    </select>
                                </div>

                                <div>
                                    <label style={{ display: 'block', marginBottom: '0.4rem', fontSize: '0.51rem', fontWeight: 'bold', whiteSpace: 'nowrap' }}>Bank</label>
                                    <select value={newAccBankId} onChange={e => setNewAccBankId(e.target.value)} style={{ width: '100%' }}>
                                        <option value="">-- Select Bank --</option>
                                        {banks.map(b => (
                                            <option key={b.id} value={b.id}>{b.name} ({b.code})</option>
                                        ))}
                                    </select>
                                </div>

                                <div>
                                    <label style={{ display: 'block', marginBottom: '0.4rem', fontSize: '0.51rem', fontWeight: 'bold', whiteSpace: 'nowrap' }}>Account Type</label>
                                    <select value={newAccType} onChange={e => setNewAccType(e.target.value)} style={{ width: '100%' }}>
                                        <option value="CURRENT">CURRENT</option>
                                        <option value="SAVINGS">SAVINGS</option>
                                        <option value="OD">OVERDRAFT</option>
                                        <option value="CC">CASH CREDIT</option>
                                    </select>
                                </div>

                                <div>
                                    <label style={{ display: 'block', marginBottom: '0.4rem', fontSize: '0.51rem', fontWeight: 'bold', whiteSpace: 'nowrap' }}>Account Number (12 Digits)</label>
                                    <input
                                        type="text"
                                        placeholder="e.g. 502000123456"
                                        maxLength={12}
                                        value={newAccNumber}
                                        onChange={e => setNewAccNumber(e.target.value.replace(/\D/g, ''))}
                                        style={{ width: '100%' }}

                                <div>
                                    <label style={{ display: 'block', marginBottom: '0.4rem', fontSize: '0.51rem', fontWeight: 'bold', whiteSpace: 'nowrap' }}>Currency</label>
                                    <input
                                        type="text"
                                        value={newAccCurrency}
                                        onChange={e => setNewAccCurrency(e.target.value.toUpperCase())}
                                        style={{ width: '100%' }}
                                    />

        // --- Reports & Treasury Overview Component ---
        function ReportsView() {
            const { selectedEntityId, selectedBankId, fromDate, toDate } = React.useContext(FilterContext);
            const [activeTab, setActiveTab] = useState('treasury');
            const [startDate, setStartDate] = useState('');
            const [endDate, setEndDate] = useState('');
            const [treasuryData, setTreasuryData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState('');
            const [exporting, setExporting] = useState(false);
            const [exportError, setExportError] = useState('');
            const [expandedInflows, setExpandedInflows] = useState(false);
            const [expandedOutflows, setExpandedOutflows] = useState(false);
            // Named report period, resolved on the server. Kept there rather than
            // computed here so a browser in another timezone cannot disagree with
            // the database about when the month starts — which is exactly the
            // week it would matter.
            const [reportPeriod, setReportPeriod] = useState('current_month');
            // Which entities have their account columns showing. A Set, because
            // the hierarchy expands per entity, not all-or-nothing.
            const [expandedEntities, setExpandedEntities] = useState(() => new Set());
            const [showForecastDrivers, setShowForecastDrivers] = useState(false);
            // One-shot guard: the period is corrected at most once per visit, so
            // a deliberate choice of an empty period is never overridden.
            const periodAutoFixed = React.useRef(false);
            const [autoPeriodNote, setAutoPeriodNote] = useState('');
            /* The request the auto-fix below has already served. reportPeriod is
               in the load effect's dep list, so correcting it used to kick off a
               SECOND complete treasury report — guaranteed, on the common path
               where the default current month holds nothing. Keyed on the whole
               URL rather than just the period: if another filter changed in the
               same batch the request really is different and must still go out. */
            const servedUrlRef = React.useRef(null);

            const toggleEntity = (id) => setExpandedEntities(prev => {
                const next = new Set(prev);
                next.has(id) ? next.delete(id) : next.add(id);
                return next;
            });

            // Pulled out of loadTreasury so the load effect can ask what a given
            // period would request without issuing it.
            const buildTreasuryUrl = (period) => {
                let url = '/reports/treasury?';
                const effStart = startDate || fromDate;
                const effEnd = endDate || toDate;
                // Explicit dates win over the preset, server-side too: someone
                // who typed a range meant that range.
                url += `period=${(effStart || effEnd) ? 'custom' : period}&`;
                if (effStart) url += `start_date=${effStart}&`;
                if (effEnd) url += `end_date=${effEnd}&`;
                if (selectedEntityId) url += `entity_id=${selectedEntityId}&`;
                if (selectedBankId) url += `account_id=${selectedBankId}&`;
                return url;
            };

            const loadTreasury = async (periodOverride) => {
                setLoading(true);
                setError('');
                try {
                    // typeof, not truthiness: this function is also wired
                    // directly to the Refresh Report and Apply Filters buttons,
                    // which hand it a click event as its first argument.
                    const period = (typeof periodOverride === 'string' && periodOverride)
                        || reportPeriod;
                    const data = await apiFetch(buildTreasuryUrl(period));
                    setTreasuryData(data);

                    // Land on a period that actually holds data.
                    //
                    // The default was "current month", which for a ledger of
                    // last year's statements renders a full report of ₹0.00 —
                    // indistinguishable from a broken page, and worse than
                    // showing nothing because every figure looks authoritative.
                    // Done once per mount, and only when the chosen period is
                    // genuinely empty while data exists elsewhere, so it can
                    // never fight a period the user picked on purpose.
                    const dr = data.data_range || {};
                    if (!periodAutoFixed.current && dr.last_transaction
                        && (dr.transactions_in_period || 0) === 0
                        && !startDate && !endDate) {
                        periodAutoFixed.current = true;
                        setAutoPeriodNote(
                            `No transactions in ${data.period.label}. `
                            + `Showing all data instead (${dr.first_transaction} to ${dr.last_transaction}).`);
                        // The corrected report is fetched here, in this same pass,
                        // and the effect below is told it has already been served.
                        // Note the second request is skipped outright when it would
                        // be byte-identical: with explicit dates in play the URL is
                        // pinned to period=custom, so the "corrected" period asks
                        // the server exactly the same question.
                        const fixedUrl = buildTreasuryUrl('all_time');
                        servedUrlRef.current = fixedUrl;
                        setReportPeriod('all_time');
                        if (fixedUrl !== buildTreasuryUrl(period)) {
                            await loadTreasury('all_time');
                        }
                        return;
                    }
                } catch (err) {
                    setError(err.message || 'Failed to load Treasury report');
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                const served = servedUrlRef.current;
                servedUrlRef.current = null;
                if (activeTab !== 'treasury') return;
                if (served && served === buildTreasuryUrl(reportPeriod)) return;
                loadTreasury();
            }, [activeTab, selectedEntityId, selectedBankId, fromDate, toDate, startDate, endDate, reportPeriod]);

            const handleExportTreasury = async () => {
                try {
                    setExporting(true);
                    setExportError('');
                    const effStart = startDate || fromDate;
                    const effEnd = endDate || toDate;
                    let url = '/reports/export/treasury?';
                    // The export must be the period on screen, or the file and the
                    // page quietly disagree.
                    url += `period=${(effStart || effEnd) ? 'custom' : reportPeriod}&`;
                    if (effStart) url += `start_date=${effStart}&`;
                    if (effEnd) url += `end_date=${effEnd}&`;
                    if (selectedEntityId) url += `entity_id=${selectedEntityId}&`;
                    if (selectedBankId) url += `account_id=${selectedBankId}&`;
                    await apiDownload(url, 'treasury_overview_report.csv');
                } catch (err) {
                    setExportError(err.message || 'Failed to export Treasury CSV');
                } finally {
                    setExporting(false);
                }
            };

            const handleExportTransactions = async (type) => {
                try {
                    setExporting(true);
                    setExportError('');
                    let url = `/reports/export/${type}?`;
                    if (selectedEntityId) url += `entity_id=${selectedEntityId}&`;
                    if (selectedBankId) url += `account_id=${selectedBankId}&`;
                    if (fromDate) url += `start_date=${fromDate}&`;
                    if (toDate) url += `end_date=${toDate}&`;
                    const ext = type === 'excel' ? 'xlsx' : type;
                    await apiDownload(url, `transactions_report.${ext}`);
                } catch (err) {
                    setExportError(err.message || `Failed to export ${type.toUpperCase()}`);
                } finally {
                    setExporting(false);
                }
            };

            // One flat list of columns so every metric row renders the same shape.
            // Building it once here is what keeps an entity and its accounts
            // aligned as the hierarchy expands, instead of each row re-deriving
            // the layout and drifting.
            const columns = React.useMemo(() => {
                const out = [];
                (treasuryData ? treasuryData.entities : []).forEach(e => {
                    out.push({ kind: 'entity', key: `e_${e.entity_id}`, entity: e, data: e });
                    if (expandedEntities.has(e.entity_id)) {
                        (e.accounts || []).forEach(a => out.push({
                            kind: 'account', key: `a_${a.account_id}`, entity: e,
                            account: a, data: a,
                        }));
                    }
                });
                return out;
            }, [treasuryData, expandedEntities]);

            const rs = (val) => {
                if (val === undefined || val === null) return '₹0.00';
                const num = Number(val);
                return '₹' + num.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            };

            /* reports-page: `.stat-card` is shared with Ingestion, Email Pickup
               and RPA, which are staying as they are. This class is what lets

               identical markup on those pages. */

                            <h2 style={{ fontSize: '0.9rem', fontWeight: 'bold', marginBottom: '0.25rem' }}>Reports &amp; Treasury Intelligence</h2>
                            <p style={{ color: 'var(--gray-600)', fontSize: '0.54rem' }}>
                                Executive Group &amp; Entity Level Liquidity, Cash Flow, Minimum Balance Breaches &amp; Export.
                            </p>
                        </div>
                        {activeTab === 'treasury' && (
                            <div style={{ display: 'flex', gap: '0.75rem', alignItems: 'center' }}>
                                <button className="btn btn-sm" onClick={loadTreasury} disabled={loading}>
                                     Refresh Report
                                </button>
                                <button
                                    onClick={handleExportTreasury}
                                    disabled={exporting}
                                    className="btn btn-sm btn-primary"
                                >
                                     {exporting ? 'Exporting...' : 'Export Treasury CSV'}
                                </button>
                            </div>
                        )}
                    </div>

                    {exportError && (
                        <div style={{ background: '#fef2f2', border: '1px solid #fecaca', color: '#991b1b', padding: '0.75rem 1rem', borderRadius: '4px', marginBottom: '1.5rem', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                            <span>⚠️ {exportError}</span>
                            <button style={{ background: 'none', border: 'none', cursor: 'pointer', fontWeight: 'bold', color: '#991b1b' }} onClick={() => setExportError('')}>✕</button>
                        </div>
                    )}

                    {/* Sub Navigation Tabs */}
                    <div style={{ display: 'flex', borderBottom: '1px solid var(--gray-300)', marginBottom: '1.5rem' }}>
                        {[
                            { key: 'treasury', label: 'Treasury Overview (Group Level)' },
                            { key: 'csv', label: 'Export Transactions (CSV / Excel / PDF)' }
                        ].map(t => (
                            <button
                                key={t.key}
                                style={{
                                    padding: '0.75rem 1.25rem',
                                    border: 'none',
                                    background: 'none',
                                    borderBottom: activeTab === t.key ? '2px solid var(--primary-color)' : 'none',
                                    fontWeight: activeTab === t.key ? 'bold' : 'normal',
                                    color: activeTab === t.key ? 'var(--primary-color)' : 'var(--gray-600)',
                                    cursor: 'pointer',
                                    fontSize: '0.57rem'
                                }}
                                onClick={() => setActiveTab(t.key)}
                            >
                                {t.label}
                            </button>
                        ))}
                    </div>

                    {activeTab === 'treasury' && (
                        <div>
                            {/* Filter bar — the same slim `.topbar` the rest of the

                                It was a 1rem-padded card with every label stacked

                            </div>

                            {autoPeriodNote && (

                                              padding: '0.5rem 0.85rem', borderRadius: '4px', marginBottom: '0.75rem',

                            {treasuryData && treasuryData.data_range

                                    {/* Said out loud, because every figure below reads 0.00 and

                                </div>

                            {error && (

                                                {(treasuryData.decision_cards && treasuryData.decision_cards.cash_runway.status) || treasuryData.group_totals.cash_runway || 'Cash-flow positive'}
                                            </div>

                                                    : 'Prior period: ' + rs((treasuryData.decision_cards && treasuryData.decision_cards.net_cash_flow.previous) || 0)}

        // --- Settings & Preferences View Component ---
        function SettingsView() {
            const [schedules, setSchedules] = useState([]);
            const [loadingSchedules, setLoadingSchedules] = useState(true);
            const [scheduleMsg, setScheduleMsg] = useState('');
            const [scheduleError, setScheduleError] = useState('');

            // Schedule Modal state
            const [showModal, setShowModal] = useState(false);
            const [editingSchedule, setEditingSchedule] = useState(null); // null = new
            const [formReportType, setFormReportType] = useState('Daily Treasury Summary');
            const [formFrequency, setFormFrequency] = useState('Daily');
            const [formTime, setFormTime] = useState('09:00');
            const [formDayOfWeek, setFormDayOfWeek] = useState('Monday');
            const [formDayOfMonth, setFormDayOfMonth] = useState(1);
            const [formRecipients, setFormRecipients] = useState('');
            const [formIsActive, setFormIsActive] = useState(true);
            const [formError, setFormError] = useState('');
            const [submittingSchedule, setSubmittingSchedule] = useState(false);

            // Preferences state
            const [currency, setCurrency] = useState('INR - ₹');
            const [dateFormat, setDateFormat] = useState('MMM DD, YYYY');
            const [savingPref, setSavingPref] = useState(false);
            const [prefMsg, setPrefMsg] = useState('');
            const [prefError, setPrefError] = useState('');

            const loadSettingsData = async () => {
                setLoadingSchedules(true);
                try {
                    const [schedData, prefData] = await Promise.all([
                        apiFetch('/settings/email-schedules'),
                        apiFetch('/settings/preferences').catch(() => null)
                    ]);
                    setSchedules(Array.isArray(schedData) ? schedData : []);
                    if (prefData) {
                        setCurrency(prefData.default_currency || 'INR - ₹');
                        setDateFormat(prefData.date_format || 'MMM DD, YYYY');
                    }
                } catch (err) {
                    setScheduleError(err.message || 'Failed to load settings data');
                } finally {
                    setLoadingSchedules(false);
                }
            };

            useEffect(() => {
                loadSettingsData();
            }, []);

            const handleSavePreferences = async (e) => {
                e.preventDefault();
                setSavingPref(true);
                setPrefMsg('');
                setPrefError('');
                try {
                    await apiFetch('/settings/preferences', {
                        method: 'PUT',
                        body: JSON.stringify({
                            default_currency: currency,
                            date_format: dateFormat
                        })
                    });
                    setPrefMsg('Preferences saved successfully!');
                    setTimeout(() => setPrefMsg(''), 4000);
                } catch (err) {
                    setPrefError(err.message || 'Failed to save preferences');
                } finally {
                    setSavingPref(false);
                }
            };

            const openAddModal = () => {
                setEditingSchedule(null);
                setFormReportType('Daily Treasury Summary');
                setFormFrequency('Daily');
                setFormTime('09:00');
                setFormDayOfWeek('Monday');
                setFormDayOfMonth(1);
                setFormRecipients('');
                setFormIsActive(true);
                setFormError('');
                setShowModal(true);
            };

            const openEditModal = (s) => {
                setEditingSchedule(s);
                setFormReportType(s.report_type || '');
                setFormFrequency(s.frequency || 'Daily');
                setFormTime(s.scheduled_time || '09:00');
                setFormDayOfWeek(s.day_of_week || 'Monday');
                setFormDayOfMonth(s.day_of_month || 1);
                setFormRecipients(s.recipients || '');
                setFormIsActive(s.is_active !== undefined ? s.is_active : true);
                setFormError('');
                setShowModal(true);
            };

            const handleScheduleSubmit = async (e) => {
                e.preventDefault();
                setFormError('');

                // Validation
                if (!formReportType.trim()) {
                    setFormError('Report Type is required.');
                    return;
                }
                if (!formRecipients.trim()) {
                    setFormError('Recipients are required.');
                    return;
                }
                const emails = formRecipients.split(',').map(e => e.trim()).filter(Boolean);
                if (emails.length === 0) {
                    setFormError('Please provide at least one recipient email address.');
                    return;
                }
                for (const em of emails) {
                    if (!em.includes('@') || !em.split('@')[1].includes('.')) {
                        setFormError(`Invalid recipient email address: '${em}'`);
                        return;
                    }
                }

                setSubmittingSchedule(true);
                try {
                    const payload = {
                        report_type: formReportType.trim(),
                        frequency: formFrequency,
                        scheduled_time: formTime,
                        day_of_week: formFrequency === 'Weekly' ? formDayOfWeek : null,
                        day_of_month: formFrequency === 'Monthly' ? Number(formDayOfMonth) : null,
                        recipients: formRecipients,
                        is_active: formIsActive
                    };

                    if (editingSchedule) {
                        await apiFetch(`/settings/email-schedules/${editingSchedule.id}`, {
                            method: 'PUT',
                            body: JSON.stringify(payload)
                        });
                        setScheduleMsg(`Updated schedule '${formReportType}'`);
                    } else {
                        await apiFetch('/settings/email-schedules', {
                            method: 'POST',
                            body: JSON.stringify(payload)
                        });
                        setScheduleMsg(`Created schedule '${formReportType}'`);
                    }

                    setShowModal(false);
                    await loadSettingsData();
                    setTimeout(() => setScheduleMsg(''), 4000);
                } catch (err) {
                    setFormError(err.message || 'Failed to save schedule');
                } finally {
                    setSubmittingSchedule(false);
                }
            };

            const handleToggleActive = async (s) => {
                try {
                    await apiFetch(`/settings/email-schedules/${s.id}`, {
                        method: 'PUT',
                        body: JSON.stringify({ is_active: !s.is_active })
                    });
                    setScheduleMsg(`Schedule '${s.report_type}' ${!s.is_active ? 'enabled' : 'disabled'}`);
                    await loadSettingsData();
                    setTimeout(() => setScheduleMsg(''), 4000);
                } catch (err) {
                    setScheduleError(err.message);
                }
            };

            const handleDeleteSchedule = async (s) => {
                if (!confirm(`Are you sure you want to delete schedule '${s.report_type}'?`)) return;
                try {
                    await apiFetch(`/settings/email-schedules/${s.id}`, { method: 'DELETE' });
                    setScheduleMsg(`Deleted schedule '${s.report_type}'`);
                    await loadSettingsData();
                    setTimeout(() => setScheduleMsg(''), 4000);
                } catch (err) {
                    setScheduleError(err.message);
                }
            };

            // ---- FX rate editor -------------------------------------------
            // The shipped rates are placeholders. Everything on the Transactions
            // tab that is not read off a bank advice is computed from them, so
            // this table is where a converted figure becomes trustworthy.
            const [fxRows, setFxRows] = useState([]);
            const [fxDrafts, setFxDrafts] = useState({});
            const [fxDate, setFxDate] = useState(new Date().toISOString().slice(0, 10));
            const [fxMsg, setFxMsg] = useState('');
            const [fxError, setFxError] = useState('');
            const [fxSaving, setFxSaving] = useState('');

            const [fxStatus, setFxStatus] = useState(null);
            const [fxRefreshing, setFxRefreshing] = useState(false);

            const loadFxRates = async () => {
                try {
                    const [cs, st] = await Promise.all([
                        apiFetch('/currencies'),
                        apiFetch('/currencies/refresh/status').catch(() => null),
                    ]);
                    setFxRows(Array.isArray(cs) ? cs : []);
                    if (st) setFxStatus(st);
                } catch (err) {
                    setFxError(err.message || 'Failed to load currencies');
                }
            };

            useEffect(() => { loadFxRates(); }, []);

            const [fxConflicts, setFxConflicts] = useState([]);

            // `overwriteCodes` carries the user's answer back to the server. It
            // re-fetches rather than accepting a number from the browser, so the
            // stored rate's provenance stays whatever the source actually said.
            const refreshFxNow = async (overwriteCodes) => {
                setFxRefreshing(true);
                setFxError('');
                try {
                    const qs = overwriteCodes && overwriteCodes.length
                        ? '?overwrite_manual=' + encodeURIComponent(overwriteCodes.join(','))
                        : '';
                    const report = await apiFetch('/currencies/refresh' + qs, { method: 'POST' });
                    setFxConflicts(report.conflicts || []);
                    const parts = [];
                    if (report.updated && report.updated.length) parts.push(`${report.updated.length} updated`);
                    if (report.unchanged && report.unchanged.length) parts.push(`${report.unchanged.length} unchanged`);
                    if (report.rejected && report.rejected.length) parts.push(`${report.rejected.length} rejected`);
                    setFxMsg(parts.join(', ') || 'No rates returned');
                    // Errors and rejections are surfaced, not swallowed: a scrape
                    // that has started returning nonsense is only visible here.
                    if (report.errors && report.errors.length) {
                        setFxError(report.errors.join(' | '));
                    } else if (report.rejected && report.rejected.length) {
                        setFxError('Refused to store: ' + report.rejected.join(' | '));
                    }
                    if (report.conflicts && report.conflicts.length) {
                        parts.push(`${report.conflicts.length} need your decision`);
                        setFxMsg(parts.join(', '));
                    }
                    setTimeout(() => setFxMsg(''), 6000);
                    await loadFxRates();
                } catch (err) {
                    setFxError(err.message || 'Refresh failed');
                } finally {
                    setFxRefreshing(false);
                }
            };

            const saveFxRate = async (code) => {
                const raw = fxDrafts[code];
                const value = Number(raw);
                if (!raw || !isFinite(value) || value <= 0) {
                    setFxError(`Enter a positive rate for ${code}`);
                    return;
                }
                setFxSaving(code);
                setFxError('');
                try {
                    await apiFetch(`/currencies/${code}/rate`, {
                        method: 'PUT',
                        body: JSON.stringify({ inr_per_unit: value, as_of: fxDate }),
                    });
                    setFxDrafts(d => { const n = { ...d }; delete n[code]; return n; });
                    setFxMsg(`${code} set to ${value} INR as of ${fxDate}`);
                    setTimeout(() => setFxMsg(''), 4000);
                    await loadFxRates();
                } catch (err) {
                    setFxError(err.message || `Failed to save ${code}`);
                } finally {
                    setFxSaving('');
                }
            };

            const formatNextSend = (s) => {
                if (!s.is_active || !s.next_send_at) return <span style={{ color: 'var(--gray-500)', fontStyle: 'italic' }}>Inactive</span>;
                const d = new Date(s.next_send_at);
                if (isNaN(d.getTime())) return String(s.next_send_at);
                return d.toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });
            };

            return (
                <div style={{ padding: '0.25rem 0' }}>
                    <div style={{ marginBottom: '1.5rem' }}>
                        <h2 style={{ fontSize: '0.9rem', fontWeight: 'bold', marginBottom: '0.25rem' }}>Settings & System Preferences</h2>
                        <p style={{ color: 'var(--gray-600)', fontSize: '0.54rem' }}>
                            Configure automated email distribution schedules, default currency formatting, and date display options.
                        </p>
                    </div>

                    {scheduleMsg && (
                        <div style={{ padding: '0.75rem 1rem', background: '#dcfce7', color: '#15803d', border: '1px solid #bbf7d0', borderRadius: '4px', marginBottom: '1.25rem', fontSize: '0.528rem', fontWeight: '600' }}>
                            {scheduleMsg}
                        </div>
                    )}
                    {scheduleError && (
                        <div style={{ padding: '0.75rem 1rem', background: '#fef2f2', color: '#b91c1c', border: '1px solid #fecaca', borderRadius: '4px', marginBottom: '1.25rem', fontSize: '0.528rem', fontWeight: '600' }}>
                            {scheduleError}
                        </div>
                    )}

                    {/* Exchange rates. Placed above the schedules because a wrong
                        rate silently changes numbers on another screen, which is
                        harder to notice than a report that fails to send. */}
                    <div className="card" style={{ marginBottom: '2rem' }}>
                        <div className="card-header" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '0.75rem' }}>
                            <div>
                                <h3 style={{ margin: 0, fontSize: '0.69rem' }}>Exchange Rates</h3>
                                <div style={{ fontSize: '0.48rem', color: 'var(--gray-600)', marginTop: '0.15rem' }}>
                                    INR per one unit. Used by the "Show in" selector on the Transactions tab
                                    for any row where the bank advice did not state a foreign amount.
                                </div>
                            </div>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '0.6rem' }}>
                                {fxStatus && (
                                    <span style={{ fontSize: '0.44rem', color: 'var(--gray-600)', textAlign: 'right', lineHeight: 1.5 }}>
                                        {fxStatus.enabled
                                            ? `Auto-refresh every ${fxStatus.interval_minutes} min`
                                            : 'Auto-refresh off'}
                                        <br />
                                        {fxStatus.last_run && fxStatus.last_run.finished_at
                                            ? `Last run ${new Date(fxStatus.last_run.finished_at).toLocaleString()} — ${(fxStatus.last_run.updated || []).length} updated${(fxStatus.last_run.errors || []).length ? ', ' + fxStatus.last_run.errors.length + ' error(s)' : ''}`
                                            : 'Not run yet this session'}
                                    </span>
                                )}
                                <button className="btn btn-sm" onClick={() => refreshFxNow()} disabled={fxRefreshing}
                                        title="Fetch rates now instead of waiting for the next poll">
                                    {fxRefreshing ? 'Fetching…' : 'Refresh now'}
                                </button>
                            </div>
                        </div>
                        <div className="card-body">
                            <div style={{ padding: '0.6rem 0.85rem', background: '#fffbeb', border: '1px solid #fde68a',
                                          borderRadius: '4px', marginBottom: '1rem', fontSize: '0.48rem', color: '#78350f' }}>
                                <strong>fbil</strong> is India's official reference rate — published by Financial
                                Benchmarks India since 2018, and republished on RBI's own page. Cite this one.
                                It lags by a few days, so the most recent dates fall back to
                                <strong>frankfurter</strong>, a market rate with no standing with a tax officer;
                                a market rate never replaces an official one for the same day.
                                <strong>manual</strong> is a rate you entered and is never overwritten by a fetch.
                                <strong>seed</strong> is a placeholder that shipped in the source code, dated to no
                                real day — anything still showing seed has never been refreshed successfully.
                            </div>
                            {fxMsg && (
                                <div style={{ padding: '0.6rem 0.85rem', background: '#dcfce7', color: '#15803d',
                                              border: '1px solid #bbf7d0', borderRadius: '4px', marginBottom: '0.85rem',
                                              fontSize: '0.5rem', fontWeight: 600 }}>{fxMsg}</div>
                            )}
                            {fxError && (
                                <div style={{ padding: '0.6rem 0.85rem', background: '#fef2f2', color: '#b91c1c',
                                              border: '1px solid #fecaca', borderRadius: '4px', marginBottom: '0.85rem',
                                              fontSize: '0.5rem', fontWeight: 600 }}>{fxError}</div>
                            )}
                            {/* Manual-vs-fetched conflicts. Shown rather than auto-resolved:
                                a rate somebody typed may have come off a bank advice, which
                                beats a market mid-rate for that transaction. The application
                                cannot know which, so it asks instead of guessing. */}
                            {fxConflicts.length > 0 && (
                                <div style={{ border: '1px solid #bfdbfe', background: '#eff6ff',
                                              borderRadius: '4px', padding: '0.7rem 0.85rem',
                                              marginBottom: '1rem' }}>
                                    <div style={{ fontSize: '0.52rem', fontWeight: 700, color: '#1e3a8a',
                                                  marginBottom: '0.15rem' }}>
                                        {fxConflicts.length} rate{fxConflicts.length !== 1 ? 's you entered differ' : ' you entered differs'} from what was just fetched
                                    </div>
                                    <div style={{ fontSize: '0.46rem', color: '#1e40af', marginBottom: '0.6rem' }}>
                                        Your rates were left alone. Keep yours if you took them off a bank
                                        advice — that beats a market rate for those transactions.
                                    </div>
                                    <table className="rates-conflict-table" style={{ width: '100%', borderCollapse: 'collapse', marginBottom: '0.6rem' }}>
                                        <thead>
                                            <tr style={{ fontSize: '0.44rem', textTransform: 'uppercase', color: '#1e40af' }}>
                                                <th style={{ textAlign: 'left', padding: '0.2rem 0.3rem' }}>Currency</th>
                                                <th style={{ textAlign: 'right', padding: '0.2rem 0.3rem' }}>Yours</th>
                                                <th style={{ textAlign: 'right', padding: '0.2rem 0.3rem' }}>Fetched</th>
                                                <th style={{ textAlign: 'right', padding: '0.2rem 0.3rem' }}>Diff</th>
                                                <th style={{ textAlign: 'left', padding: '0.2rem 0.3rem' }}>Source</th>
                                                <th></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {fxConflicts.map(c => (
                                                <tr key={c.code + c.as_of} style={{ fontSize: '0.5rem' }}>
                                                    <td style={{ padding: '0.25rem 0.3rem' }}>
                                                        <strong>{c.code}</strong>
                                                        <span style={{ color: 'var(--gray-600)', fontSize: '0.44rem' }}> {c.as_of}</span>
                                                    </td>
                                                    <td style={{ textAlign: 'right', padding: '0.25rem 0.3rem', fontFamily: 'JetBrains Mono, monospace' }}>
                                                        {Number(c.manual_rate).toFixed(4)}
                                                    </td>
                                                    <td style={{ textAlign: 'right', padding: '0.25rem 0.3rem', fontFamily: 'JetBrains Mono, monospace' }}>
                                                        {Number(c.fetched_rate).toFixed(4)}
                                                    </td>
                                                    <td style={{ textAlign: 'right', padding: '0.25rem 0.3rem',
                                                                 fontFamily: 'JetBrains Mono, monospace',
                                                                 color: Math.abs(c.difference_pct) >= 5 ? '#991b1b' : 'var(--gray-700)' }}>
                                                        {c.difference_pct > 0 ? '+' : ''}{c.difference_pct}%
                                                    </td>
                                                    <td style={{ padding: '0.25rem 0.3rem', fontSize: '0.44rem' }}>{c.fetched_source}</td>
                                                    <td style={{ textAlign: 'right', padding: '0.25rem 0.3rem' }}>
                                                        <button className="btn btn-sm" disabled={fxRefreshing}
                                                                onClick={() => refreshFxNow([c.code])}
                                                                title={`Replace your ${c.code} rate with the ${c.fetched_source} value`}>
                                                            Use fetched
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                    <div style={{ display: 'flex', gap: '0.5rem' }}>
                                        <button className="btn btn-sm" disabled={fxRefreshing}
                                                onClick={() => refreshFxNow(fxConflicts.map(c => c.code))}>
                                            Use fetched for all
                                        </button>
                                        <button className="btn btn-sm" onClick={() => setFxConflicts([])}>
                                            Keep mine
                                        </button>
                                    </div>
                                </div>
                            )}
                            <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', marginBottom: '0.85rem' }}>
                                <label style={{ fontSize: '0.5rem', fontWeight: 'bold' }}>Rates apply from:</label>
                                <input type="date" value={fxDate} onChange={e => setFxDate(e.target.value)}
                                       style={{ fontSize: '0.5rem', padding: '0.3rem 0.45rem', borderRadius: '4px' }} />
                                <span style={{ fontSize: '0.46rem', color: 'var(--gray-600)' }}>
                                    Each transaction converts at the newest rate dated on or before its own date.
                                </span>
                            </div>
                            <div className="table-responsive">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>Currency</th>
                                            <th className="number-cell">Current (INR per unit)</th>
                                            <th>As of</th>
                                            <th>Source</th>
                                            <th className="number-cell">New rate</th>
                                            <th></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {fxRows.filter(c => !c.is_base).map(c => (
                                            <tr key={c.code}>
                                                <td><strong>{c.code}</strong> — {c.name}</td>
                                                <td className="number-cell">
                                                    {c.latest_rate && c.latest_rate.inr_per_unit != null
                                                        ? Number(c.latest_rate.inr_per_unit).toFixed(4) : '—'}
                                                </td>
                                                <td style={{ fontSize: '0.48rem' }}>
                                                    {(c.latest_rate && c.latest_rate.as_of) || '—'}
                                                </td>
                                                <td>
                                                    <span className="badge" style={(() => {
                                                        const src = (c.latest_rate && c.latest_rate.source) || 'none';
                                                        const palette = {
                                                            manual:      { background: '#dcfce7', color: '#15803d' },
                                                            fbil:        { background: '#dbeafe', color: '#1e40af' },
                                                            frankfurter: { background: '#ede9fe', color: '#5b21b6' },
                                                        };
                                                        return palette[src] || { background: '#fef3c7', color: '#92400e' };
                                                    })()}>
                                                        {(c.latest_rate && c.latest_rate.source) || 'none'}
                                                    </span>
                                                </td>
                                                <td className="number-cell">
                                                    <input
                                                        type="number" step="0.0001" min="0"
                                                        placeholder={c.latest_rate && c.latest_rate.inr_per_unit != null
                                                            ? String(c.latest_rate.inr_per_unit) : '0.0000'}
                                                        value={fxDrafts[c.code] === undefined ? '' : fxDrafts[c.code]}
                                                        onChange={e => setFxDrafts(d => ({ ...d, [c.code]: e.target.value }))}
                                                        style={{ fontSize: '0.5rem', padding: '0.25rem 0.4rem', width: '110px',
                                                                 borderRadius: '4px', textAlign: 'right' }}
                                                    />
                                                </td>
                                                <td>
                                                    <button className="btn btn-sm"
                                                            disabled={!fxDrafts[c.code] || fxSaving === c.code}
                                                            onClick={() => saveFxRate(c.code)}
                                                            style={{ opacity: fxDrafts[c.code] ? 1 : 0.45 }}>
                                                        {fxSaving === c.code ? 'Saving…' : 'Save'}
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    {/* 1. Scheduled Email Reports Card */}
                    <div className="card" style={{ marginBottom: '2rem' }}>
                        <div className="card-header" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '0.75rem' }}>
                            <div>
                                <h3 style={{ margin: 0, fontSize: '0.69rem' }}>Scheduled Email Reports</h3>
                                <div style={{ fontSize: '0.48rem', color: 'var(--gray-600)', marginTop: '0.15rem' }}>Automated treasury & compliance report delivery schedules</div>
                            </div>
                            <button className="btn btn-primary" onClick={openAddModal}>
                                + Add Schedule
                            </button>
                        </div>
                        <div className="card-body" style={{ padding: 0 }}>
                            <div className="table-responsive">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>REPORT</th>
                                            <th>FREQUENCY</th>
                                            <th>RECIPIENTS</th>
                                            <th>NEXT SEND</th>
                                            <th>STATUS</th>
                                            <th>ACTIONS</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {loadingSchedules ? (
                                            <tr>
                                                <td colSpan="6" style={{ textAlign: 'center', padding: '2rem', color: 'var(--gray-600)' }}>
                                                    Loading scheduled email reports...
                                                </td>
                                            </tr>
                                        ) : schedules.length === 0 ? (
                                            <tr>
                                                <td colSpan="6" style={{ textAlign: 'center', padding: '2rem', color: 'var(--gray-600)' }}>
                                                    No scheduled reports configured. Click <strong>+ Add Schedule</strong> to set up automated delivery.
                                                </td>
                                            </tr>
                                        ) : (
                                            schedules.map(s => (
                                                <tr key={s.id}>
                                                    <td style={{ fontWeight: 'bold' }}>{s.report_type}</td>
                                                    <td>
                                                        <span style={{ fontSize: '0.51rem', fontWeight: '500' }}>
                                                            {s.frequency} {s.frequency === 'Weekly' && s.day_of_week ? `(${s.day_of_week})` : s.frequency === 'Monthly' && s.day_of_month ? `(Day ${s.day_of_month})` : ''} at {s.scheduled_time}
                                                        </span>
                                                    </td>
                                                    <td style={{ fontSize: '0.492rem', color: 'var(--gray-700)', maxWidth: '240px', wordBreak: 'break-word' }}>
                                                        {s.recipients}
                                                    </td>
                                                    <td style={{ fontSize: '0.492rem', whiteSpace: 'nowrap' }}>
                                                        {formatNextSend(s)}
                                                    </td>
                                                    <td>
                                                        <span className={`badge ${s.is_active ? 'badge-ok' : ''}`} style={{ background: s.is_active ? undefined : '#f1f5f9', color: s.is_active ? undefined : '#64748b' }}>
                                                            {s.is_active ? 'Active' : 'Inactive'}
                                                        </span>
                                                    </td>
                                                    <td>
                                                        <div style={{ display: 'flex', gap: '0.4rem', flexWrap: 'wrap' }}>
                                                            <button className="btn btn-sm" onClick={() => openEditModal(s)}>Edit</button>
                                                            <button className="btn btn-sm" onClick={() => handleToggleActive(s)}>
                                                                {s.is_active ? 'Disable' : 'Enable'}
                                                            </button>
                                                            <button className="btn btn-sm" onClick={() => handleDeleteSchedule(s)}>Delete</button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    {/* 2. Preferences Card */}
                    <div className="card" style={{ maxWidth: '640px' }}>
                        <div className="card-header">
                            <h3 style={{ margin: 0, fontSize: '0.69rem' }}>Preferences</h3>
                            <div style={{ fontSize: '0.48rem', color: 'var(--gray-600)', marginTop: '0.15rem' }}>Default currency and date display formatting</div>
                        </div>
                        <div className="card-body">
                            {prefMsg && (
                                <div style={{ padding: '0.65rem 0.85rem', background: '#dcfce7', color: '#15803d', border: '1px solid #bbf7d0', borderRadius: '4px', marginBottom: '1rem', fontSize: '0.51rem', fontWeight: '600' }}>
                                    {prefMsg}
                                </div>
                            )}
                            {prefError && (
                                <div style={{ padding: '0.65rem 0.85rem', background: '#fef2f2', color: '#b91c1c', border: '1px solid #fecaca', borderRadius: '4px', marginBottom: '1rem', fontSize: '0.51rem', fontWeight: '600' }}>
                                    {prefError}
                                </div>
                            )}
                            <form onSubmit={handleSavePreferences}>
                                <div style={{ marginBottom: '1.25rem' }}>
                                    <label style={{ display: 'block', fontWeight: 'bold', fontSize: '0.528rem', marginBottom: '0.35rem' }}>
                                        Default Currency
                                    </label>
                                    <select
                                        value={currency}
                                        onChange={e => setCurrency(e.target.value)}
                                        style={{ width: '100%', padding: '0.5rem', fontSize: '0.54rem', borderRadius: '4px', border: '1px solid var(--gray-300)' }}
                                    >
                                        <option value="INR - ₹">INR - ₹</option>
                                        <option value="USD - $">USD - $</option>
                                        <option value="EUR - €">EUR - €</option>
                                        <option value="GBP - £">GBP - £</option>
                                    </select>
                                </div>
                                <div style={{ marginBottom: '1.5rem' }}>
                                    <label style={{ display: 'block', fontWeight: 'bold', fontSize: '0.528rem', marginBottom: '0.35rem' }}>
                                        Date Format
                                    </label>
                                    <select
                                        value={dateFormat}
                                        onChange={e => setDateFormat(e.target.value)}
                                        style={{ width: '100%', padding: '0.5rem', fontSize: '0.54rem', borderRadius: '4px', border: '1px solid var(--gray-300)' }}
                                    >
