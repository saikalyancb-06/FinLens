                scales: {
                    x: { ticks: { font: axisFont, color: MUTED, callback: (v) => dmc(v), maxTicksLimit: 5 },
                         grid: { color: GRID }, border: { display: false } },
                    y: { ticks: { font: labelFont, color: '#333333', autoSkip: false,
                                  crossAlign: 'far',
                                  callback: function (v) { return labels[v]; } },
                         grid: { display: false }, border: { color: '#dddddd' } }
                }
            }), [dmc]);

            useEffect(() => {
                if (!outflowRef.current) return;
                if (outflowInst.current) { outflowInst.current.destroy(); outflowInst.current = null; }
                if (!outflowMix.available) return;

                const full = outflowMix.rows.map(r => r.label);
                // Truncation happens on the tick, not on the datum, so the
                // tooltip can still show the whole name.
                const short = full.map(s => s.length > 22 ? s.slice(0, 21) + '…' : s);

                outflowInst.current = new Chart(outflowRef.current.getContext('2d'), {
                    type: 'bar',
                    data: {
                        labels: short,
                        datasets: [{ data: outflowMix.rows.map(r => r.value),
                                     backgroundColor: BAR, borderWidth: 0, barPercentage: 0.82 }]
                    },
                    options: rankedBarOpts(short, full, (c) => {
                        const r = outflowMix.rows[c.dataIndex];
                        return dmx(r.value) + '   ' + r.share.toFixed(1) + '% of outflows   ·   '
                             + r.count + (r.count === 1 ? ' payment' : ' payments');
                    })
                });
                return () => { if (outflowInst.current) { outflowInst.current.destroy(); outflowInst.current = null; } };
            }, [outflowMix, rankedBarOpts, dmx, narrow]);

            /* ================================================================
               SECTION 6 — Top outflow counterparties
               ================================================================
               Same population as the breakdown above, so the two panels agree:
               internal transfers are out, everything paid to a party is in. */
            const counterparties = React.useMemo(() => {
                const d = counterpartyData;
                if (!d || !d.available) return { available: false };
                return {
                    available: true,
                    rows: d.rows.map(r => ({ name: r.name, value: r.value,
                                             count: r.count, share: r.share })),
                    total: d.total,
                    top5Share: d.top5_share,
                    top5Count: d.top5_count,
                    distinct: d.distinct
                };
            }, [counterpartyData]);

            useEffect(() => {
                if (!partyRef.current) return;
                if (partyInst.current) { partyInst.current.destroy(); partyInst.current = null; }
                if (!counterparties.available) return;

                const full = counterparties.rows.map(r => r.name);
                const short = full.map(s => s.length > 24 ? s.slice(0, 23) + '…' : s);

                partyInst.current = new Chart(partyRef.current.getContext('2d'), {
                    type: 'bar',
                    data: {
                        labels: short,
                        datasets: [{ data: counterparties.rows.map(r => r.value),
                                     backgroundColor: BAR, borderWidth: 0, barPercentage: 0.82 }]
                    },
                    options: rankedBarOpts(short, full, (c) => {
                        const r = counterparties.rows[c.dataIndex];
                        return dmx(r.value) + '   ' + r.share.toFixed(1) + '% of outflows   ·   '
                             + r.count + (r.count === 1 ? ' payment' : ' payments');
                    })
                });
                return () => { if (partyInst.current) { partyInst.current.destroy(); partyInst.current = null; } };
            }, [counterparties, rankedBarOpts, dmx, narrow]);

            /* ================================================================
               SECTION 7 — Forecast vs actual
               ================================================================
               The application has never stored forecast snapshots, so this is
               not a read of past predictions: /analytics/forecast-backtest
               replays the same recurring-series engine at a series of past
               cut-off dates and scores each projection against the balance that
               actually arrived. When there is not enough history for two such
               comparisons the endpoint says so and this panel shows the reason
               rather than a line with one point on it. */
            useEffect(() => {
                if (!accuracyRef.current) return;
                if (accuracyInst.current) { accuracyInst.current.destroy(); accuracyInst.current = null; }
                if (!backtest || !backtest.available || !(backtest.points || []).length) return;

                const pts = backtest.points;
                accuracyInst.current = new Chart(accuracyRef.current.getContext('2d'), {
                    type: 'line',
                    data: {
                        labels: pts.map(p => p.forecast_date),
                        datasets: [
                            { label: 'Actual', data: pts.map(p => p.actual), borderColor: INK,
                              backgroundColor: 'rgba(17,17,17,0.05)', borderWidth: 1.75,
                              pointRadius: 2.5, pointBackgroundColor: INK, fill: true, tension: 0.2 },
                            { label: 'Forecast', data: pts.map(p => p.forecast_expected),
                              borderColor: MUTED, borderDash: [5, 3], borderWidth: 1.75,
                              pointRadius: 2.5, pointBackgroundColor: MUTED, fill: false, tension: 0.2 }
                        ]
                    },
                    options: {
                        ...baseOpts,
                        plugins: {
                            legend: legendStyle,
                            tooltip: { ...tooltipStyle, callbacks: {
                                title: (items) => 'Forecast for ' + fmtDay(items[0].label),
                                label: (c) => c.dataset.label + '  ' + dmx(c.parsed.y),
                                afterBody: (items) => {
                                    const p = pts[items[0].dataIndex];
                                    return ['drawn ' + fmtDay(p.as_of)
                                            + (p.error_pct !== null && p.error_pct !== undefined
                                               ? '  ·  off by ' + p.error_pct + '%' : '')];
                                }
                            } }
                        },
                        scales: {
                            ...baseOpts.scales,
                            x: { ...baseOpts.scales.x,
                                 ticks: { ...baseOpts.scales.x.ticks, maxTicksLimit: 8,
                                          callback: function (v) { return fmtDay(this.getLabelForValue(v)); } } }
                        }
                    }
                });
                return () => { if (accuracyInst.current) { accuracyInst.current.destroy(); accuracyInst.current = null; } };
            }, [backtest, baseOpts, dmx]);

            /* ================================================================
               SECTION 8 — Unreconciled ageing
               ================================================================
               Bands come from the reconciliation module's own ageing, measured
               as at each run's period end rather than as at today — the
               accounting convention, and the reason the figure does not drift
               between page loads. Bars carry value, the table underneath
               carries the bank/book split, because an aged bank item and an
               aged book item are opposite problems. */
            const ageingRows = React.useMemo(() => {
                if (!ageing || !ageing.buckets || !ageing.total_count) return null;
                return ageing.buckets.filter(b => b.total_count > 0 || b.total_value > 0);
            }, [ageing]);

            useEffect(() => {
                if (!ageingRef.current) return;
                if (ageingInst.current) { ageingInst.current.destroy(); ageingInst.current = null; }
                if (!ageingRows || !ageingRows.length) return;

                // Older money is worse money: an item past 90 days is usually a
                // write-off argument, not a timing difference, so the bands
                // darken with age instead of being coloured arbitrarily.
                const shade = { '0-30 days': '#9ca3af', '31-60 days': '#6b7280',
                                '61-90 days': THRESHOLD, '90+ days': '#991b1b' };

                ageingInst.current = new Chart(ageingRef.current.getContext('2d'), {
                    type: 'bar',
                    data: {
                        labels: ageingRows.map(b => b.label),
                        datasets: [{ data: ageingRows.map(b => b.total_value),
                                     backgroundColor: ageingRows.map(b => shade[b.label] || BAR),
                                     borderWidth: 0, barPercentage: 0.75 }]
                    },
                    options: rankedBarOpts(
                        ageingRows.map(b => b.label),
                        ageingRows.map(b => b.label),
                        (c) => {
                            const b = ageingRows[c.dataIndex];
                            return dmx(b.total_value) + '   ' + b.total_count
                                 + (b.total_count === 1 ? ' item' : ' items')
                                 + '   ·   bank ' + b.bank_count + ' / book ' + b.book_count;
                        }
                    )
                });
                return () => { if (ageingInst.current) { ageingInst.current.destroy(); ageingInst.current = null; } };
            }, [ageingRows, rankedBarOpts, dmx, narrow]);

            /* ================================================================
               CASH BY BANK
               ================================================================
               Where the cash actually sits. Balances are the accounts'
               authoritative latest posted balance, the same figure the minimum
               balance panel further down is judged against. Rendered only when
               at least one account reports one — no balances, no panel. */
            const cashByBank = React.useMemo(() => {
                const rows = (scopedAccounts || [])
                    .filter(a => a.current_balance !== null && a.current_balance !== undefined)
                    .map(a => ({
                        id: a.id,
                        label: (a.bank_name || a.bank_code || 'Account')
                               + ' · ' + (a.account_number_masked || ''),
                        bank: a.bank_name || a.bank_code || 'Account',
                        balance: Number(a.current_balance),
                        minBalance: (a.min_balance === null || a.min_balance === undefined)
                            ? null : Number(a.min_balance),
                        belowMin: a.min_balance_status === 'below_minimum',
                        currency: a.currency || 'INR'
                    }))
                    .sort((a, b) => b.balance - a.balance);

                if (!rows.length) return { available: false };
                const total = rows.reduce((s, r) => s + r.balance, 0);
                rows.forEach(r => { r.share = total ? (r.balance / total) * 100 : 0; });
                return {
                    available: true, rows, total,
                    // Concentration is the reason this panel exists: one bank
                    // holding everything is a counterparty exposure, not a
                    // tidy balance sheet.
                    topShare: rows.length ? rows[0].share : null,
                    breaches: rows.filter(r => r.belowMin).length
                };
            }, [scopedAccounts]);

            useEffect(() => {
                if (!bankRef.current) return;
                if (bankInst.current) { bankInst.current.destroy(); bankInst.current = null; }
                if (!cashByBank.available) return;

                const full = cashByBank.rows.map(r => r.label);
                const short = full.map(s => s.length > 26 ? s.slice(0, 25) + '…' : s);

                bankInst.current = new Chart(bankRef.current.getContext('2d'), {
                    type: 'bar',
                    data: {
                        labels: short,
                        datasets: [{ data: cashByBank.rows.map(r => r.balance),
                                     backgroundColor: cashByBank.rows.map(r => r.belowMin ? NEGATIVE : BAR),
                                     borderWidth: 0, barPercentage: 0.72 }]
                    },
                    options: rankedBarOpts(short, full, (c) => {
                        const r = cashByBank.rows[c.dataIndex];
                        return dmx(r.balance) + '   ' + r.share.toFixed(1) + '% of cash'
                             + (r.minBalance !== null ? '   ·   min ' + dmx(r.minBalance) : '');
                    })
                });
                return () => { if (bankInst.current) { bankInst.current.destroy(); bankInst.current = null; } };
            }, [cashByBank, rankedBarOpts, dmx, narrow]);

            /* ================================================================
               KPI STRIP
               ================================================================
               Five figures, each either real or explicitly absent. Nothing here
               falls back to zero to look populated: a metric that cannot be
               computed says so, because a confident 0 and an unknown are
               different answers and only one of them is honest. */
            const kpis = React.useMemo(() => {
                const S = summary || {};
                const NA = { value: 'Not available', na: true };

                // 1. Total cash — the closing position, i.e. the latest posted
                //    running balance on each account, summed.
                const totalCash = (liquidity.available && liquidity.current !== undefined)
                    ? liquidity.current
                    : (S.consolidated_liquidity !== undefined && S.consolidated_liquidity !== null
                        ? S.consolidated_liquidity : null);

                // 2. Available liquidity — cash above the minimum balances the
                //    accounts are contractually held to. Not a new concept: the
                //    thresholds are the ones already configured per account. If
                //    none is set there is nothing being withheld, so available
                //    equals total and the tile says on what basis.
                const minLiq = liquidity.minLiquidity;
                const hasThreshold = minLiq !== null && minLiq !== undefined;
                const available = totalCash === null ? null
                    : (hasThreshold ? totalCash - minLiq : totalCash);

                // 3. 30-day net cash flow — forecast where the engine can
                //    project, otherwise the actual movement over the period, and
                //    the tile states which of the two it is showing.
                const h30 = (treasury && treasury.forecast && treasury.forecast.available
                             && treasury.forecast.horizons && treasury.forecast.horizons.day_30) || null;
                const netFlow = h30 ? h30.net_flow_expected
                    : (S.net_movement !== undefined && S.net_movement !== null ? S.net_movement : null);

                // 4. Forecast accuracy — measured, or absent. Never assumed.
                const acc = backtest && backtest.available ? backtest.accuracy_pct : null;

                // 5. Unreconciled — value leads, count supports. A bridge that
                //    has never been drawn is not "0 unreconciled"; it is a
                //    reconciliation nobody has run.
                const neverRun = !ageing || (ageing.accounts_covered || 0) === 0;

                return [
                    {
                        label: 'Total Cash',
                        value: totalCash === null ? 'Not available' : dmc(totalCash),
                        na: totalCash === null,
                        /* Cash on hand is a point-in-time fact, so it does not
                           shrink because the date filter was narrowed — it
                           falls back to the latest posted balance instead. The
                           tile has to say which of the two it is showing, or it
                           reads as a period figure that disagrees with the
                           chart below it. */
                        sub: liquidity.asOf
                            ? 'as at ' + fmtDay(liquidity.asOf)
                            : (S.last_statement_date
                                ? 'latest posted balance · ' + fmtDay(S.last_statement_date)
                                : (S.accounts_count || 0) + ' account' + ((S.accounts_count || 0) === 1 ? '' : 's')),
                        title: totalCash === null ? '' : dmx(totalCash)
                    },
                    {
                        label: 'Available Liquidity',
                        value: available === null ? 'Not available' : dmc(available),
                        na: available === null,
                        tone: available !== null && available < 0 ? 'is-critical' : '',
                        sub: hasThreshold
                            ? 'after ' + dmc(minLiq) + ' minimum balance'
                            : 'no minimum balance set',
                        title: available === null ? '' : dmx(available)
                    },
                    {
                        label: '30D Net Cash Flow',
                        value: netFlow === null ? 'Not available'
                            : (netFlow >= 0 ? '+' : '−') + dmc(Math.abs(netFlow)),
                        na: netFlow === null,
                        tone: netFlow === null ? '' : (netFlow >= 0 ? 'is-good' : 'is-critical'),
                        sub: h30 ? 'forecast · next 30 days' : 'actual · selected period',
                        title: netFlow === null ? '' : dmx(netFlow)
                    },
                    {
                        label: 'Forecast Accuracy',
                        value: acc === null ? 'Not available' : acc.toFixed(1) + '%',
                        na: acc === null,
                        tone: acc === null ? '' : (acc >= 90 ? 'is-good' : acc >= 75 ? 'is-warn' : 'is-critical'),
                        sub: acc === null
                            ? ((backtest && backtest.reason) || 'no comparable history')
                            : (backtest.points_count + ' back-tested periods'),
                        title: acc === null ? '' : (backtest && backtest.method) || ''
                    },
                    {
                        label: 'Unreconciled',
                        value: neverRun ? 'Not run'
                            : dmc((ageing && ageing.total_value) || S.unreconciled_value || 0),
                        na: neverRun,
                        tone: neverRun ? '' : ((ageing && ageing.total_count) ? 'is-warn' : 'is-good'),
                        sub: neverRun ? 'reconciliation not run'
                            : ((ageing && ageing.total_count) || 0) + ' bridge items'
                              + (ageing && ageing.oldest_days ? ' · oldest ' + ageing.oldest_days + 'd' : ''),
                        title: neverRun ? '' : dmx((ageing && ageing.total_value) || 0)
                    }
                ];
            }, [summary, liquidity, treasury, backtest, ageing, dmc, dmx]);

            /* ================================================================
               OPERATIONS & CONTROL — the dense card band
               ================================================================
               Everything the old one-line KPI strip carried, kept as cards
               rather than dropped. These answer a different question from the
               five treasury tiles above: not "what is our cash position" but
               "what is the state of the books behind it" — how much is
               reconciled, what the scanners flagged, how stale the data is.

               Every figure is read straight off /dashboard/summary. Nothing is
               invented here, and nothing falls back to zero to look populated:
               a metric that has not been computed shows as unavailable. */
            const opsCards = React.useMemo(() => {
                const S = summary || {};
                const has = (v) => v !== null && v !== undefined;
                const num = (v) => has(v) ? Number(v).toLocaleString('en-IN') : '--';
                const pct = (v) => has(v) ? Number(v).toFixed(1) + '%' : '--';

                const cov = S.reconciliation_coverage_pct;
                const comp = S.policy_compliance_pct;
                const age = S.data_age_days;
                const runway = S.runway_days;

                return [
                    { l: 'Closing Position', v: dmc(S.consolidated_liquidity || 0),
                      t: dmx(S.consolidated_liquidity || 0),
                      s: 'net ' + dmc(S.net_movement || 0) + ' this period' },

                    { l: 'Recon Coverage', v: has(cov) ? pct(cov) : '--',
                      c: !has(cov) ? '' : cov >= 99 ? 'is-good' : cov >= 90 ? 'is-warn' : 'is-critical',
                      s: has(cov) ? num(S.unreconciled_count) + ' bridge items'
                                  : 'no reconciliation run' },

                    { l: 'Unreconciled', v: dmc(S.unreconciled_value || 0),
                      t: dmx(S.unreconciled_value || 0),
                      c: (S.unreconciled_value || 0) > 0 ? 'is-warn' : '',
                      s: 'value at risk' },

                    { l: 'Anomalies', v: num(S.anomalies),
                      c: (S.critical_anomalies || 0) > 0 ? 'is-critical'
                         : (S.anomalies || 0) > 0 ? 'is-warn' : 'is-good',
                      s: num(S.critical_anomalies) + ' critical' },

                    { l: 'Compliance',
                      v: S.compliance_never_scanned ? 'not run' : pct(comp),
                      c: S.compliance_never_scanned || !has(comp) ? ''
                         : comp >= 98 ? 'is-good' : comp >= 90 ? 'is-warn' : 'is-critical',
                      s: S.compliance_never_scanned ? 'press Re-scan'
                         : num(S.open_violations) + ' open breaches' },

                    { l: 'Critical', v: num(S.critical_violations),
                      c: (S.critical_violations || 0) > 0 ? 'is-critical' : 'is-good',
                      s: 'statutory + internal breaches' },

                    { l: 'Bank Charges', v: dmc(S.bank_charges || 0),
                      t: dmx(S.bank_charges || 0),
                      s: 'often recoverable' },

                    { l: 'Avg Daily Burn', v: dmc(S.avg_daily_burn || 0),
                      t: dmx(S.avg_daily_burn || 0),
                      s: has(runway) ? num(runway) + 'd runway' : 'net positive' },

                    { l: 'Data Age', v: has(age) ? num(age) + 'd' : '--',
                      c: !has(age) ? '' : age > 30 ? 'is-critical' : age > 7 ? 'is-warn' : 'is-good',
                      s: S.last_statement_date || 'no data' },

                    { l: 'Transactions', v: num(S.total_transactions),
                      s: num(S.uncategorized_count) + ' uncategorised · '
                         + num(S.accounts_count) + ' acct' },

                    /* Uncategorised and Statements used to sit here. They were the
                       two that wrapped onto a second row, and neither earned it:
                       the uncategorised count is already the supporting line under
                       Transactions, and the statement count is a static figure
                       nobody acts on from this screen. Ten tiles fit one row. */
                ];
            }, [summary, dmc, dmx]);

            /* ================================================================
               POLICY RULES — the thresholds every compliance figure above is
               measured against, stated plainly.
               ================================================================
               The full editable table still lives further down behind "Manage
               Rules"; nothing was taken away. This is the read-only digest:
               what the rule is, the number it trips at, and how often it
               passes. Sorted worst pass rate first, because a rule sitting at
               100% needs no attention and a rule at 40% is the reason the
               compliance tile is red. */
            const rulesDigest = React.useMemo(() => {
                const perRule = (compliance && compliance.compliance
                                 && compliance.compliance.per_rule) || [];
                const statByCode = {};
                perRule.forEach(r => { statByCode[r.code] = r; });

                const active = (rules || []).filter(r => r.is_active);

                const rows = active.map(r => {
                    const stat = statByCode[r.code] || {};
                    /* A rule with nothing to test is not a rule that passed, so
                       an absent pass rate stays absent rather than becoming
                       100%. */
                    const passPct = (stat.pass_pct === null || stat.pass_pct === undefined)
                        ? null : Number(stat.pass_pct);
                    const limit = (r.threshold_paise !== null && r.threshold_paise !== undefined)
                        ? dmc(r.threshold_paise / 100)
                        : (r.threshold_count !== null && r.threshold_count !== undefined)
                            ? r.threshold_count + ' txns'
                            : '—';
                    return {
                        id: r.id,
                        name: r.name,
                        category: r.category,
                        severity: r.severity,
                        scope: r.direction_scope === 'debit' ? 'outflows'
                             : r.direction_scope === 'credit' ? 'inflows' : 'any',
                        limit,
                        passPct,
                        detail: r.description || r.statute_ref || r.rule_type || ''
                    };
                }).sort((a, b) => {
                    // Unmeasured rules sink below measured ones; among the
                    // measured, the worst pass rate leads.
                    if (a.passPct === null && b.passPct === null) return 0;
                    if (a.passPct === null) return 1;
                    if (b.passPct === null) return -1;
                    return a.passPct - b.passPct;
                });

                return {
                    rows,
                    activeCount: active.length,
                    totalCount: (rules || []).length,
                    breaching: rows.filter(r => r.passPct !== null && r.passPct < 100).length
                };
            }, [rules, compliance, dmc]);

            const dataStale = summary && summary.data_age_days !== null
                && summary.data_age_days !== undefined && summary.data_age_days > 30;

            return (
                <div className="treasury-dash">

                    {/* ============================================================
                        SECTION 1 — KPI summary
                        ============================================================ */}
                    <div className="kpi-strip kpi-strip-5">
                        {kpis.map((k, i) => (
                            <div className="kpi" key={i}>
                                <div className="kpi-label" title={k.label}>{k.label}</div>
                                <div className={'kpi-value ' + (k.na ? 'is-na ' : '') + (k.tone || '')}
                                     title={k.title || undefined}>{k.value}</div>
                                <div className="kpi-sub" title={k.sub}>{k.sub}</div>
                            </div>
                        ))}
                    </div>

                    {/* ============================================================
                        SECTION 1b — Operations & control
                        Dense card band: the whole control picture at a glance,
                        sitting under the five treasury figures it explains.
                        ============================================================ */}
                    <div className="ops-grid">
                        {opsCards.map((k, i) => (
                            <div className="ops-card" key={i}>
                                <div className="ops-label" title={k.l}>{k.l}</div>
                                <div className={'ops-value ' + (k.c || '')}
                                     title={k.t || undefined}>{k.v}</div>
                                <div className="ops-sub" title={k.s}>{k.s}</div>
                            </div>
                        ))}
                    </div>

                    {loading && <div className="dash-loading">Loading treasury position…</div>}

                    {(dataStale || (ccy.mixed)) && (
                        <div className="dash-notice">
                            {dataStale && (
                                <span>
                                    Statement data is {summary.data_age_days} days old
                                    {summary.last_statement_date ? ' — latest posting ' + summary.last_statement_date : ''}.
                                    Every figure below is as at that date, not today.
                                </span>
                            )}
                            {ccy.mixed && (
                                <span>
                                    {dataStale ? ' · ' : ''}
                                    Accounts in scope are held in more than one currency; totals are not converted.

                                        payee, a bare reference number — the classifier records that honestly

                            </div>
    <div className="card" ref={complianceCardRef}>

                                <div className="card-body" style={{ padding: 0 }}>
                                    <div className="finding-list">
                                        {(() => {
                                            const seenV = new Set();
                                            const dedupedV = violations.filter(v => {
                                                const k = (v.rule_id || '') + '|' + (v.rule_code || '') + '|' + (v.transaction_id || '') + '|' + (v.occurred_on || '') + '|' + (v.detail || '');
                                                if (seenV.has(k)) return false;
                                                seenV.add(k);
                                                return true;

                                                return (
                                                    <div style={{ padding: '1.25rem', textAlign: 'center', fontSize: '0.7rem', color: 'var(--gray-600)' }}>
                                                        No open policy breaches against the active rules.

        // --- Other App Shell Views ---
        function TransactionsView() {
            // accounts comes off the filter context instead of a third
            // /v1/bank-master/accounts request: AppLayout already fetches exactly
            // this list, unfiltered, and refreshes it on transactions_updated —
            // so the local copy was a duplicate request that also delayed the
            // Bank Account column by one extra round trip.
            /* `denom` included deliberately. The filter bar above this page shows
               a "Show in" selector, and until it was read here it did nothing on
               this tab — the dashboard rescaled to crores and the grid beside it
               stayed in units. */
            const { selectedEntityId, selectedBankId, fromDate, toDate, globalSearch, setSelectedBankId, denom, accounts: bankAccounts = [] } = React.useContext(FilterContext);
            const [txns, setTxns] = useState([]);
            const [search, setSearch] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('');
            const [selectedAccId, setSelectedAccId] = useState('');
            const [loading, setLoading] = useState(false);

            const [allCategories, setAllCategories] = useState([]);

            // How many of the loaded rows are actually mounted. A filterless load
            // is up to 10,000 <tr>, and React building all of them is what made
            // the tab feel like it hung after the data had already arrived. The
            // rows are all in memory; this only governs how many are painted, and
            // the footer below the table says so and offers the rest.
            const ROWS_PER_PAGE = 250;

            // Currency display. 'actual' shows each row in the currency it was
            // contracted in — the figure off the bank's advice — rather than a
            // number re-derived from the booked rupees at a table rate.
            const [displayCcy, setDisplayCcy] = useState('actual');
            // Which day's rate to convert at. 'txn' is the accounting answer —
            // a June payment was worth what it was worth in June. 'current'
            // answers "what is this worth now", which is the exposure question.
            // Both are legitimate and they are not interchangeable.
            const [rateBasis, setRateBasis] = useState('txn');
            const [currencies, setCurrencies] = useState([]);

            useEffect(() => {
                apiFetch('/currencies').then(cs => {
                    if (Array.isArray(cs)) setCurrencies(cs);
                }).catch(() => {});
            }, []);

            // A Map, not bankAccounts.find(). The label lookup runs per row over
            // as many as 10,000 rows, so the linear scan made the render O(n·m)
            // in the number of accounts for no reason.
            const accById = React.useMemo(
                () => new Map(bankAccounts.map(a => [a.id, a])),
                [bankAccounts]
            );

            const ccyMeta = React.useMemo(() => {
                const m = {};
                currencies.forEach(c => { m[c.code] = c; });
                return m;
            }, [currencies]);

            // One row's amount, in whatever currency the server rendered it.
            // Falls back to the stored rupee figure when no conversion was asked
            // for, so the column never goes blank.
            const cell = (t, field) => {
                const dv = t['display_' + field];
                if (dv === null || dv === undefined) {
                    const v = t[field];
                    // Stored rupees, so the rupee defaults apply.
                    return (v === null || v === undefined) ? '—'
                        : (field !== 'balance' && !(v > 0)) ? '—'
                        : window.moneyScaled(v, denom);
                }
                if (field !== 'balance' && !(dv > 0)) return '—';
                const code = field === 'balance'
                    ? (t.display_balance_currency || t.display_currency)
                    : t.display_currency;
                const meta = ccyMeta[code] || {};
                // moneyScaled, not moneyCcy, so the "Show in" selector reaches
                // this column too — and `decimals` is still passed, because at
                // unit scale it defers to the currency exactly as moneyCcy did.
                // A yen figure keeps its zero decimals; only the scaled units
                // standardise on two.
                return window.moneyScaled(dv, denom, {
                    symbol: meta.symbol !== undefined ? meta.symbol : '',
                    code: code, decimals: meta.decimals,
                });
            };

            /* The Category dropdown used to be built from a SECOND
               /transactions?limit=10000 request fired on mount, plus a THIRD on
               every transactions_updated event — the same ten thousand rows
               pulled two or three times per visit purely to collect a set of
               strings the first response already contained. It is now derived
               from the rows in state.

               The reason that second request existed was that it carried no
               filters, so the option list never narrowed while a category filter
               was applied. That is preserved here without the request: a load
               with no filters at all reproduces the old master list exactly and
               replaces the options, and any narrower load can only ADD to them.
               The list therefore never silently loses an option under a filter. */
            /* The category list comes from the server, not from whatever rows
               happen to be loaded.

               Three versions of this have now been wrong in the same direction.
               It began as a second /transactions?limit=10000 request fired purely
               to collect distinct category strings. That was removed in favour of
               deriving them from the rows already in state — which worked only
               while every row was in state. Once the table paged, the dropdown
               could only see the categories present in the first 250 rows, and
               quietly offered 14 of 17.

               /analytics/filters exists for precisely this and costs 619 bytes.
               It also lists exactly what `?category=` can match on, so every
               option in the dropdown is one the filter will honour — which was
               never true of a list scraped from row data. */
            useEffect(() => {
                apiFetch('/analytics/filters')
                    .then(meta => {
                        if (meta && Array.isArray(meta.categories)) {
                            setAllCategories(meta.categories);
                        }
                    })
                    .catch(() => {});   // the table still works without the filter
            }, []);

            /* Paged, not wholesale.
               This used to request limit=10000 on every mount: 1,823 rows, 3.5 MB
               decoded, and around 21 seconds in the browser — during which it
               held the server's GIL and starved every other request on the page,
               which is why a 256-byte account list could take 16 seconds. The
               table only ever showed 250 rows.

               `offset` walks the same filtered result set; X-Total-Count tells us
               how big it really is, so "Show all" and the row counter stay honest
               without downloading everything up front. */
            const buildTxnUrl = (offset, limit) => {
                let url = `/transactions?limit=${limit}&offset=${offset}&`;
                const activeSearch = globalSearch || search;
                if (activeSearch) url += `search=${encodeURIComponent(activeSearch)}&`;
                if (selectedCategory) url += `category=${encodeURIComponent(selectedCategory)}&`;
                const activeBank = selectedAccId || selectedBankId;
                if (activeBank) url += `bank_id=${activeBank}&`;
                if (selectedEntityId) url += `entity_id=${selectedEntityId}&`;
                if (fromDate) url += `start_date=${fromDate}&`;
                if (toDate) url += `end_date=${toDate}&`;
                if (displayCcy) url += `display_currency=${encodeURIComponent(displayCcy)}&`;
                if (displayCcy && displayCcy !== 'actual') url += `rate_basis=${rateBasis}&`;
                return url;
            };

            const [totalTxnCount, setTotalTxnCount] = useState(0);
            const [loadingMore, setLoadingMore] = useState(false);

            /* Fetch the next page and append. Used by "Show more" and "Show all".
               Sequential by necessity, not by accident: each call needs the row
               count already in state to know where the next page starts. */
            const loadMoreTxns = async (howMany) => {
                setLoadingMore(true);
                try {
                    const { data } = await apiFetchWithHeaders(
                        buildTxnUrl(txns.length, howMany));
                    if (Array.isArray(data) && data.length) {
                        setTxns(prev => prev.concat(data));
                    }
                } catch (e) {
                    console.error(e);
                } finally {
                    setLoadingMore(false);
                }
            };

            const loadTxns = async () => {
                setLoading(true);
                try {
                    const { data, headers } = await apiFetchWithHeaders(
                        buildTxnUrl(0, ROWS_PER_PAGE));
                    const total = parseInt(headers.get('X-Total-Count') || '', 10);

                    // Both applied in the same tick so the table and its Category
                    // dropdown land on one paint rather than two.
                    setTxns(Array.isArray(data) ? data : []);
                    setTotalTxnCount(Number.isFinite(total)
                        ? total : (Array.isArray(data) ? data.length : 0));
                } catch (e) {
                    console.error(e);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                loadTxns();
                const handleUpdate = () => { loadTxns(); };
                window.addEventListener('transactions_updated', handleUpdate);
                return () => window.removeEventListener('transactions_updated', handleUpdate);
            }, [search, selectedCategory, selectedAccId, globalSearch, selectedEntityId, selectedBankId, fromDate, toDate, displayCcy, rateBasis]);

            const clearData = async () => {
                if (!confirm("Are you sure you want to clear all workbench transactions?")) return;
                await apiFetch('/transactions/clear', { method: 'DELETE' });
                loadTxns();
            };

            const [deleteAccountId, setDeleteAccountId] = useState('');
            const [showDeletePanel, setShowDeletePanel] = useState(false);

            const clearByAccount = async () => {
                if (!deleteAccountId) { alert('Please select a bank account to delete transactions for.'); return; }
                const acc = bankAccounts.find(a => a.id === deleteAccountId);
                const label = acc ? `${acc.bank_name || acc.bank_code} (${acc.account_number_masked})` : deleteAccountId;
                if (!confirm(`Delete all transactions for account:\n${label}\n\nThis cannot be undone.`)) return;
                await apiFetch(`/transactions/clear?account_id=${deleteAccountId}`, { method: 'DELETE' });
                setDeleteAccountId('');
                setShowDeletePanel(false);
                loadTxns();
            };

            const getAccountLabel = (t) => {
                if (!t.account_id) return 'Default Account';
                const match = accById.get(t.account_id);
                if (match) {
                    return `${match.bank_name || match.bank_code} (${match.account_number_masked})`;
                }
                return 'Bank Account';
            };

            /* No client-side slice any more. `txns` holds precisely the rows
               fetched so far, so all of them are rendered; "more" now means
               another request rather than revealing rows already downloaded.
               The old model only worked because the whole ledger was in memory,
               which is the thing being removed. */
            const visibleTxns = txns;
            const hiddenCount = Math.max(0, totalTxnCount - txns.length);

            return (
                <div className="card">
                    <div className="card-header" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '0.75rem' }}>
                        <div style={{ display: 'flex', alignItems: 'baseline', gap: '0.75rem', flexWrap: 'wrap' }}>
                            <h3 style={{ margin: 0 }}>Transactions Workbench</h3>
                            {!loading && (
                                <span style={{ fontSize: '0.492rem', fontWeight: '600', color: 'var(--gray-600)', whiteSpace: 'nowrap' }}>
                                    {totalTxnCount.toLocaleString()} transaction{totalTxnCount !== 1 ? 's' : ''}
                                    {(selectedCategory || selectedAccId || selectedBankId || selectedEntityId || fromDate || toDate || globalSearch || search) ? ' (filtered)' : ''}
                                    {hiddenCount > 0 ? ` — showing first ${txns.length.toLocaleString()}` : ''}
                                </span>
                            )}
                        </div>
                        <div style={{ display: 'flex', gap: '0.75rem', alignItems: 'center', flexWrap: 'wrap' }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '0.35rem' }}>
                                <label style={{ fontSize: '0.48rem', fontWeight: 'bold', whiteSpace: 'nowrap' }}>Category:</label>
                                <select
                                    value={selectedCategory}
                                    onChange={(e) => setSelectedCategory(e.target.value)}
                                    style={{ fontSize: '0.51rem', padding: '0.35rem 0.5rem', borderRadius: '4px', minWidth: '160px' }}
                                >
                                    <option value="">All Categories ({allCategories.length})</option>
                                    {allCategories.map(c => (
                                        <option key={c} value={c}>{c}</option>
                                    ))}
                                </select>
                            </div>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '0.35rem' }}>
                                <label style={{ fontSize: '0.48rem', fontWeight: 'bold', whiteSpace: 'nowrap' }}>Show in:</label>
                                <select
                                    value={displayCcy}
                                    onChange={(e) => setDisplayCcy(e.target.value)}
                                    title="Actual shows each row in the currency it was contracted in. Any other choice converts every row at the rate for its own transaction date."
                                    style={{ fontSize: '0.51rem', padding: '0.35rem 0.5rem', borderRadius: '4px', minWidth: '150px' }}
                                >
                                    <option value="actual">Actual (as contracted)</option>
                                    {currencies.map(c => (
                                        <option key={c.code} value={c.code}>
                                            {c.code} — {c.name}
                                        </option>
                                    ))}
                                </select>
                            </div>
                            {/* Hidden in Actual mode, where it would do nothing: a
                                transaction contracted in dollars shows in dollars
                                whatever rate you pick. */}
                            {displayCcy && displayCcy !== 'actual' && (
                                <div style={{ display: 'flex', alignItems: 'center', gap: '0.35rem' }}>
                                    <label style={{ fontSize: '0.48rem', fontWeight: 'bold', whiteSpace: 'nowrap' }}>At rate:</label>
                                    <select
                                        value={rateBasis}
                                        onChange={(e) => setRateBasis(e.target.value)}
                                        title="Transaction date values each row at the rate that applied when it happened — the accounting figure. Today values everything at the current rate, which is what you want when sizing an exposure."
                                        style={{ fontSize: '0.51rem', padding: '0.35rem 0.5rem', borderRadius: '4px', minWidth: '140px' }}
                                    >
                                        <option value="txn">Transaction date</option>
                                        <option value="current">Today</option>
                                    </select>
                                </div>
                            )}
                            {(selectedCategory || selectedAccId || selectedBankId || globalSearch) && (
                                <button
                                    className="btn btn-sm"
                                    onClick={() => {
                                        setSelectedCategory('');
                                        setSelectedAccId('');
                                        if (setSelectedBankId) setSelectedBankId('');
                                    }}
                                    title="Reset filters"
                                >
                                     Reset
                                </button>
                            )}
                            <button
                                className="btn btn-sm"
                                onClick={() => setShowDeletePanel(p => !p)}
                                title="Delete transactions for a specific account"
                                style={{ background: showDeletePanel ? '#fee2e2' : '', color: showDeletePanel ? '#991b1b' : '' }}
                            >
                                Delete by Account
                            </button>
                            <button className="btn btn-sm" onClick={clearData} style={{ color: '#991b1b' }} title="Delete all transactions across all accounts">Clear All</button>
                        </div>
                    </div>

                    {/* Per-account delete panel */}
                    {showDeletePanel && (
                        <div style={{ padding: '0.85rem 1.25rem', background: '#fff5f5', borderBottom: '1px solid #fecaca', display: 'flex', alignItems: 'center', gap: '0.85rem', flexWrap: 'wrap' }}>
                            <span style={{ fontSize: '0.492rem', fontWeight: '600', color: '#7f1d1d', whiteSpace: 'nowrap' }}>Delete all transactions for:</span>
                            <select
                                value={deleteAccountId}
                                onChange={e => setDeleteAccountId(e.target.value)}
                                style={{ fontSize: '0.51rem', padding: '0.35rem 0.5rem', borderRadius: '4px', minWidth: '220px', border: '1px solid #fca5a5' }}
                            >
                                <option value="">-- Select Account --</option>
                                {bankAccounts.map(a => (
                                    <option key={a.id} value={a.id}>
                                        {a.bank_name || a.bank_code} ({a.account_number_masked})
                                    </option>
                                ))}
                            </select>
                            <button
                                className="btn btn-sm"
                                onClick={clearByAccount}
                                disabled={!deleteAccountId}
                                style={{ background: '#dc2626', color: '#fff', opacity: deleteAccountId ? 1 : 0.45, cursor: deleteAccountId ? 'pointer' : 'not-allowed' }}
                            >
                                Confirm Delete
                            </button>
                            <button className="btn btn-sm" onClick={() => { setShowDeletePanel(false); setDeleteAccountId(''); }}>Cancel</button>
                        </div>
                    )}
                    {/* Converted figures are estimates. Saying so once, above the
                        table, is cheaper than having somebody quote a converted
                        total into a filing and find out later. */}
                    {displayCcy && displayCcy !== 'actual' && txns.some(t => t.display_is_exact === false) && (
                        <div style={{ padding: '0.5rem 1.25rem', background: '#fffbeb',
                                      borderBottom: '1px solid #fde68a', fontSize: '0.46rem',
                                      color: '#78350f' }}>
                            Converted to {displayCcy} at {rateBasis === 'current'
                                ? "today's rate — this is present-day worth, not what was booked"
                                : "the stored rate for each transaction's own date"}.
                            Rows marked <span style={{ color: '#b45309', fontWeight: 700 }}>~</span> were
                            converted rather than read off the bank advice — treat them as indicative.
                            Rates are editable under the currency settings.
                        </div>
                    )}
                    <div className="card-body" style={{ padding: 0 }}>
                        <div className="table-responsive">
                            {/* txn-workbench: three tables share `.transactions-table`
                                with different column sets, so the fixed widths
                                below are pinned to this one only. */}
                            <table className="transactions-table txn-workbench">
                                <thead>
                                    <tr>
                                        <th className="date-col">Date</th>
                                        <th className="account-col">Bank Account</th>
                                        <th className="desc-col">Description</th>
                                        <th className="cat-col">Category</th>
                                        <th className="number-cell amount-col">Debit</th>
                                        <th className="number-cell amount-col">Credit</th>
                                        <th className="number-cell amount-col">Balance</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {loading ? (
                                        <tr>
                                            <td colSpan="7" style={{ textAlign: 'center', padding: '2rem', color: 'var(--gray-600)' }}>
                                                Loading transactions...
                                            </td>
                                        </tr>
                                    ) : txns.length === 0 ? (
                                        <tr>
                                            <td colSpan="7" style={{ textAlign: 'center', padding: '2rem', color: 'var(--gray-600)' }}>
                                                No transactions match the selected filters.
                                            </td>
                                        </tr>
                                    ) : (
                                        visibleTxns.map(t => {
                                            // Computed once per row rather than once per cell:
                                            // the account label was resolved twice (title and
                                            // body) and the original-amount format options
                                            // twice more, on every one of up to 10,000 rows.
                                            const accLabel = getAccountLabel(t);
                                            const origDp = t.original_currency
                                                ? ((ccyMeta[t.original_currency] || {}).decimals ?? 2)
                                                : 2;
                                            const origText = t.original_currency
                                                ? Number(t.original_amount || 0).toLocaleString('en-US', {
                                                    minimumFractionDigits: origDp,
                                                    maximumFractionDigits: origDp,
                                                })
                                                : '';
                                            const catPath = (t.category_path && t.category_path.indexOf('>') !== -1)
                                                ? t.category_path.split('>').slice(1).join(' › ').trim()
                                                : null;
                                            return (
                                            <tr key={t.id}>
                                                <td className="date-col">{t.date ? String(t.date).substring(0, 10) : '—'}</td>
                                                <td className="account-col" title={accLabel} style={{ fontSize: '0.48rem', fontWeight: '600', color: 'var(--gray-700)' }}>
                                                    {accLabel}
                                                </td>
                                                <td className="desc-col" title={t.description}>
                                                    <span>{t.description}</span>
                                                    {t.original_currency && (
                                                        <span style={{ fontSize: '0.408rem', color: 'var(--gray-600)', marginLeft: '0.35rem' }}>
                                                            ({t.original_currency} {origText}{t.fx_rate ? ` @ ${Number(t.fx_rate).toFixed(4)}` : ''})
                                                        </span>
                                                    )}
                                                </td>
                                                <td className="cat-col" title={[t.category || t.purpose || t.final_category, t.category_path, t.merchant, t.transaction_method, t.event_type].filter(Boolean).join(' | ')}>
                                                    <div style={{ display: 'inline-flex', alignItems: 'center', gap: '0.35rem', whiteSpace: 'nowrap' }}>
                                                        <span className="badge" style={{ whiteSpace: 'nowrap', flexShrink: 0 }}>
                                                            {t.category || t.purpose || t.final_category || 'Unlabelled'}
                                                        </span>
                                                        {catPath && (
                                                            <span className="txn-cat-path" style={{ margin: 0, whiteSpace: 'nowrap', flexShrink: 0 }}>
                                                                {catPath}
                                                            </span>
                                                        )}
                                                        {t.merchant && (
                                                            <span style={{ color: 'var(--gray-500)', fontSize: '0.408rem', whiteSpace: 'nowrap' }}>
                                                                ({t.merchant})
                                                            </span>
                                                        )}
                                                        {t.event_type && (
                                                            <span style={{ color: 'var(--gray-600)', fontSize: '0.408rem', whiteSpace: 'nowrap' }}>
                                                                [{t.event_type}]
                                                            </span>
                                                        )}
                                                    </div>
                                                </td>
                                                <td className="number-cell amount-col">
                                                    {cell(t, 'debit')}
                                                    {t.display_is_exact === false && (t.display_debit > 0) && (
                                                        <span title="Converted at a stored rate, not read off the advice"
                                                              style={{ color: '#b45309', marginLeft: '0.15rem' }}>~</span>
                                                    )}
                                                </td>
                                                <td className="number-cell amount-col">
                                                    {cell(t, 'credit')}
                                                    {t.display_is_exact === false && (t.display_credit > 0) && (
                                                        <span title="Converted at a stored rate, not read off the advice"
                                                              style={{ color: '#b45309', marginLeft: '0.15rem' }}>~</span>
                                                    )}
                                                </td>
                                                <td className="number-cell amount-col">{cell(t, 'balance')}</td>
                                            </tr>
                                            );
                                        })
                                    )}
                                </tbody>
                            </table>
                        </div>
                        {/* The page size is never silent: the count above is the
                            full filtered total, and every remaining row is one
                            click away. Nothing has been dropped from the result
                            set — it simply has not been asked for yet. */}
                        {!loading && hiddenCount > 0 && (
                            <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem', flexWrap: 'wrap',
                                          padding: '0.75rem 1.25rem', borderTop: '1px solid var(--gray-200)',
                                          fontSize: '0.492rem', color: 'var(--gray-700)' }}>
                                <span style={{ fontWeight: '600' }}>
                                    Showing {txns.length.toLocaleString()} of {totalTxnCount.toLocaleString()} transactions
                                </span>
                                <button
                                    className="btn btn-sm"
                                    disabled={loadingMore}
                                    onClick={() => loadMoreTxns(ROWS_PER_PAGE)}
                                    title="Fetch the next page from the server"
                                >
                                    {loadingMore ? 'Loading…'
                                        : 'Show ' + Math.min(ROWS_PER_PAGE, hiddenCount).toLocaleString() + ' more'}
                                </button>
                                <button
                                    className="btn btn-sm"
                                    disabled={loadingMore}
                                    onClick={() => loadMoreTxns(hiddenCount)}
                                    title="Fetch every remaining row. On a large result set this takes a few seconds and a lot of memory."
                                >
                                    Show all {totalTxnCount.toLocaleString()}
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        /* Module scope, not the body of EmailPickupSubTab. React compares
           component types by identity, so a component declared inside a render
           is a brand new type on every render and all seven counters were
           unmounted and remounted from scratch — during a scan, which polls, that
           was seven subtrees thrown away several times a second. Same bug as the
           dashboard's inline cards. */
        const ScanCounter = ({ label, value }) => (
            <div style={{ minWidth: '92px' }}>
                <div style={{ fontSize: '0.42rem', color: 'var(--gray-600)', textTransform: 'uppercase', letterSpacing: '0.5px' }}>{label}</div>
                <div style={{ fontSize: '0.66rem', fontWeight: 'bold', fontFamily: 'JetBrains Mono' }}>{value || 0}</div>
            </div>
        );

        function EmailPickupSubTab({ onImportComplete }) {
            // The mailbox is no longer "the Gmail account" — a user may have a
            // work Microsoft mailbox, a personal Gmail and a custom-domain IMAP
            // box, and statements arrive in whichever of them the bank was told
            // about. Everything below is therefore keyed on a *connection*.
            const [providers, setProviders] = useState([]);
            const [connections, setConnections] = useState([]);
            const [statements, setStatements] = useState([]);
            const [bankAccounts, setBankAccounts] = useState([]);
            const [selectedBankAccountId, setSelectedBankAccountId] = useState('');
            const [mappingSelection, setMappingSelection] = useState({});
            const [passwordInputs, setPasswordInputs] = useState({});
            const [loading, setLoading] = useState(false);
            const [msg, setMsg] = useState('');
            const [validationErr, setValidationErr] = useState('');
            const [providerWarning, setProviderWarning] = useState('');
            const [showImapForm, setShowImapForm] = useState(false);
            const [imapBusy, setImapBusy] = useState(false);
            const [imapErr, setImapErr] = useState('');
            const [imapForm, setImapForm] = useState({
                email_address: '',
                imap_host: '',
                imap_port: 993,
                use_ssl: true,
                imap_username: '',
                app_password: '',
                display_name: ''
            });
            // Scans run in the background on the server; these are the payloads
            // we are currently polling (one per mailbox included in the run).
            const [scans, setScans] = useState([]);

            const timersRef = useRef([]);
            const connectionsRef = useRef([]);

            const trackTimer = (id) => { timersRef.current.push(id); return id; };
            const dropTimer = (id) => {
                clearInterval(id);
                timersRef.current = timersRef.current.filter(t => t !== id);
            };

            // A component that is unmounted mid-scan must not keep hitting the API.
            useEffect(() => {
                return () => {
                    timersRef.current.forEach(clearInterval);
                    timersRef.current = [];
                };
            }, []);

            const loadEmailData = async () => {
                try {
                    const [provList, connList, accs, stmtList] = await Promise.all([
                        apiFetch('/email/providers').catch(() => []),
                        apiFetch('/email/connections').catch(() => []),
                        apiFetch('/v1/bank-master/accounts').catch(() => []),
                        apiFetch('/email/statements').catch(() => [])
                    ]);
                    setProviders(Array.isArray(provList) ? provList : []);
                    const validConns = Array.isArray(connList) ? connList : [];
                    setConnections(validConns);
                    connectionsRef.current = validConns;
                    setStatements(Array.isArray(stmtList) ? stmtList : []);

                    const validAccs = Array.isArray(accs) ? accs : [];
                    setBankAccounts(validAccs);

                    // Re-sync bank account selection if current selected account is invalid
                    setSelectedBankAccountId(prev => {
                        if (prev && validAccs.some(a => a.id === prev)) return prev;
                        return validAccs.length === 1 ? validAccs[0].id : '';
                    });
                } catch (e) {
                    console.error(e);
                }
            };

            useEffect(() => {
                loadEmailData();
            }, []);

            const getEffectiveAccountId = (stmt) => {
                if (mappingSelection[stmt.id]) return mappingSelection[stmt.id];
                if (stmt.account_id && bankAccounts.some(a => a.id === stmt.account_id)) return stmt.account_id;
                if (selectedBankAccountId) return selectedBankAccountId;
                return '';
            };

            const connectedCount = connections.filter(c => c.status === 'CONNECTED').length;
            const pendingCount = statements.filter(s => s.import_status === 'PENDING').length;
            const lastScan = connections
                .map(c => c.last_scan)
                .filter(Boolean)
                .sort()
                .slice(-1)[0] || null;
            const scanRunning = scans.some(s => s && s.status !== 'COMPLETED' && s.status !== 'FAILED');

            const providerButtonLabel = (p) => {
                if (p.key === 'gmail') return 'Connect Gmail';
                if (p.key === 'microsoft') return 'Connect Microsoft';
                if (p.key === 'imap') return 'Connect another email provider';
                return `Connect ${p.label || p.key}`;
            };

            // ---- Email-First Auto-Routing & Connecting ----------------------
            const [emailInput, setEmailInput] = useState('');
            const [routingBusy, setRoutingBusy] = useState(false);

            const handleRouteAndConnect = async (addrToConnect, existingConnectionId) => {
                const addr = (addrToConnect || emailInput || '').trim();
                if (!addr || addr.indexOf('@') === -1) {
                    setValidationErr('Please enter a valid email address.');
                    return;
                }
                setValidationErr('');
                setProviderWarning('');
                setRoutingBusy(true);
                setMsg(`Resolving mailbox provider for ${addr}...`);
                try {
                    const routeData = await apiFetch('/email/route', {
                        method: 'POST',
                        body: JSON.stringify({ email_address: addr })
                    });

                    if (routeData.auth_type === 'oauth') {
                        if (routeData.configured === false && routeData.warning) {
                            setProviderWarning(routeData.warning);
                        }
                        const label = routeData.provider_label || routeData.provider;
                        setMsg(`Opening ${label} sign-in window for ${addr}...`);

                        const width = 600;
                        const height = 700;
                        const left = Math.max(0, (window.innerWidth - width) / 2);
                        const top = Math.max(0, (window.innerHeight - height) / 2);
                        const popup = window.open(
                            routeData.authorization_url,
                            'MailboxOAuth',
                            `width=${width},height=${height},top=${top},left=${left},status=1,resizable=1`
                        );

                        const handleMessage = (event) => {
                            if (event.data && (event.data.type === 'MAILBOX_CONNECTED' || event.data.type === 'GMAIL_CONNECTED')) {
                                setMsg(`Mailbox connected: ${event.data.email}`);
                                setEmailInput('');
                                loadEmailData();
                                window.removeEventListener('message', handleMessage);
                            }
                        };
                        window.addEventListener('message', handleMessage);

                        const before = connectionsRef.current.length;
                        const interval = trackTimer(setInterval(async () => {
                            try {
                                const list = await apiFetch('/email/connections');
                                const arr = Array.isArray(list) ? list : [];
                                const reconnected = existingConnectionId
                                    ? arr.some(c => c.id === existingConnectionId && c.status === 'CONNECTED')
                                    : false;
                                if (arr.length > before || reconnected) {
                                    dropTimer(interval);
                                    window.removeEventListener('message', handleMessage);
                                    setConnections(arr);
                                    connectionsRef.current = arr;
                                    const fresh = existingConnectionId
                                        ? arr.find(c => c.id === existingConnectionId)
                                        : arr[arr.length - 1];
                                    setMsg(`Connected mailbox: ${fresh ? fresh.email_address : addr}`);
                                    setEmailInput('');
                                    loadEmailData();
                                } else if (popup && popup.closed) {
                                    dropTimer(interval);
                                    window.removeEventListener('message', handleMessage);
                                    loadEmailData();
                                }
                            } catch (e) {}
                        }, 2000));
                    } else if (routeData.auth_type === 'app_password') {
                        setShowImapForm(true);
                        setImapErr('');
                        setImapForm(prev => ({
                            ...prev,
                            email_address: addr,
                            imap_host: (routeData.imap_settings && routeData.imap_settings.imap_host) || prev.imap_host || '',
                            imap_port: (routeData.imap_settings && routeData.imap_settings.imap_port) || 993,
                            use_ssl: routeData.imap_settings ? routeData.imap_settings.use_ssl !== false : true,
                        }));
                        setMsg(`Detected IMAP mailbox for ${routeData.domain}. Enter your application-specific password to finish connecting.`);
                    }
                } catch (err) {
                    setValidationErr(`Connection error: ${err.message}`);
                    setMsg(`Connection failed: ${err.message}`);
                } finally {
                    setRoutingBusy(false);
                }
            };

            const handleReconnect = (conn) => {
                if (conn.auth_type === 'app_password' || conn.provider === 'imap') {
                    setShowImapForm(true);
                    setImapErr('');
                    setImapForm(prev => ({ ...prev, email_address: conn.email_address || '', imap_host: conn.imap_host || '' }));
                    setMsg('Re-enter the application-specific password for this mailbox to reconnect it.');
                    return;
                }
                handleRouteAndConnect(conn.email_address, conn.id);
            };

            const handleImapSuggest = async () => {
                const addr = (imapForm.email_address || '').trim();
                if (!addr || addr.indexOf('@') === -1) return;
                try {
                    const s = await apiFetch(`/email/imap/suggest?email_address=${encodeURIComponent(addr)}`);
                    if (s && s.known) {
                        setImapForm(prev => ({
                            ...prev,
                            imap_host: prev.imap_host ? prev.imap_host : (s.imap_host || ''),
                            imap_port: s.imap_port || prev.imap_port,
                            use_ssl: s.use_ssl !== false
                        }));
                    }
                } catch (e) {}
            };

            const handleConnectImap = async () => {
                setImapErr('');
                const addr = (imapForm.email_address || '').trim();
                if (!addr || !imapForm.app_password) {
                    setImapErr('Email address and application-specific password are both required.');
                    return;
                }
                setImapBusy(true);
                try {
                    const payload = {
                        email_address: addr,
                        app_password: imapForm.app_password,
                        imap_host: (imapForm.imap_host || '').trim() || null,
                        imap_port: parseInt(imapForm.imap_port, 10) || 993,
                        use_ssl: !!imapForm.use_ssl,
                        imap_username: (imapForm.imap_username || '').trim() || null,
                        mailbox: 'INBOX',
                        display_name: (imapForm.display_name || '').trim() || null
                    };
                    const res = await apiFetch('/email/connections/imap', {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    const connected = (res && res.connection && res.connection.email_address) || addr;
                    setMsg(`Mailbox connected: ${connected}`);
                    setShowImapForm(false);
                    setImapForm({
                        email_address: '', imap_host: '', imap_port: 993, use_ssl: true,
                        imap_username: '', app_password: '', display_name: ''
                    });
                    await loadEmailData();
                } catch (err) {
                    setImapErr(err.message);
                } finally {
                    setImapBusy(false);
                }
            };

            const handleDisconnect = async (conn) => {
                if (!confirm(`Disconnect ${conn.email_address}?`)) return;
                try {
                    await apiFetch(`/email/connections/${conn.id}`, { method: 'DELETE' });
                    setMsg(`Disconnected ${conn.email_address}.`);
                    setMappingSelection({});
                    await loadEmailData();
                } catch (err) {
                    setMsg(`Error: ${err.message}`);
