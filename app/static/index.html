                                        <option value="DD/MM/YYYY">DD/MM/YYYY</option>
                                        <option value="MMM DD, YYYY">MMM DD, YYYY</option>
                                        <option value="YYYY-MM-DD">YYYY-MM-DD</option>
                                    </select>
                                </div>
                                <button type="submit" className="btn btn-primary" disabled={savingPref}>
                                    {savingPref ? 'Saving...' : 'Save Preferences'}
                                </button>
                            </form>
                        </div>
                    </div>

                    {/* Add/Edit Schedule Modal */}
                    {showModal && (
                        <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 9999, padding: '1rem' }}>
                            <div style={{ background: '#fff', borderRadius: '8px', padding: '1.5rem', width: '100%', maxWidth: '520px', boxShadow: '0 10px 25px rgba(0,0,0,0.2)' }}>
                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem', borderBottom: '1px solid var(--gray-200)', paddingBottom: '0.75rem' }}>
                                    <h3 style={{ margin: 0, fontSize: '0.72rem' }}>
                                        {editingSchedule ? 'Edit Scheduled Email Report' : 'Add Scheduled Email Report'}
                                    </h3>
                                    <button
                                        style={{ background: 'none', border: 'none', fontSize: '0.84rem', cursor: 'pointer', color: 'var(--gray-500)' }}
                                        onClick={() => setShowModal(false)}
                                    >
                                        ×
                                    </button>
                                </div>

                                {formError && (
                                    <div style={{ padding: '0.65rem 0.85rem', background: '#fef2f2', color: '#b91c1c', border: '1px solid #fecaca', borderRadius: '4px', marginBottom: '1rem', fontSize: '0.51rem', fontWeight: '600' }}>
                                        {formError}
                                    </div>
                                )}

                                <form onSubmit={handleScheduleSubmit}>
                                    <div style={{ marginBottom: '1rem' }}>
                                        <label style={{ display: 'block', fontWeight: 'bold', fontSize: '0.51rem', marginBottom: '0.3rem' }}>
                                            Report Type <span style={{ color: 'red' }}>*</span>
                                        </label>
                                        <select
                                            value={formReportType}
                                            onChange={e => setFormReportType(e.target.value)}
                                            style={{ width: '100%', padding: '0.45rem', fontSize: '0.528rem', borderRadius: '4px', border: '1px solid var(--gray-300)' }}
                                        >
                                            <option value="Daily Treasury Summary">Daily Treasury Summary</option>
                                            <option value="Weekly Compliance">Weekly Compliance</option>
                                            <option value="Monthly CFO Pack">Monthly CFO Pack</option>
                                            <option value="Expense Analytics Report">Expense Analytics Report</option>
                                            <option value="Cash Flow Statement">Cash Flow Statement</option>
                                        </select>
                                    </div>

                                    <div style={{ display: 'flex', gap: '0.75rem', marginBottom: '1rem', flexWrap: 'wrap' }}>
                                        <div style={{ flex: 1, minWidth: '140px' }}>
                                            <label style={{ display: 'block', fontWeight: 'bold', fontSize: '0.51rem', marginBottom: '0.3rem' }}>
                                                Frequency <span style={{ color: 'red' }}>*</span>
                                            </label>
                                            <select
                                                value={formFrequency}
                                                onChange={e => setFormFrequency(e.target.value)}
                                                style={{ width: '100%', padding: '0.45rem', fontSize: '0.528rem', borderRadius: '4px', border: '1px solid var(--gray-300)' }}
                                            >
                                                <option value="Daily">Daily</option>
                                                <option value="Weekly">Weekly</option>
                                                <option value="Monthly">Monthly</option>
                                            </select>
                                        </div>

                                        <div style={{ flex: 1, minWidth: '140px' }}>
                                            <label style={{ display: 'block', fontWeight: 'bold', fontSize: '0.51rem', marginBottom: '0.3rem' }}>
                                                Time (24h) <span style={{ color: 'red' }}>*</span>
                                            </label>
                                            <input
                                                type="time"
                                                value={formTime}
                                                onChange={e => setFormTime(e.target.value)}
                                                required
                                                style={{ width: '100%', padding: '0.45rem', fontSize: '0.528rem', borderRadius: '4px', border: '1px solid var(--gray-300)' }}
                                            />
                                        </div>
                                    </div>

                                    {formFrequency === 'Weekly' && (
                                        <div style={{ marginBottom: '1rem' }}>
                                            <label style={{ display: 'block', fontWeight: 'bold', fontSize: '0.51rem', marginBottom: '0.3rem' }}>
                                                Day of Week <span style={{ color: 'red' }}>*</span>
                                            </label>
                                            <select
                                                value={formDayOfWeek}
                                                onChange={e => setFormDayOfWeek(e.target.value)}
                                                style={{ width: '100%', padding: '0.45rem', fontSize: '0.528rem', borderRadius: '4px', border: '1px solid var(--gray-300)' }}
                                            >
                                                {['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'].map(d => (
                                                    <option key={d} value={d}>{d}</option>
                                                ))}
                                            </select>
                                        </div>
                                    )}

                                    {formFrequency === 'Monthly' && (
                                        <div style={{ marginBottom: '1rem' }}>
                                            <label style={{ display: 'block', fontWeight: 'bold', fontSize: '0.51rem', marginBottom: '0.3rem' }}>
                                                Day of Month (1 - 31) <span style={{ color: 'red' }}>*</span>
                                            </label>
                                            <input
                                                type="number"
                                                min="1"
                                                max="31"
                                                value={formDayOfMonth}
                                                onChange={e => setFormDayOfMonth(e.target.value)}
                                                required
                                                style={{ width: '100%', padding: '0.45rem', fontSize: '0.528rem', borderRadius: '4px', border: '1px solid var(--gray-300)' }}
                                            />
                                        </div>
                                    )}

                                    <div style={{ marginBottom: '1rem' }}>
                                        <label style={{ display: 'block', fontWeight: 'bold', fontSize: '0.51rem', marginBottom: '0.3rem' }}>
                                            Recipients (comma-separated emails) <span style={{ color: 'red' }}>*</span>
                                        </label>
                                        <input
                                            type="text"
                                            placeholder="cfo@company.com, finance@company.com"
                                            value={formRecipients}
                                            onChange={e => setFormRecipients(e.target.value)}
                                            required
                                            style={{ width: '100%', padding: '0.45rem', fontSize: '0.528rem', borderRadius: '4px', border: '1px solid var(--gray-300)' }}
                                        />
                                    </div>

                                    <div style={{ marginBottom: '1.5rem', display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                                        <input
                                            type="checkbox"
                                            id="schedule-active-check"
                                            checked={formIsActive}
                                            onChange={e => setFormIsActive(e.target.checked)}
                                        />
                                        <label htmlFor="schedule-active-check" style={{ fontSize: '0.528rem', cursor: 'pointer', fontWeight: '500' }}>
                                            Active Schedule
                                        </label>
                                    </div>

                                    <div style={{ display: 'flex', gap: '0.75rem', justifyContent: 'flex-end' }}>
                                        <button type="button" className="btn" onClick={() => setShowModal(false)}>
                                            Cancel
                                        </button>
                                        <button type="submit" className="btn btn-primary" disabled={submittingSchedule}>
                                            {submittingSchedule ? 'Saving...' : editingSchedule ? 'Save Changes' : 'Create Schedule'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }


        // --- Main App Controller ---
        // =====================================================================
        // Categories — drill-down over the category tree.
        //
        // The screen shows ONE LEVEL at a time and gets each level from the
        // server, which is what lets the tree be ragged. A UI that fetched the
        // whole tree would have to decide up front how deep it goes, and this
        // tree has no such answer: `Transfers > Own Account Transfer` is two
        // levels and finished, `Food & Dining > Restaurants > Fast Food >
        // McDonald's` is four.
        //
        // The rule this component exists to honour: NEVER OFFER A CLICK THAT
        // LEADS NOWHERE. `has_children` comes from the transactions actually
        // filed under a node, per user and per filter, so a category that
        // exists in the taxonomy but holds nothing here is not rendered as
        // explorable. A row without children shows its transactions instead of
        // a chevron.
        // =====================================================================



        function FlowChip({ flow }) {
            if (!flow) return null;
            // A transfer is not income. Giving it its own mark is the whole
            // reason the field exists.
            const label = { INFLOW: 'In', OUTFLOW: 'Out', TRANSFER: 'Transfer', REVERSAL: 'Reversal' }[flow] || flow;
            const cls = flow === 'TRANSFER' || flow === 'REVERSAL' ? 'badge badge-dark' : 'badge';
            return <span className={cls}>{label}</span>;
        }

        function CategoryDrillRow({ node, onOpen }) {
            /* The filter bar above this page carries a "Show in" selector
               (Units / Thousands / Lakhs / Millions / Crores). It was rendered
               on this route but never read here, so choosing Crores rescaled
               the dashboard and left every figure on Categories in units —
               the control moved and nothing happened. */
            const { denom } = React.useContext(FilterContext);
            const amount = (node.total_debit || 0) + (node.total_credit || 0);
            const clickable = node.has_children;
            return (
                <div
                    className={'cat-row' + (clickable ? ' cat-row-open' : '')}
                    onClick={clickable ? () => onOpen(node) : undefined}
                    role={clickable ? 'button' : undefined}
                    tabIndex={clickable ? 0 : undefined}
                    onKeyDown={clickable ? (e) => { if (e.key === 'Enter') onOpen(node); } : undefined}
                >
                    <div className="cat-row-main">
                        <div className="cat-row-name">
                            {node.name}
                            {/* No chevron when there is nothing beneath. The
                                absence IS the information: this answer is
                                complete at this depth. */}
                            {clickable && <span className="cat-chevron">›</span>}
                        </div>
                        <div className="cat-bar-track">
                            <div className="cat-bar-fill" style={{ width: Math.max(1, node.share) + '%' }} />
                        </div>
                    </div>
                    <div className="cat-row-count">{node.transaction_count}</div>
                    <div className="cat-row-amount mono-num">{window.moneyScaled(amount, denom)}</div>
                    <div className="cat-row-share">{node.share.toFixed(1)}%</div>
                </div>
            );
        }

        function CategoryTransactions({ path, flowType, accountId, entityId, fromDate, toDate }) {
            // Same "Show in" selector as the rows above; the drill-down and the
            // transactions underneath it must not disagree about their scale.
            const { denom } = React.useContext(FilterContext);
            const [rows, setRows] = useState([]);
            const [total, setTotal] = useState(0);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');

            useEffect(() => {
                if (!path || !path.length) { setRows([]); setTotal(0); return; }
                let cancelled = false;
                setLoading(true);
                setError('');
                let url = '/v1/categories/transactions?limit=200&path=' + encodeURIComponent(path.join(' > '));
                if (flowType) url += '&flow_type=' + flowType;
                if (accountId) url += '&account_id=' + accountId;
                if (entityId) url += '&entity_id=' + entityId;
                if (fromDate) url += '&date_from=' + fromDate;
                if (toDate) url += '&date_to=' + toDate;
                apiFetch(url)
                    .then(d => { if (!cancelled) { setRows(d.transactions || []); setTotal(d.total || 0); } })
                    .catch(e => { if (!cancelled) setError(e.message || 'Could not load transactions'); })
                    .finally(() => { if (!cancelled) setLoading(false); });
                return () => { cancelled = true; };
            }, [path.join('>'), flowType, accountId, entityId, fromDate, toDate]);

            if (loading) return <div className="cat-empty">Loading transactions…</div>;
            if (error) return <div className="cat-empty cat-error">{error}</div>;
            if (!rows.length) return <div className="cat-empty">No transactions here.</div>;

            return (
                <div className="table-responsive">
                    <table className="transactions-table">
                        <thead>
                            <tr>
                                <th className="date-col">Date</th>
                                <th className="desc-col">Narration</th>
                                <th className="cat-col">Category</th>
                                <th>Merchant</th>
                                <th>Method</th>
                                <th>Flow</th>
                                <th className="amount-col">Debit</th>
                                <th className="amount-col">Credit</th>
                            </tr>
                        </thead>
                        <tbody>
                            {rows.map(t => (
                                <tr key={t.id}>
                                    <td className="date-col">{t.txn_date || '—'}</td>
                                    <td className="desc-col" title={t.narration}>{t.narration}</td>
                                    <td className="cat-col">
                                        {/* The path as the classifier left it. A
                                            two-level answer renders as two
                                            levels; nothing is padded to line the
                                            column up. */}
                                        <span className="cat-path">{t.category_path}</span>
                                    </td>
                                    <td>{t.merchant || t.counterparty || <span className="cat-dim">—</span>}</td>
                                    <td>{t.transaction_method || <span className="cat-dim">—</span>}</td>
                                    <td>
                                        <FlowChip flow={t.flow_type} />
                                    </td>
                                    <td className="amount-col mono-num">{t.debit ? window.moneyScaled(t.debit, denom) : '—'}</td>
                                    <td className="amount-col mono-num">{t.credit ? window.moneyScaled(t.credit, denom) : '—'}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                    {total > rows.length && (
                        <div className="cat-empty">Showing {rows.length} of {total}.</div>
                    )}
                </div>
            );
        }

        // Where a transaction goes when the narration names no purpose. Each is
        // a fact about the row rather than a guess about it, which is why the
        // old `Other / Uncategorized` node could be deleted outright instead of
        // renamed. Kept in one place so the notice below and any future report
        // agree on what counts as "still needs a person".
        const RESIDUAL_BRANCHES = [
            'Transfers > External Transfer',
            'Transfers > Person to Person',
            'Business & Professional > Vendor / Business Transaction',
            'Cash > Other Cash Transaction',
        ];

        function CategoriesView({ navigate }) {
            /* selectedEntityId included deliberately. The filter bar above this
                page shows an Entity selector, and until it was read here choosing
                one did nothing at all — the figures stayed scoped to the whole
                ledger while the control said otherwise. */
            const { selectedEntityId, selectedBankId, fromDate, toDate } = React.useContext(FilterContext);
            const [path, setPath] = useState([]);
            const [node, setNode] = useState(null);
            const [summary, setSummary] = useState(null);
            const [flowType, setFlowType] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [showTxns, setShowTxns] = useState(false);

            /* One effect, not two racing ones. The drill-down and the summary
               strip were fetched by separate effects that resolved whenever they
               resolved, so the page assembled itself in two paints on every
               visit — and in whichever order the server happened to answer. They
               are requested together and applied in one tick now.

               The summary keeps its own URL guard because its inputs are a subset
               of the drill-down's: walking down a category path or switching flow
               type must not re-request it, and under the two separate effects it
               did not. allSettled so a failing drill-down still leaves the summary
               strip, and vice versa, exactly as independent effects did. */
            const summaryUrlRef = useRef(null);

            useEffect(() => {
                const p = path;
                setLoading(true);
                setError('');

                let dUrl = '/v1/categories/drilldown?';
                if (p.length) dUrl += 'path=' + encodeURIComponent(p.join(' > ')) + '&';
                if (flowType) dUrl += 'flow_type=' + flowType + '&';
                if (selectedBankId) dUrl += 'account_id=' + selectedBankId + '&';
                if (selectedEntityId) dUrl += 'entity_id=' + selectedEntityId + '&';
                if (fromDate) dUrl += 'date_from=' + fromDate + '&';
                if (toDate) dUrl += 'date_to=' + toDate + '&';

                let sUrl = '/v1/categories/summary?';
                if (selectedBankId) sUrl += 'account_id=' + selectedBankId + '&';
                if (selectedEntityId) sUrl += 'entity_id=' + selectedEntityId + '&';
                if (fromDate) sUrl += 'date_from=' + fromDate + '&';
                if (toDate) sUrl += 'date_to=' + toDate + '&';
                const needSummary = sUrl !== summaryUrlRef.current;
                summaryUrlRef.current = sUrl;

                Promise.allSettled([
                    apiFetch(dUrl),
                    needSummary ? apiFetch(sUrl) : Promise.resolve(null)
                ]).then(([drill, sum]) => {
                    if (drill.status === 'fulfilled') {
                        setNode(drill.value);
                        // Open the transaction list automatically where there is
                        // nothing further to explore — that IS the bottom of the
                        // drill-down, and making the user click once more to see
                        // it would be a click with one possible outcome.
                        setShowTxns(p.length > 0
                            && (!drill.value.children || drill.value.children.length === 0));
                    } else {
                        setError((drill.reason && drill.reason.message) || 'Could not load categories');
                    }
                    if (needSummary) {
                        setSummary(sum.status === 'fulfilled' ? sum.value : null);
                    }
                    setLoading(false);
                });
            }, [path.join('>'), flowType, selectedBankId, selectedEntityId, fromDate, toDate]);

            const open = (child) => setPath(child.path);
            const goTo = (depth) => setPath(path.slice(0, depth));

            const children = (node && node.children) || [];
            const depthDist = (summary && summary.depth_distribution) || {};
            const depthKeys = Object.keys(depthDist).sort();

            return (
                <div>
                    <div className="card">
                        <div className="card-header">
                            <h3>Categories</h3>
                            <div className="flex gap-1 flex-center">
                                {['', 'INFLOW', 'OUTFLOW', 'TRANSFER', 'REVERSAL'].map(f => (
                                    <button
                                        key={f || 'all'}
                                        className={'btn btn-sm' + (flowType === f ? ' btn-primary' : '')}
                                        onClick={() => setFlowType(f)}
                                    >
                                        {f === '' ? 'All' : f.charAt(0) + f.slice(1).toLowerCase()}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {summary && (
                            <div className="kpi-strip">
                                <div className="kpi">
                                    <div className="kpi-label">Transactions</div>
                                    <div className="kpi-value">{summary.transactions}</div>
                                </div>
                                {/* There is no "Other / Uncategorized" bucket
                                    any more, so "N with no category" would now
                                    read 0 on every statement and mean nothing.
                                    The honest number is how many rows are filed
                                    only by HOW the money moved — the rail and
                                    the direction — with nothing saying what it
                                    was for. That is the work that is left. */}
                                <div className="kpi">
                                    <div className="kpi-label">Purpose known</div>
                                    <div className="kpi-value">{summary.categorised}</div>
                                    <div className="kpi-sub">
                                        {summary.unclear || 0} filed by payment type only
                                    </div>
                                </div>
                                {/* Decisions, not rows. "220 transactions
                                    uncategorised" is a symptom; the work is one
                                    answer per counterparty, and 220 rows behind
                                    12 parties is a different afternoon from 220
                                    rows behind 180. This is the number that
                                    tells you which one you are in for. */}
                                <div className="kpi">
                                    <div className="kpi-label">Decisions left</div>
                                    <div className={'kpi-value' + (summary.decisions_outstanding > 0 ? ' is-warn' : ' is-good')}>
                                        {summary.decisions_outstanding !== undefined
                                            ? summary.decisions_outstanding : '—'}
                                    </div>
                                    <div className="kpi-sub">
                                        {summary.decisions_outstanding
                                            ? 'counterparties awaiting one answer each'
                                            : 'nothing waiting on you'}
                                    </div>
                                </div>
                                <div className="kpi">
                                    {/* How deep the answers actually go. All of it
                                        sitting at one level would mean the hierarchy
                                        is not earning its keep on this data, and
                                        that is worth being able to see. */}
                                    <div className="kpi-label">Depth of detail</div>
                                    <div className="kpi-value">
                                        {depthKeys.length ? depthKeys[depthKeys.length - 1] : '—'}
                                        <span style={{ fontSize: '0.5rem', fontWeight: 400 }}> levels deep</span>
                                    </div>
                                    <div className="kpi-sub">
                                        {depthKeys.length
                                            ? depthKeys.map(k => `${k}: ${depthDist[k]}`).join(' · ')
                                            : 'no depth data'}
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className="card-body">
                            {/* Where the unfiled rows went. An empty branch with
                                no explanation reads as a bug; naming the screen
                                that handles them, and what a decision there is
                                worth, turns it into a next step. */}
                            {summary && (summary.unclear || 0) > 0 && (
                                <div className="cat-notice">
                                    <div>
                                        <strong>{summary.unclear}</strong> transaction
                                        {summary.unclear === 1 ? ' is' : 's are'} filed by how the money
                                        moved — the payment type and the direction — because nothing in
                                        the narration says what {summary.unclear === 1 ? 'it was' : 'they were'} for
                                        {summary.decisions_outstanding
                                            ? <React.Fragment>. They collapse to <strong>
                                                {summary.decisions_outstanding}</strong> counterpart
                                                {summary.decisions_outstanding === 1 ? 'y' : 'ies'} to decide
                                              </React.Fragment>
                                            : ''}.
                                        {summary.unclear === 1 ? ' It is' : ' They are'} waiting in
                                        the <strong>Review Queue</strong> — one decision there files every
                                        row for that party, now and on every statement you upload afterwards.
                                    </div>
                                    <button className="btn btn-sm btn-primary"
                                            onClick={() => navigate && navigate('/review-queue')}>
                                        Open Review Queue
                                    </button>
                                </div>
                            )}

                            <div className="cat-crumbs">
                                <a href="#" onClick={(e) => { e.preventDefault(); goTo(0); }}
                                   className={path.length ? '' : 'cat-crumb-current'}>All Transactions</a>
                                {path.map((part, i) => (
                                    <React.Fragment key={i}>
                                        <span className="cat-crumb-sep">›</span>
                                        <a href="#"
                                           onClick={(e) => { e.preventDefault(); goTo(i + 1); }}
                                           className={i === path.length - 1 ? 'cat-crumb-current' : ''}>
                                            {part}
                                        </a>
                                    </React.Fragment>
                                ))}
                            </div>

                            {error && <div className="cat-empty cat-error">{error}</div>}
                            {loading && <div className="cat-empty">Loading…</div>}

                            {!loading && !error && (
                                <React.Fragment>
                                    {children.length > 0 && (
                                        <div className="cat-list">
                                            <div className="cat-row cat-head">
                                                <div className="cat-row-main">Category</div>
                                                <div className="cat-row-count">Txns</div>
                                                <div className="cat-row-amount">Amount</div>
                                                <div className="cat-row-share">Share</div>
                                            </div>
                                            {children.map(c => (
                                                <CategoryDrillRow key={c.slug} node={c} onOpen={open} />
                                            ))}
                                        </div>
                                    )}

                                    {children.length === 0 && node && node.transaction_count === 0 && (
                                        <div className="cat-empty">
                                            Nothing here yet. Upload a statement, or run
                                            “Re-categorize existing” from the Review Queue to
                                            place transactions you already have.
                                        </div>
                                    )}

                                    {/* The branches a row lands in when the
                                        narration names no purpose. There is no
                                        "Other / Uncategorized" any more — these
                                        are true statements about the row (money
                                        moved to a party, a card was presented)
                                        and they total correctly — but they are
                                        also where the remaining human work is,
                                        so say so at the point the user is
                                        looking at them. */}
                                    {RESIDUAL_BRANCHES.indexOf(path.join(' > ')) !== -1
                                        && node && node.transaction_count > 0 && (
                                        <div className="cat-notice">
                                            <div>
                                                These are filed by what the statement states — how the
                                                money moved — because nothing in their narrations says
                                                what it was for. That is as far as the rules can go
                                                honestly. The Review Queue groups them by counterparty
                                                so you answer once per party, not once per transaction,
                                                and every answer sticks for future statements.
                                            </div>
                                            <button className="btn btn-sm btn-primary"
                                                    onClick={() => navigate && navigate('/review-queue')}>
                                                Decide them
                                            </button>
                                        </div>
                                    )}

                                    {path.length > 0 && node && node.transaction_count > 0 && (
                                        <div className="mt-2">
                                            {children.length > 0 && (
                                                <button className="btn btn-sm" onClick={() => setShowTxns(!showTxns)}>
                                                    {showTxns ? 'Hide' : 'Show'} the {node.transaction_count} transaction
                                                    {node.transaction_count === 1 ? '' : 's'} under {path[path.length - 1]}
                                                </button>
                                            )}
                                            {showTxns && (
                                                <div className="mt-1">
                                                    <CategoryTransactions
                                                        path={path}
                                                        flowType={flowType}
                                                        accountId={selectedBankId}
                                                        entityId={selectedEntityId}
                                                        fromDate={fromDate}
                                                        toDate={toDate}
                                                    />
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </React.Fragment>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [currentPath, setCurrentPath] = useState(window.location.pathname || '/home');
            const [userEmail, setUserEmail] = useState('');

            const navigate = (path) => {
                window.history.pushState({}, '', path);
                setCurrentPath(path);
            };

            useEffect(() => {
                const handlePopState = () => {
                    setCurrentPath(window.location.pathname);
                };
                window.addEventListener('popstate', handlePopState);
                return () => window.removeEventListener('popstate', handlePopState);
            }, []);

            /* Type scale follows the route, in three states rather than two.
               The public pages keep their original sizing — they were never the
               screens that were too small to read, and scaling them up broke a
               layout that had been designed around its type. */
            useEffect(() => {
                /* Kept in step with the identical list in the <head> script,
                   which sets the scale before first paint. */
                const UNSCALED = ['/', '/home', '/pricing', '/contact', '/login',
                                  '/reports', '/ingestion', '/reconciliation'];
                const unscaled = UNSCALED.includes(currentPath);
                const isDashboard = currentPath === '/dashboard' || currentPath === '/dashboard-ui';
                [document.documentElement, document.body].forEach(el => {
                    el.classList.toggle('app-dashboard', !unscaled && isDashboard);
                    el.classList.toggle('app-inner', !unscaled && !isDashboard);
                    el.classList.remove('route-scaled');   // the old two-state class
                });
            }, [currentPath]);

            // Public Marketing Pages
            if (currentPath === '/' || currentPath === '/home') {
                return <HomePage navigate={navigate} />;
            }
            if (currentPath === '/pricing') {
                return <PricingPage navigate={navigate} />;
            }
            if (currentPath === '/contact') {
                return <ContactPage navigate={navigate} />;
            }
            if (currentPath === '/login') {
                return <LoginPage navigate={navigate} onLoginSuccess={(email) => setUserEmail(email)} />;
            }

            // Internal App Pages
            return (
                <AppShell currentPath={currentPath} navigate={navigate} userEmail={userEmail}>
                    {currentPath === '/dashboard' || currentPath === '/dashboard-ui' ? (
                        <DashboardView navigate={navigate} />
                    ) : currentPath === '/transactions' ? (
                        <TransactionsView />
                    ) : currentPath === '/categories' ? (
                        <CategoriesView navigate={navigate} />
                    ) : currentPath === '/ingestion' ? (
                        <IngestionView navigate={navigate} />
                    ) : currentPath === '/reconciliation' ? (
                        <ReconciliationView />
                    ) : currentPath === '/review-queue' ? (
                        <ReviewQueueView />
                    ) : currentPath === '/reports' ? (
                        <ReportsView />
                    ) : currentPath === '/settings' ? (
                        <SettingsView />
                    ) : currentPath === '/bank-master' ? (
                        <BankMasterView />
                    ) : (
                        <DashboardView navigate={navigate} />
                    )}
                </AppShell>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        /* The sentinel boot.js looks for. It is the last statement in the block
           on purpose: if a cached bundle is truncated or corrupt, execution
           never reaches here, boot.js sees the flag missing, throws the cache
           away and recompiles from source. */
        window.__KREDO_BOOTED__ = true;
    </script>

    <!-- After the source block, so the element it reads already exists. -->
    <script src="/static/boot.js?v=20260826a"></script>
</body>
