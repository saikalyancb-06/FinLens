    <!-- Cache-busted: index.html is served no-cache (main.py) but /static is a
         plain StaticFiles mount, so without a version marker the browser keeps
         serving the previous stylesheet and the new layout renders unstyled.
         Bump this value whenever styles.css changes. -->
    <link rel="stylesheet" href="/static/styles.css?v=20260910b">
    
    <!-- Utilities & Libraries (Served locally) -->
    <!-- format.js carries the same cache trap as styles.css: it is served by a
         plain StaticFiles mount, so a browser that has the old copy keeps using
         it and any function added here is simply undefined at runtime. Bump this
         value whenever format.js changes. -->
    <script src="/static/format.js?v=20260827a"></script>
    <script src="/static/chart.umd.min.js"></script>
    <script src="/static/react.production.min.js"></script>
    <script src="/static/react-dom.production.min.js"></script>
    <!-- babel.min.js is deliberately NOT loaded here. It is 2.8 MB to fetch,
         parse and evaluate, and it is only needed the first time a given
         build of this page is opened. boot.js loads it on demand, on a cache
         miss only; every load after that skips it entirely. -->
    <script>
        /* Sets the type scale before first paint, so a signed-in page does not
           flash at the public size and reflow. React re-applies the same rule
           on every navigation; this only has to get the FIRST paint right.

           Public routes are listed explicitly and anything unknown is treated
           as application: a mis-scaled marketing page is a cosmetic bug, but a
           mis-scaled app page is one the user has been complaining about. */
        (function() {
            var p = window.location.pathname || '/home';
            /* Pages that keep their original sizing. The marketing site, plus
               three application pages whose layouts were built around the type
               they had and read worse at the larger scale. */
            var UNSCALED = ['/', '/home', '/pricing', '/contact', '/login',
                            '/reports', '/ingestion', '/reconciliation'];
            if (UNSCALED.indexOf(p) !== -1) return;        // unclassed = original scale
            var isDash = p === '/dashboard' || p === '/dashboard-ui';
            document.documentElement.classList.add(isDash ? 'app-dashboard' : 'app-inner');
            document.addEventListener('DOMContentLoaded', function () {
                document.body.classList.add(isDash ? 'app-dashboard' : 'app-inner');
            });
        })();
    </script>
</head>

    <!-- type is NOT text/babel: that would make Babel standalone compile this
         block itself on DOMContentLoaded, which is exactly the ~2.5 s we are
         removing. boot.js reads the text out of here, compiles it once and
         caches the result. An unknown script type is inert, so the browser

    <script type="text/kredo-jsx" id="app-source">

        // --- API Helper ---
        async function apiFetch(endpoint, options = {}) {
            const token = localStorage.getItem('access_token');
            const headers = {
                'Content-Type': 'application/json',
                ...(token ? { 'Authorization': `Bearer ${token}` } : {}),
                ...(options.headers || {})
            };
            const res = await fetch(endpoint, { ...options, headers });
            if (!res.ok) {
                const errData = await res.json().catch(() => ({}));
                throw new Error(errData.detail || `Request failed with status ${res.status}`);
            }
            if (res.status === 204) return null;
            const text = await res.text();
            return text ? JSON.parse(text) : null;
        }

        /* Same request, but hands back the response headers too.
           /transactions reports the size of the full filtered result set in
           X-Total-Count, which is what lets the table page through the data
           instead of downloading all of it to find out how much there is. */
        async function apiFetchWithHeaders(endpoint, options = {}) {
            const token = localStorage.getItem('access_token');
            const headers = {
                'Content-Type': 'application/json',
                ...(token ? { 'Authorization': `Bearer ${token}` } : {}),
                ...(options.headers || {})
            };
            const res = await fetch(endpoint, { ...options, headers });
            if (!res.ok) {
                const errData = await res.json().catch(() => ({}));
                throw new Error(errData.detail || `Request failed with status ${res.status}`);
            }
            const text = res.status === 204 ? '' : await res.text();
            return { data: text ? JSON.parse(text) : null, headers: res.headers };
        }

        // "2025-04-01" is a machine's way of writing a date. A report header is
        // read by a person deciding whether the figures below cover the period
        // they meant, so it gets the human form.
        function fmtDay(iso) {
            if (!iso) return '';
            const d = new Date(String(iso).substring(0, 10) + 'T00:00:00');
            if (isNaN(d.getTime())) return String(iso);
            return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        async function apiDownload(endpoint, defaultFilename = 'download') {
            const token = localStorage.getItem('access_token');
            const headers = {
                ...(token ? { 'Authorization': `Bearer ${token}` } : {})
            };
            const res = await fetch(endpoint, { headers });
            if (!res.ok) {
                const errData = await res.json().catch(() => ({}));
                throw new Error(errData.detail || `Download failed with status ${res.status}`);
            }
            const blob = await res.blob();
            let filename = defaultFilename;
            const disposition = res.headers.get('Content-Disposition') || res.headers.get('content-disposition');
            if (disposition && disposition.includes('filename=')) {
                const match = disposition.match(/filename=["']?([^"';]+)["']?/);
                if (match && match[1]) filename = match[1].trim();
            }
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        }

        function LoginPage({ navigate, onLoginSuccess }) {

                setMode(m);
                setError('');
                setSuccessMsg('');
                setEmail('');
                setPassword('');
                setFullName('');
                setConfirmPassword('');
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError('');
                try {
                    const data = await apiFetch('/auth/login', {
                        method: 'POST',
                        body: JSON.stringify({ email, password })
                    });
                    localStorage.setItem('access_token', data.access_token);
                    onLoginSuccess(email);
                    navigate('/dashboard');
                } catch (err) {
                    setError(err.message || 'Login failed');
                } finally {
                    setLoading(false);
                }
            };

                setError('');

                    setError('Passwords do not match');
                    return;

                    return;

        // --- Main App Shell Layout ---
        function AppLayout({ children, currentPath, navigate, userEmail }) {
            const [entities, setEntities] = useState([]);
            const [accounts, setAccounts] = useState([]);
            const [selectedEntityId, setSelectedEntityId] = useState('');
            const [selectedBankId, setSelectedBankId] = useState('');
            const [fromDate, setFromDate] = useState('');
            const [toDate, setToDate] = useState('');
            const [globalSearch, setGlobalSearch] = useState('');
            // Display scale, shared rather than page-local: it belongs in the
            // filter bar beside the other scoping controls, and that bar lives
            // here in the layout, not inside any one page.
            const [denom, setDenomState] = useState(() => {
                try { return localStorage.getItem('kredo_denom') || 'units'; }
                catch (e) { return 'units'; }
            });
            // useCallback, not a plain closure: this setter goes into the filter
            // context value, and a fresh function identity on every render would
            // by itself invalidate the memo that value now depends on.
            const setDenom = React.useCallback((v) => {
                setDenomState(v);
                try { localStorage.setItem('kredo_denom', v); } catch (e) {}
            }, []);

            /* One settlement point rather than two loose .then chains. The two
               requests always went out together, but they landed in separate
               microtasks, so the topbar filled its Entity dropdown on one paint
               and its Bank Account dropdown on the next — the filter bar visibly
               assembled itself in two steps on every load. The per-request catch
               is kept so a failing entities call still lets accounts populate. */
            const loadBankMasterData = () => {
                Promise.all([
                    apiFetch('/v1/bank-master/entities').catch(() => null),
                    apiFetch('/v1/bank-master/accounts').catch(() => null)
                ]).then(([entData, accData]) => {
                    if (Array.isArray(entData)) setEntities(entData);
                    if (Array.isArray(accData)) setAccounts(accData);
                });
            };

            useEffect(() => {
                loadBankMasterData();
                const handleMasterUpdate = () => loadBankMasterData();
                window.addEventListener('bank_master_updated', handleMasterUpdate);
                window.addEventListener('transactions_updated', handleMasterUpdate);
                return () => {
                    window.removeEventListener('bank_master_updated', handleMasterUpdate);
                    window.removeEventListener('transactions_updated', handleMasterUpdate);
                };
            }, []);

            // When entity changes, filter available accounts and clear selected bank if it no longer belongs
            const handleEntityChange = (entityId) => {
                setSelectedEntityId(entityId);
                if (entityId) {
                    const belongsToEntity = accounts.some(a => a.id === selectedBankId && a.entity_id === entityId);
                    if (!belongsToEntity) setSelectedBankId('');
                }
            };

            // Accounts visible in the Bank Account dropdown — restricted to selected entity when one is active
            const filteredAccounts = selectedEntityId
                ? accounts.filter(a => a.entity_id === selectedEntityId)
                : accounts;

            // Derived Normalized Filter Scope Counts (Master Data Scope)
            let scopeEntitiesCount = entities.length;
            let scopeAccountsCount = accounts.length;

            if (selectedBankId) {
                scopeAccountsCount = 1;
                const matchedAcc = accounts.find(a => a.id === selectedBankId);
                scopeEntitiesCount = (matchedAcc && matchedAcc.entity_id) ? 1 : (selectedEntityId ? 1 : 1);
            } else if (selectedEntityId) {
                scopeEntitiesCount = 1;
                scopeAccountsCount = accounts.filter(a => a.entity_id === selectedEntityId).length;
            }

            const getPluralScopeSubtitle = (eCnt, aCnt) => {
                const eText = `${eCnt} ${eCnt === 1 ? 'entity' : 'entities'}`;
                const aText = `${aCnt} ${aCnt === 1 ? 'account' : 'accounts'}`;
                return `Across ${eText}, ${aText}`;
            };

            const scopeSubtitle = getPluralScopeSubtitle(scopeEntitiesCount, scopeAccountsCount);

            /* This was an object literal in the JSX below, so it had a new
               identity on every AppLayout render — typing one character into the
               global search box re-rendered every context consumer on the page,
               including the 10,000-row transactions table, whether or not the
               field it reads had changed. Every field is in the dep list on
               purpose: omitting one makes that filter silently stop propagating
               to consumers, which is a far worse bug than the one being fixed. */
            const filterValue = React.useMemo(() => ({
                selectedEntityId,
                selectedBankId,
                fromDate,
                toDate,
                globalSearch,
                entities,
                accounts,
                scopeEntitiesCount,
                scopeAccountsCount,
                scopeSubtitle,
                setSelectedBankId,
                setSelectedEntityId,
                setFromDate,
                setToDate,
                setGlobalSearch,
                denom,
                setDenom
            }), [
                selectedEntityId, selectedBankId, fromDate, toDate, globalSearch,
                entities, accounts, scopeEntitiesCount, scopeAccountsCount,
                scopeSubtitle, setSelectedBankId, setSelectedEntityId, setFromDate,
                setToDate, setGlobalSearch, denom, setDenom
            ]);

            const navItems = [
                { path: '/dashboard', label: 'Dashboard' },
                { path: '/transactions', label: 'Transactions' },
                { path: '/categories', label: 'Categories' },
                { path: '/ingestion', label: 'Statement Ingestion' },
                { path: '/reconciliation', label: 'Reconciliation' },
                { path: '/review-queue', label: 'Review Queue' },
                { path: '/reports', label: 'Reports & CFO Pack' },
                { path: '/settings', label: 'Settings' },
                { path: '/bank-master', label: 'Bank Master' }
            ];

            return (
                <FilterContext.Provider value={filterValue}>
                    <div className="app-container">
                        <aside className="sidebar">
                            <div className="sidebar-header">
                                <span style={{ background: '#fff', color: '#000', padding: '2px 6px', fontSize: '7.2px', fontWeight: 'bold' }}>TL</span>
                                Treasury Lens
                            </div>
                            <nav className="sidebar-nav">
                                {navItems.map((item) => (
                                    <a
                                        key={item.path}
                                        href={item.path}
                                        className={currentPath === item.path ? 'active' : ''}
                                        onClick={(e) => { 
                                             e.preventDefault(); 
                                             navigate(item.path); 
                                        }}
                                    >
                                        {item.label}
                                    </a>
                                ))}
                            </nav>
                            <div className="sidebar-footer">
                                <div>{userEmail || 'Not signed in'}</div>
                                <button
                                    onClick={() => { localStorage.removeItem('access_token'); navigate('/login'); }}
                                >
                                    Sign Out
                                </button>
                            </div>
                        </aside>
                        <main className="main-content">
                            {/* Not on /reports: that page carries its own Report Period selector and
                                explicit dates, so this bar became a second, competing set of
                                filters quietly narrowing figures from outside the card the
                                reader was looking at. Dashboard and Transactions still scope
                                themselves from here. */}
                            {(currentPath === '/transactions' || currentPath === '/categories' || currentPath === '/dashboard' || currentPath === '/dashboard-ui') && (
                                <div className="topbar">
                                    <div className="topbar-group">
                                        <label>Entity:</label>
                                        <select value={selectedEntityId} onChange={e => handleEntityChange(e.target.value)}>
                                            <option value="">All Entities ({entities.length})</option>
                                            {entities.map(ent => <option key={ent.id} value={ent.id}>{ent.name}</option>)}
                                        </select>
                                    </div>
                                    <div className="topbar-group">
                                        <label>Bank Account:</label>
                                        <select value={selectedBankId} onChange={e => setSelectedBankId(e.target.value)}>
                                            <option value="">{selectedEntityId ? `All Bank Accounts (${filteredAccounts.length})` : `All Bank Accounts (${accounts.length})`}</option>
                                            {filteredAccounts.map(acc => (
                                                <option key={acc.id} value={acc.id}>
                                                    {acc.bank_name || acc.bank_code} ({acc.account_number_masked})
                                                </option>
                                            ))}
                                        </select>
                                    </div>
                                    <div className="topbar-group">
                                        <label>From:</label>
                                        <input type="date" value={fromDate} onChange={e => setFromDate(e.target.value)} />
                                    </div>
                                    <div className="topbar-group">
                                        <label>To:</label>
                                        <input type="date" value={toDate} onChange={e => setToDate(e.target.value)} />
                                    </div>
                                    <div className="topbar-group">
                                        <label>Show in:</label>
                                        <select value={denom} onChange={e => setDenom(e.target.value)}
                                                title="Rescales every amount on the page. The underlying figures do not change.">
                                            {Object.entries(window.DENOMINATIONS).map(([k, d]) => (
                                                <option key={k} value={k}>{d.label}{d.suffix ? ` (${d.suffix})` : ''}</option>
                                            ))}
                                        </select>
                                    </div>
                                    {(selectedEntityId || selectedBankId || fromDate || toDate) && (
                                        <button
                                            className="btn btn-sm"
                                            onClick={() => {
                                                setSelectedEntityId('');
                                                setSelectedBankId('');
                                                setFromDate('');
                                                setToDate('');
                                                setGlobalSearch('');
                                            }}
                                            title="Clear all filters"
                                        >
                                             Reset
                                        </button>
                                    )}
                                </div>
                            )}
                            <div className="content">
                                {children}
                            </div>
                        </main>
                    </div>
                </FilterContext.Provider>
            );
        }

        const AppShell = AppLayout;

        /* Currency metadata is per-deployment, not per-view: the symbol and
           decimal count for INR do not change while someone is using the app.
           Holding it here means every mount after the first starts with it
           already populated, which is what stops the charts being rebuilt when
           a late response changes the formatter identity. */
        const CCY_META_CACHE = { map: {}, loaded: false };

        /* ===================================================================
           Treasury dashboard presentation components
           ===================================================================
           Declared at module scope, NOT inside DashboardView. A component
           defined inside a render body is a NEW function on every render, and
           React compares component types by identity — so it unmounts the old
           subtree and mounts a fresh one each time. Every <canvas> inside would
           be replaced, leaving the Chart.js instances bound to detached nodes
           and all seven charts blank. Opening the rules panel was enough to do
           it: none of the chart effects depend on that state, so nothing
           re-bound them afterwards.
           =================================================================== */

        /* A panel with nothing in it says why, and where the reader can go to
           change that. An empty chart with labelled axes reads as "the answer
           is zero", which is a different and usually wrong claim. */
        const Empty = ({ title, detail, action, onAction }) => (
            <div className="panel-empty">
                <div className="panel-empty-title">{title}</div>
                {detail && <div className="panel-empty-detail">{detail}</div>}
                {action && (
                    <button className="btn btn-sm" style={{ marginTop: '0.5rem' }}
                            onClick={onAction}>{action}</button>
                )}
            </div>
        );

        const Panel = ({ title, note, controls, children, className }) => (
            <section className={'tp' + (className ? ' ' + className : '')}>
                <header className="tp-head">
                    <div className="tp-titles">
                        <h4>{title}</h4>
                        {note && <span className="tp-note">{note}</span>}
                    </div>
                    {controls && <div className="tp-controls">{controls}</div>}
                </header>
                <div className="tp-body">{children}</div>
            </section>
        );

        const Seg = ({ value, options, onChange }) => (
            <div className="seg">
                {options.map(o => (
                    <button key={o.v}
                            className={'seg-btn' + (value === o.v ? ' is-on' : '')}
                            onClick={() => onChange(o.v)}>{o.label}</button>
                ))}
            </div>
        );

        /* The narrow-viewport stand-in for a ranked bar chart. Deliberately
           plain: a name, its figure, a proportional rule and one line of
           supporting detail. Nothing is truncated. The formatters arrive as
           props because they close over the page's currency and denomination,
           which this component has no business knowing about. */
        const RankedList = ({ rows, dmc, dmx }) => {
            const max = Math.max(...rows.map(r => Math.abs(r.value)), 1);
            return (
                <ol className="rank-list">
                    {rows.map((r, i) => (
                        <li className="rank-item" key={i}>
                            <div className="rank-top">
                                <span className="rank-name">{r.label}</span>
                                <span className="rank-val" title={dmx(r.value)}>{dmc(r.value)}</span>
                            </div>
                            <div className="rank-bar">
                                <span style={{ width: Math.max(1, (Math.abs(r.value) / max) * 100) + '%',
                                               background: r.tone || '#4d4d4d' }}></span>
                            </div>
                            {r.meta && <div className="rank-meta">{r.meta}</div>}
                        </li>
                    ))}
                </ol>
            );
        };

        // --- Dashboard View Component ---
        function DashboardView({ navigate }) {
            const {
                selectedEntityId,
                selectedBankId,
                fromDate,
                toDate,
                globalSearch,
                scopeEntitiesCount,
                scopeAccountsCount,
                scopeSubtitle,
                denom,
                accounts: contextAccounts
            } = React.useContext(FilterContext);

            const [summary, setSummary] = useState(null);
            const [cashFlow, setCashFlow] = useState([]);
            const [ageing, setAgeing] = useState(null);

            /* Treasury sources. `treasury` is /reports/treasury — the same
               report the Reports page renders, which is where the 30/60/90
               forecast engine and the opening-to-closing bridge already live;
               reusing it means the dashboard and the report cannot disagree.
               `cashPosition` is the balance curve, `backtest` the measured
               accuracy of that forecast. */
            const [treasury, setTreasury] = useState(null);
            const [cashPosition, setCashPosition] = useState(null);
            const [backtest, setBacktest] = useState(null);
            const [ccyMeta, setCcyMeta] = useState(CCY_META_CACHE.map);
            const [health, setHealth] = useState(null);

            /* Presentation state. Grain follows the selected range by default
               rather than being pinned to 'daily', which is what put several
               hundred transaction-level points on one axis. */
            const [flowGrain, setFlowGrain] = useState('auto');
            const [movementView, setMovementView] = useState('drivers');
            // Display scale comes from the filter bar, so the control sits with
            // the other scoping inputs instead of in a strip of its own.
            // Presentation only — nothing is recomputed, and the unit is always
            // printed beside the number, because "12.45" means nothing alone.
            // Every rupee figure on the dashboard goes through `dm` rather than
            // window.moneyShort, so one dropdown moves all of them together.
            const dm = React.useCallback(
                (v, opts) => window.moneyScaled(v, denom, opts), [denom]);
            /* The dashboard no longer holds transaction ROWS. It used to fetch
               /transactions?limit=10000 — 3.6 MB, ~21 s, and while it serialised it
               starved every other request on the page — purely to derive seventeen
               bars in the browser. Both derivations now happen server-side and
               arrive as a couple of kilobytes each. */
            const [outflowMixData, setOutflowMixData] = useState(null);
            const [counterpartyData, setCounterpartyData] = useState(null);
            const [loading, setLoading] = useState(true);

            /* One canvas and one Chart instance per panel. Chart.js keeps a
               canvas registry, so an instance must be destroyed before another
               binds to the same node or the second render throws "Canvas is
               already in use" — every effect below tears its own chart down
               first and again on unmount. */
            const liquidityRef = useRef(null);   const liquidityInst = useRef(null);
            const flowRef      = useRef(null);   const flowInst      = useRef(null);
            const movementRef  = useRef(null);   const movementInst  = useRef(null);
            const outflowRef   = useRef(null);   const outflowInst   = useRef(null);
            const partyRef     = useRef(null);   const partyInst     = useRef(null);
            const accuracyRef  = useRef(null);   const accuracyInst  = useRef(null);
            const ageingRef    = useRef(null);   const ageingInst    = useRef(null);
            const bankRef      = useRef(null);   const bankInst      = useRef(null);

            /* --- Compliance: anomalies, policy violations and the rules behind them --- */
            const [compliance, setCompliance] = useState(null);
            const [anomalies, setAnomalies] = useState([]);
            const [violations, setViolations] = useState([]);
            const [rules, setRules] = useState([]);
            /* Seeded from the filter context rather than fetched.
               AppLayout already loads the account list for the topbar pickers,
               so the dashboard was requesting an identical list a second time on
               every mount — visible in the Network tab as two calls to
               /v1/bank-master/accounts, one with a query string and one without.

               It stays local state rather than being read straight from the
               context because the Minimum Balance panel at the bottom of this
               page edits these rows in place and needs somewhere to put the
               result. */
            const [userAccounts, setUserAccounts] = useState(contextAccounts || []);
            useEffect(() => { setUserAccounts(contextAccounts || []); }, [contextAccounts]);
            const [scanning, setScanning] = useState(false);
            const [showRules, setShowRules] = useState(false);
            const [showAddRuleModal, setShowAddRuleModal] = useState(false);
            const [newRuleForm, setNewRuleForm] = useState({
                name: '',
                description: '',
                category: 'internal',
                rule_type: 'amount_limit',
                threshold_rupees: 50000,
                severity: 'medium',
                direction_scope: 'debit'
            });
            const rulesPanelRef = useRef(null);
            const complianceCardRef = useRef(null);
            const rulesWasOpen = useRef(false);
            useEffect(() => {
                const target = showRules ? rulesPanelRef.current : (rulesWasOpen.current ? complianceCardRef.current : null);
                rulesWasOpen.current = showRules;
                if (!target) return;
                // One frame's delay: on open the panel is mounted by this same
                // render, and scrollIntoView on a node the browser has not laid
                // out yet scrolls to the wrong place.
                const t = setTimeout(() => {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 50);
                return () => clearTimeout(t);
            }, [showRules]);
            const [complianceError, setComplianceError] = useState(null);

            /* allSettled, not all: these five endpoints are independent, and with
               Promise.all a single 500 (a pending migration, say) rejected the whole
               batch — so one broken endpoint blanked every chart on the page,
               including the ones that had nothing to do with it. Each result is now
               applied on its own. */
            const loadCompliance = async () => {
                /* Accounts and the monthly series used to be fetched here too.
                   Both moved: accounts because this call passed no entity or
                   account filter and so quietly disagreed with the rest of the
                   page, and the monthly series because it had no filter
                   parameters at all — the waterfall drawn from it always showed
                   all time no matter what the date bar said. The treasury
                   report supplies the filtered equivalent. */
                /* Scoped like every other panel on this page. These three used
                   to be requested bare, so selecting an entity narrowed the whole
                   dashboard EXCEPT the anomaly and compliance tiles, which went on
                   reporting the full ledger next to figures that no longer
                   described it. `/compliance/rules` stays unscoped on purpose: a
                   rule is a definition the user wrote, not a finding about an
                   account, and the same rules apply whichever entity is selected. */
                let scope = '';
                if (selectedBankId)   scope += `&account_id=${selectedBankId}`;
                if (selectedEntityId) scope += `&entity_id=${selectedEntityId}`;

                const [ov, an, vi, ru] = await Promise.allSettled([
                    apiFetch('/compliance/overview' + (scope ? '?' + scope.slice(1) : '')),
                    apiFetch('/compliance/anomalies?status=open&limit=60' + scope),
                    apiFetch('/compliance/violations?status=open&limit=60' + scope),
                    apiFetch('/compliance/rules')
                ]);
                if (ov.status === 'fulfilled') setCompliance(ov.value);
                if (an.status === 'fulfilled') setAnomalies(an.value || []);
                if (vi.status === 'fulfilled') setViolations(vi.value || []);
                if (ru.status === 'fulfilled') setRules((ru.value && ru.value.rules) || []);

                const broken = [
                    ['overview', ov], ['anomalies', an], ['violations', vi],
                    ['rules', ru]
                ].filter(([, r]) => r.status === 'rejected');
                if (broken.length) {
                    // Surfaced rather than swallowed: a silently empty panel is
                    // indistinguishable from "you have no findings".
                    setComplianceError(broken.map(([n, r]) => n + ': ' + (r.reason && r.reason.message)).join(' | '));
                    console.error('compliance endpoints failed', broken);
                } else {
                    setComplianceError(null);
                }
            };

            /* Detection is explicit rather than automatic: a full scan walks every
               transaction, and re-running it on each render would make the numbers
               shift under you while you are reading them. */
            const runScan = async () => {
                setScanning(true);
                try {
                    await apiFetch('/compliance/analyze', { method: 'POST' });
                    await loadCompliance();
                    await loadDashboardData();
                } catch (e) {
                    alert('Scan failed: ' + e.message);
                } finally { setScanning(false); }
            };

            const setFindingStatus = async (kind, id, status) => {
                try {
                    await apiFetch('/compliance/' + kind + '/' + id, {
                        method: 'PATCH', body: JSON.stringify({ status })
                    });
                    if (kind === 'anomalies') setAnomalies(a => a.filter(x => x.id !== id));
                    else setViolations(v => v.filter(x => x.id !== id));
                    loadCompliance();
                } catch (e) { alert('Could not update: ' + e.message); }
            };

            const saveRule = async (rule, patch) => {
                try {
                    const updated = await apiFetch('/compliance/rules/' + rule.id, {
                        method: 'PATCH', body: JSON.stringify(patch)
                    });
                    setRules(rs => rs.map(r => r.id === rule.id ? updated : r));
                } catch (e) { alert('Could not save rule: ' + e.message); }
            };

            const deleteRule = async (ruleId) => {
                if (!confirm('Are you sure you want to remove this compliance rule?')) return;
                try {
                    await apiFetch('/compliance/rules/' + ruleId, { method: 'DELETE' });
                    setRules(rs => rs.filter(r => r.id !== ruleId));
                    loadCompliance();
                } catch (e) { alert('Could not remove rule: ' + e.message); }
            };

            const createRule = async (e) => {
                e.preventDefault();
                if (!newRuleForm.name.trim()) {
                    alert('Please enter a rule name.');
                    return;
                }
                try {
                    const payload = {
                        name: newRuleForm.name.trim(),
                        description: newRuleForm.description.trim() || null,
                        category: newRuleForm.category,
                        rule_type: newRuleForm.rule_type,
                        threshold_paise: newRuleForm.threshold_rupees ? Math.round(Number(newRuleForm.threshold_rupees) * 100) : null,
                        severity: newRuleForm.severity,
                        direction_scope: newRuleForm.direction_scope,
                        is_active: true
                    };
                    const created = await apiFetch('/compliance/rules', {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    setRules(rs => [...rs, created]);
                    setShowAddRuleModal(false);
                    setNewRuleForm({
                        name: '',
                        description: '',
                        category: 'internal',
                        rule_type: 'amount_limit',
                        threshold_rupees: 50000,
                        severity: 'medium',
                        direction_scope: 'debit'
                    });
                    loadCompliance();
                } catch (e) { alert('Could not add rule: ' + e.message); }
            };

            const saveAccountMinBalance = async (accId, minBalanceVal) => {
                try {
                    const v = minBalanceVal === '' || minBalanceVal === null || isNaN(parseFloat(minBalanceVal)) ? null : parseFloat(minBalanceVal);
                    const updated = await apiFetch('/v1/bank-master/accounts/' + accId, {
                        method: 'PATCH',
                        body: JSON.stringify({ min_balance: v })
                    });
                    setUserAccounts(prev => prev.map(a => a.id === accId ? updated : a));
                } catch (e) {
                    alert('Could not update minimum balance: ' + e.message);
                }
            };

            /* Currency metadata (symbol, decimals per code). It used to be fetched
               from an effect of its own, and that was the reason the charts
               visibly flashed and redrew a moment after the page settled:
               `ccyMeta` feeds `ccy`, which feeds `dmc`, which feeds `baseOpts`
               and `rankedBarOpts` — and all eight chart effects depend on those.
               So a response arriving out-of-band destroyed and rebuilt every
               chart on the page.

               It is now seeded synchronously from a module-level cache, so on
               every mount after the first it is already correct at first paint
               and the charts are built exactly once. The network call is folded
               into the main batch below. */
            useEffect(() => {
                if (CCY_META_CACHE.loaded) return;
                apiFetch('/currencies')
                    .then(list => {
                        const map = {};
                        (Array.isArray(list) ? list : []).forEach(c => { map[c.code] = c; });
                        CCY_META_CACHE.map = map;
                        CCY_META_CACHE.loaded = true;
                        setCcyMeta(map);
                    })
                    .catch(() => {});
            }, []);

            /* Filter changes are not atomic — picking a From date and then a To
               date fires this twice, and the two batches then race. Nothing
               cancels the first, so its (stale) responses could land after the
               second's and quietly repaint one panel with the wrong window
               while its neighbours showed the right one. Every batch takes a
               ticket; only the newest one is allowed to write state. */
            const loadSeq = useRef(0);

            const loadDashboardData = async () => {
                const seq = ++loadSeq.current;
                try {
                    setLoading(true);

                    /* ONE date window, ONE entity, ONE account — every panel on
                       the page is scoped from the same four values here rather
                       than fetching on its own terms. That is what stopped the
                       waterfall reading a different range from the chart beside
                       it: the monthly series it used ignored the filter bar
                       entirely and always returned all time. */
                    let sumUrl = '/dashboard/summary?';
                    // Two aggregates instead of the whole ledger. See the state
                    // declaration above for the measurement that motivated this.
                    let mixUrl   = '/analytics/outflow-breakdown?top=9&';
                    let partyUrl = '/analytics/counterparty-outflows?top=8&';
                    let healthUrl = '/analytics/classification-health?';
                    // Always daily. Section 3 rolls it up to weeks or months
                    // itself, so the grain control costs no round trip and no
                    // chart can end up a request behind the others.
                    let cfUrl  = '/analytics/cash-flow?interval=daily&';
                    let posUrl = '/analytics/cash-position?';
                    let btUrl  = '/analytics/forecast-backtest?horizon_days=30&';
                    // The account list is not requested here any more: it arrives
                    // Entity narrowing that this request used to do server-side now
                    // happens in `scopedAccounts`, which already had to filter by
                    // account id anyway.
                    // Ageing is deliberately NOT date-filtered: the bridge is a
                    // running balance of what has not cleared, and slicing it to
                    // the dashboard's date window would show "0 items over 90
                    // days" purely because the window is 30 days wide.
                    let ageUrl = '/analytics/unreconciled-ageing?';

                    /* The treasury report resolves its own period and defaults
                       to the current month, which is empty whenever the latest
                       statement is older than that — so the period is always
                       stated explicitly, and 'all_time' when no dates are set.
                       Its account parameter is `account_id`, not `bank_id`. */
                    let trUrl = '/reports/treasury?';
                    trUrl += (fromDate || toDate)
                        ? `period=custom&start_date=${fromDate || ''}&end_date=${toDate || ''}&`
                        : 'period=all_time&';

                    if (fromDate) { sumUrl += `from_date=${fromDate}&`; mixUrl += `start_date=${fromDate}&`; partyUrl += `start_date=${fromDate}&`; healthUrl += `start_date=${fromDate}&`; cfUrl += `start_date=${fromDate}&`; posUrl += `start_date=${fromDate}&`; btUrl += `start_date=${fromDate}&`; }
                    if (toDate) { sumUrl += `to_date=${toDate}&`; mixUrl += `end_date=${toDate}&`; partyUrl += `end_date=${toDate}&`; healthUrl += `end_date=${toDate}&`; cfUrl += `end_date=${toDate}&`; posUrl += `end_date=${toDate}&`; btUrl += `end_date=${toDate}&`; }
                    if (globalSearch) { mixUrl += `search=${encodeURIComponent(globalSearch)}&`; partyUrl += `search=${encodeURIComponent(globalSearch)}&`; }
                    if (selectedEntityId) { sumUrl += `entity_id=${selectedEntityId}&`; mixUrl += `entity_id=${selectedEntityId}&`; partyUrl += `entity_id=${selectedEntityId}&`; healthUrl += `entity_id=${selectedEntityId}&`; cfUrl += `entity_id=${selectedEntityId}&`; posUrl += `entity_id=${selectedEntityId}&`; btUrl += `entity_id=${selectedEntityId}&`; trUrl += `entity_id=${selectedEntityId}&`; ageUrl += `entity_id=${selectedEntityId}&`; }
                    if (selectedBankId) { sumUrl += `bank_id=${selectedBankId}&`; mixUrl += `bank_id=${selectedBankId}&`; partyUrl += `bank_id=${selectedBankId}&`; healthUrl += `bank_id=${selectedBankId}&`; cfUrl += `bank_id=${selectedBankId}&`; posUrl += `bank_id=${selectedBankId}&`; btUrl += `bank_id=${selectedBankId}&`; ageUrl += `bank_id=${selectedBankId}&`; trUrl += `account_id=${selectedBankId}&`; }

                    /* allSettled for the same reason as loadCompliance: one failing
                       endpoint should cost you that one panel, not the whole page. */
                    const [sumData, cfData, mixData, partyData, ageData, posData,
                           trData, btData, healthData] =
                        await Promise.allSettled([
                            apiFetch(sumUrl),
                            apiFetch(cfUrl),
                            apiFetch(mixUrl),
                            apiFetch(partyUrl),
                            apiFetch(ageUrl),
                            apiFetch(posUrl),
                            apiFetch(trUrl),
                            apiFetch(btUrl),
                            apiFetch(healthUrl)
                        ]);
                    // Superseded while in flight: drop the whole batch rather
                    // than paint a mixture of two date windows.
                    if (seq !== loadSeq.current) return;

                    if (sumData.status === 'fulfilled') setSummary(sumData.value);
                    if (cfData.status === 'fulfilled') setCashFlow(cfData.value || []);
                    if (mixData.status === 'fulfilled') setOutflowMixData(mixData.value);
                    if (partyData.status === 'fulfilled') setCounterpartyData(partyData.value);
                    if (healthData.status === 'fulfilled') setHealth(healthData.value);
                    if (ageData.status === 'fulfilled') setAgeing(ageData.value);
                    if (posData.status === 'fulfilled') setCashPosition(posData.value);
                    if (trData.status === 'fulfilled') setTreasury(trData.value);
                    /* A rejected backtest is not the same as an unavailable one.
                       Both end up as "Forecast comparison unavailable", but only
                       the second can explain itself, so the reason is carried
                       through rather than left as a bare empty panel. */
                    setBacktest(btData.status === 'fulfilled' ? btData.value
                        : { available: false, reason: 'Forecast comparison could not be loaded' });

                    const failed = [['summary', sumData], ['cash-flow', cfData], ['outflow-breakdown', mixData], ['counterparties', partyData],
                                    ['cash-position', posData], ['treasury', trData]]
                        .filter(([, r]) => r.status === 'rejected');
                    if (failed.length) {
                        console.error('dashboard endpoints failed', failed);
                    }
                } catch (e) {
                    console.error("Error loading dashboard data:", e);
                } finally {
                    // Only the batch still in charge may clear the spinner; an
                    // overtaken one doing it would say "loaded" while the batch
                    // that matters is still in flight.
                    if (seq === loadSeq.current) setLoading(false);
                }
            };

            useEffect(() => {
                // Both started here, not chained: the two halves of the page
                // issue their requests together rather than the second waiting
                // on the first. Each still applies its own results as they
                // arrive, so one slow endpoint cannot hold the other half back.
                loadDashboardData();
                loadCompliance();
            }, [selectedEntityId, selectedBankId, fromDate, toDate, globalSearch]);

            /* The daily/monthly refetch effect that used to sit here is gone.
               Section 3 now fetches the daily series once with everything else
               and rolls it up in the browser, so switching grain redraws rather
               than re-requests — and there is no longer a second cash-flow
               request racing the batch on mount. */


            /* ================================================================
               TREASURY DASHBOARD — derived series and chart rendering
               ================================================================
               Every figure below is derived from data the application already
               holds: the summary endpoint, the cash-position curve, the
               treasury report's own forecast engine, the reconciliation bridge
               and the transaction rows themselves. Nothing is seeded, sampled
               or padded — where a metric cannot be computed the panel says so
               instead of drawing an empty axis. */

            /* ---- Narrow viewports ----------------------------------------
               The app shell holds a fixed 156px sidebar, so a 375px phone
               leaves the dashboard about 220px of content. A Chart.js
               horizontal bar chart at that width spends most of it on the
               label axis and then clips the labels anyway — and on a ranking,
               the labels ARE the data. Below the phone breakpoint the three
               rankings become plain ranked lists instead: same figures, same
               order, same shares, but the names wrap rather than truncate.
               This is a fallback, not a shrink. */
            const NARROW_PX = 720;   // matches the phone breakpoint in styles.css
            const [narrow, setNarrow] = useState(() => window.innerWidth <= NARROW_PX);

            useEffect(() => {
                /* A resize listener rather than a MediaQueryList one. Both are
                   correct in principle, but `change` on a MediaQueryList does
                   not fire under every viewport-emulation path — the CSS
                   breakpoint would flip while React still believed the screen
                   was wide, leaving the rankings as charts too narrow to read.
                   `resize` fires everywhere, and the comparison is the same. */
                let timer = null;
                const onResize = () => {
                    // setTimeout, not requestAnimationFrame: rAF callbacks are
                    // starved while the tab is not compositing — a background
                    // tab, or a window the user has behind another — so the
                    // layout could stay stuck in whichever mode it booted in
                    // until the page was touched again. A timer always fires.
                    if (timer) clearTimeout(timer);
                    timer = setTimeout(() => {
                        timer = null;
                        setNarrow(window.innerWidth <= NARROW_PX);
                    }, 120);                               // coalesce a resize drag
                };
                window.addEventListener('resize', onResize);
                // Catch a resize that landed between first paint and this
                // effect: the initial state was read one render ago.
                setNarrow(window.innerWidth <= NARROW_PX);
                return () => {
                    window.removeEventListener('resize', onResize);
                    if (timer) clearTimeout(timer);
                };
            }, []);

            /* ---- Currency ------------------------------------------------
               The dashboard speaks the currency its accounts are actually held
               in. Uniform across the in-scope accounts or nothing: adding two
               currencies into one total is a conversion this screen does not
               perform, so when they differ it says so rather than stamping a
               rupee sign on the sum. */
            const scopedAccounts = React.useMemo(() => {
                let all = userAccounts || [];
                // Entity narrowing moved here when the dashboard stopped making
                // its own filtered request for this list.
                if (selectedEntityId) {
                    all = all.filter(a => String(a.entity_id) === String(selectedEntityId));
                }
                if (!selectedBankId) return all;
                // The account picker emits an ACCOUNT id; a bank-level filter
                // emits a BANK id. Both are matched, the same way the summary
                // endpoint matches them, so one filter bar cannot mean two
                // different populations on two panels.
                return all.filter(a => String(a.id) === String(selectedBankId)
                                    || String(a.bank_id) === String(selectedBankId));
            }, [userAccounts, selectedBankId, selectedEntityId]);

            const ccy = React.useMemo(() => {
                const codes = [...new Set((scopedAccounts || []).map(a => a.currency).filter(Boolean))];
                const code = codes.length === 1 ? codes[0] : 'INR';
                const meta = ccyMeta[code] || {};
                return {
                    code,
                    symbol: meta.symbol !== undefined ? meta.symbol : '₹',
                    decimals: meta.decimals !== undefined && meta.decimals !== null ? meta.decimals : 2,
                    mixed: codes.length > 1
                };
            }, [scopedAccounts, ccyMeta]);

            /* Compact for tiles and axis ticks, exact for tooltips and tables.
               "Show in" in the filter bar still wins when the reader has pinned
               a unit — the control is not overridden, only defaulted. */
            const dmc = React.useCallback((v) => (
                denom === 'units'
                    ? window.moneyCompact(v, { symbol: ccy.symbol, code: ccy.code })
                    : window.moneyScaled(v, denom, { symbol: ccy.symbol, code: ccy.code })
            ), [denom, ccy]);

            const dmx = React.useCallback((v) => window.moneyCcy(v, {
                symbol: ccy.symbol, code: ccy.code, decimals: ccy.decimals
            }), [ccy]);

            const fmtDay = (iso) => {
                if (!iso) return '';
                const d = new Date(iso + 'T00:00:00');
                return isNaN(d) ? String(iso)
                    : d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
            };

            /* ---- Shared chart chrome -------------------------------------
               One set of axes, one type ramp, one grid colour. The charts are
               meant to read as one instrument panel, not eight separate
               widgets, so none of them redefines this locally. */
            const GRID = '#eeeeee';
            const INK = '#111111';
            const MUTED = '#6b7280';
            const POSITIVE = '#0a6b2d';
            const NEGATIVE = '#b00020';
            const THRESHOLD = '#c2843a';
            const BAR = '#4d4d4d';

            const axisFont = { family: 'JetBrains Mono', size: 8 };
            const labelFont = { family: 'IBM Plex Sans', size: 8 };

            const tooltipStyle = {
                backgroundColor: 'rgba(17,17,17,0.94)',
                titleFont: { family: 'IBM Plex Sans', size: 9, weight: '700' },
                bodyFont: { family: 'JetBrains Mono', size: 9 },
                padding: 7,
                displayColors: true,
                boxWidth: 7,
                boxHeight: 7,
                cornerRadius: 0
            };

            const legendStyle = {
                display: true, position: 'top', align: 'end',
                labels: { boxWidth: 8, boxHeight: 8, font: labelFont, padding: 8 }
            };

            const baseOpts = React.useMemo(() => ({
                responsive: true,
                maintainAspectRatio: false,
                animation: { duration: 200 },
                interaction: { mode: 'index', intersect: false },
                plugins: { legend: { display: false }, tooltip: tooltipStyle },
                scales: {
                    x: { ticks: { font: labelFont, color: MUTED, maxRotation: 0, autoSkip: true },
                         grid: { display: false }, border: { color: '#dddddd' } },
                    y: { ticks: { font: axisFont, color: MUTED, callback: (v) => dmc(v) },
                         grid: { color: GRID }, border: { display: false } }
                }
            }), [dmc]);

            /* ================================================================
               SECTION 2 — Cash position and liquidity forecast
               ================================================================
               History is the posted balance curve from /analytics/cash-position.
               The projection is NOT re-derived here: it is the net flow the
               treasury report's recurring-series engine expects over 30/60/90
               days, applied to the last actual balance so the dashed line
               starts exactly where the solid one stops. */
            const liquidity = React.useMemo(() => {
                const pts = (cashPosition && cashPosition.points) || [];
                const horizons = (treasury && treasury.forecast && treasury.forecast.available)
                    ? treasury.forecast.horizons : null;

                if (!pts.length) {
                    return { available: false, minLiquidity: cashPosition ? cashPosition.min_liquidity : null };
                }

                const lastDate = pts[pts.length - 1].date;
                const current = pts[pts.length - 1].balance;
                const addDays = (iso, n) => {
                    const d = new Date(iso + 'T00:00:00');
                    d.setDate(d.getDate() + n);
                    return d.toISOString().substring(0, 10);
                };

                const projected = {};
                if (horizons) {
                    [30, 60, 90].forEach(h => {
                        const band = horizons['day_' + h];
                        if (!band) return;
                        projected[h] = {
                            date: addDays(lastDate, h),
                            expected: current + (band.net_flow_expected || 0),
                            conservative: current + (band.net_flow_conservative || 0)
                        };
                    });
                }

                const minLiquidity = cashPosition ? cashPosition.min_liquidity : null;
                return {
                    available: true,
                    points: pts,
                    asOf: lastDate,
                    current,
                    projected,
                    horizonKeys: Object.keys(projected).map(Number).sort((a, b) => a - b),
                    minLiquidity,
                    buffer: (minLiquidity === null || minLiquidity === undefined)
                        ? null : current - minLiquidity,
                    accountsWithThreshold: cashPosition ? cashPosition.accounts_with_threshold : 0,
                    // A projection that dips under the floor is the single fact
                    // this chart exists to surface, so it is computed rather
                    // than left to the reader's eye on the gridline.
                    breachHorizon: (minLiquidity === null || minLiquidity === undefined) ? null
                        : (Object.keys(projected).map(Number).sort((a, b) => a - b)
                            .find(h => projected[h].expected < minLiquidity) || null)
                };
            }, [cashPosition, treasury]);

            useEffect(() => {
                if (!liquidityRef.current) return;
                if (liquidityInst.current) { liquidityInst.current.destroy(); liquidityInst.current = null; }
                if (!liquidity.available) return;

                const hist = liquidity.points;
                const hKeys = liquidity.horizonKeys;
                const labels = hist.map(p => p.date).concat(hKeys.map(h => liquidity.projected[h].date));
                const pad = hKeys.length;

                const actual = hist.map(p => p.balance).concat(new Array(pad).fill(null));
                // The projection repeats the final actual point so the dashed
                // line joins the solid one instead of floating away from it.
                const joinAt = new Array(Math.max(0, hist.length - 1)).fill(null).concat([liquidity.current]);
                const expected = joinAt.concat(hKeys.map(h => liquidity.projected[h].expected));
                const conservative = joinAt.concat(hKeys.map(h => liquidity.projected[h].conservative));

                const datasets = [
                    { label: 'Actual cash', data: actual, borderColor: INK,
                      backgroundColor: 'rgba(17,17,17,0.05)', borderWidth: 1.75,
                      pointRadius: 0, pointHoverRadius: 3, fill: true, tension: 0.15, spanGaps: false }
                ];
                if (pad) {
                    datasets.push(
                        { label: 'Projected (expected)', data: expected, borderColor: MUTED,
                          borderDash: [5, 3], borderWidth: 1.75, pointRadius: 2.5,
                          pointBackgroundColor: MUTED, fill: false, tension: 0.15, spanGaps: false },
                        { label: 'Projected (conservative)', data: conservative, borderColor: '#9ca3af',
                          borderDash: [2, 3], borderWidth: 1.5, pointRadius: 2,
                          pointBackgroundColor: '#9ca3af', fill: false, tension: 0.15, spanGaps: false }
                    );
                }
                if (liquidity.minLiquidity !== null && liquidity.minLiquidity !== undefined) {
                    datasets.push({
                        label: 'Minimum liquidity', data: labels.map(() => liquidity.minLiquidity),
                        borderColor: THRESHOLD, borderDash: [6, 4], borderWidth: 1.25,
                        pointRadius: 0, fill: false
                    });
                }

                liquidityInst.current = new Chart(liquidityRef.current.getContext('2d'), {
                    type: 'line',
                    data: { labels, datasets },
                    options: {
                        ...baseOpts,
                        plugins: {
                            legend: legendStyle,
                            tooltip: {
                                ...tooltipStyle,
                                callbacks: {
                                    title: (items) => fmtDay(items[0].label),
                                    label: (c) => c.parsed.y === null ? null
                                        : c.dataset.label + '  ' + dmx(c.parsed.y)
                                }
                            }
                        },
                        scales: {
                            ...baseOpts.scales,
                            x: { ...baseOpts.scales.x,
                                 ticks: { ...baseOpts.scales.x.ticks, maxTicksLimit: 9,
                                          callback: function (v) { return fmtDay(this.getLabelForValue(v)); } } }
                        }
                    }
                });
                return () => { if (liquidityInst.current) { liquidityInst.current.destroy(); liquidityInst.current = null; } };
            }, [liquidity, baseOpts, dmx]);

            /* ================================================================
               SECTION 3 — Cash inflows vs outflows
               ================================================================
               The daily series is fetched and then rolled up here. Plotting it
               raw was the original problem: several hundred points, one per
               transaction day, in which no week could be told from any other.
               Grain follows the selected range unless the reader pins it. */
            const flowSeries = React.useMemo(() => {
                const rows = (cashFlow || []).filter(r => r && r.period);
                if (!rows.length) return { available: false };

                const spanDays = (() => {
                    const first = new Date(rows[0].period + 'T00:00:00');
                    const last = new Date(rows[rows.length - 1].period + 'T00:00:00');
                    return isNaN(first) || isNaN(last) ? 0 : Math.round((last - first) / 86400000);
                })();

                const grain = flowGrain !== 'auto' ? flowGrain
                    : (spanDays <= 120 ? 'weekly' : 'monthly');

                const buckets = new Map();
                rows.forEach(r => {
                    const d = new Date(r.period + 'T00:00:00');
                    if (isNaN(d)) return;
                    let key, label;
                    if (grain === 'weekly') {
                        // Week commencing Monday: a treasury week is a payment
                        // cycle, and labelling it by its Monday is how the
                        // payment run itself is referred to.
                        const wc = new Date(d);
                        wc.setDate(wc.getDate() - ((wc.getDay() + 6) % 7));
                        key = wc.toISOString().substring(0, 10);
                        label = 'w/c ' + wc.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
                    } else {
                        key = r.period.substring(0, 7);
                        label = d.toLocaleDateString('en-GB', { month: 'short', year: '2-digit' });
                    }
                    const b = buckets.get(key) || { key, label, inflow: 0, outflow: 0 };
                    b.inflow += (r.inflow || 0);
                    b.outflow += (r.outflow || 0);
                    buckets.set(key, b);
                });

                const list = [...buckets.values()].sort((a, b) => a.key < b.key ? -1 : 1);
                const totalIn = list.reduce((s, b) => s + b.inflow, 0);
                const totalOut = list.reduce((s, b) => s + b.outflow, 0);
                return {
                    available: list.length > 0, grain, list,
                    totalIn, totalOut, net: totalIn - totalOut,
                    deficitPeriods: list.filter(b => b.outflow > b.inflow).length
                };
            }, [cashFlow, flowGrain]);

            useEffect(() => {
                if (!flowRef.current) return;
                if (flowInst.current) { flowInst.current.destroy(); flowInst.current = null; }
                if (!flowSeries.available) return;

                const list = flowSeries.list;
                flowInst.current = new Chart(flowRef.current.getContext('2d'), {
                    type: 'bar',
                    data: {
                        labels: list.map(b => b.label),
                        datasets: [
                            { label: 'Inflows', data: list.map(b => b.inflow),
                              backgroundColor: POSITIVE, borderWidth: 0, categoryPercentage: 0.7, barPercentage: 0.9 },
                            { label: 'Outflows', data: list.map(b => b.outflow),
                              backgroundColor: NEGATIVE, borderWidth: 0, categoryPercentage: 0.7, barPercentage: 0.9 },
                            // Net rides above the bars as a line: the question
                            // is whether the pair crossed over, and a third bar
                            // makes that harder to see, not easier.
                            { label: 'Net', type: 'line', data: list.map(b => b.inflow - b.outflow),
                              borderColor: INK, borderWidth: 1.5, pointRadius: 2,
                              pointBackgroundColor: INK, fill: false, tension: 0.15 }
                        ]
                    },
                    options: {
                        ...baseOpts,
                        plugins: {
                            legend: legendStyle,
                            tooltip: { ...tooltipStyle, callbacks: {
                                label: (c) => c.dataset.label + '  ' + dmx(c.parsed.y)
                            } }
                        }
                    }
                });
                return () => { if (flowInst.current) { flowInst.current.destroy(); flowInst.current = null; } };
            }, [flowSeries, baseOpts, dmx]);

            /* ================================================================
               SECTION 4 — Monthly cash movement
               ================================================================
               Two readings of the same bridge, both from the treasury report:

               "Drivers"  opening cash, inflows, each outflow category, closing
                          cash. It reconciles exactly — opening + inflows -
                          outflows = closing — which is what makes it a bridge
                          rather than a stack of bars.
               "By month" the month-by-month net movement the original waterfall
                          showed, retained because it answers a different
                          question: which month turned.

               Categories are the application's own. None is invented, and none
               is shown that the data does not contain. */
            const movement = React.useMemo(() => {
                const g = treasury && treasury.group_totals;
                const trend = (treasury && treasury.monthly_trend) || [];

                if (movementView === 'months') {
                    /* The treasury report builds its monthly trend from the
                       whole transaction history rather than the resolved
                       period, so it arrives holding months the filter bar has
                       excluded. Scoped here rather than left as-is: a bridge
                       showing April when the date range starts in October is
                       the "one chart on a different date range" problem, and it
                       is invisible until someone adds the bars up. */
                    const inWindow = trend.filter(m => {
                        if (!fromDate && !toDate) return true;
                        const key = m.year + '-' + String(m.month).padStart(2, '0');
                        if (fromDate && key < fromDate.substring(0, 7)) return false;
                        if (toDate && key > toDate.substring(0, 7)) return false;
                        return true;
                    });
                    if (!inWindow.length) return { available: false };
                    let running = 0;
                    const bars = inWindow.map(m => {
                        const delta = m.net_flow || 0;
                        const seg = [running, running + delta];
                        running += delta;
                        return { label: m.month_label, seg, delta, kind: delta >= 0 ? 'up' : 'down' };
                    });
                    bars.push({ label: 'Net', seg: [0, running], delta: running, kind: 'total' });
                    return { available: true, bars, mode: 'months' };
                }

                if (!g) return { available: false };
                const outflows = Object.entries(g.outflow_categories || {})
                    .filter(([, v]) => v > 0)
                    .sort((a, b) => b[1] - a[1]);
                if (!outflows.length && !(g.total_inflows > 0)) return { available: false };

                // Beyond the top drivers the bars are too thin to read, so the
                // tail is aggregated rather than truncated — the bridge still
                // has to close on the real figure.
                const TOP = 6;
                const head = outflows.slice(0, TOP);
                const tail = outflows.slice(TOP);
                const tailSum = tail.reduce((s, [, v]) => s + v, 0);

                let running = g.opening_balance || 0;
                const bars = [{ label: 'Opening cash', seg: [0, running], delta: running, kind: 'total' }];

                const step = (label, delta, kind) => {
                    const seg = [running, running + delta];
                    running += delta;
                    bars.push({ label, seg, delta, kind });
                };

                step('Inflows', g.total_inflows || 0, 'up');
                head.forEach(([name, v]) => step(name, -v, 'down'));
                if (tail.length) step('Other outflows (' + tail.length + ')', -tailSum, 'down');
                bars.push({ label: 'Closing cash', seg: [0, running], delta: running, kind: 'total' });

                return { available: true, bars, mode: 'drivers', closing: running };
            }, [treasury, movementView, fromDate, toDate]);

            useEffect(() => {
                if (!movementRef.current) return;
                if (movementInst.current) { movementInst.current.destroy(); movementInst.current = null; }
                if (!movement.available) return;

                const colour = { up: POSITIVE, down: NEGATIVE, total: INK };
                movementInst.current = new Chart(movementRef.current.getContext('2d'), {
                    type: 'bar',
                    data: {
                        labels: movement.bars.map(b => b.label),
                        datasets: [{
                            data: movement.bars.map(b => b.seg),
                            backgroundColor: movement.bars.map(b => colour[b.kind]),
                            borderWidth: 0, categoryPercentage: 0.75, barPercentage: 0.92
                        }]
                    },
                    options: {
                        ...baseOpts,
                        interaction: { mode: 'nearest', intersect: true },
                        plugins: {
                            legend: { display: false },
                            tooltip: { ...tooltipStyle, displayColors: false, callbacks: {
                                title: (items) => items[0].label,
                                label: (c) => {
                                    const bar = movement.bars[c.dataIndex];
                                    if (bar.kind === 'total') return dmx(bar.delta);
                                    const sign = bar.delta >= 0 ? '+' : '−';
                                    return sign + ' ' + dmx(Math.abs(bar.delta))
                                        + '   → ' + dmx(bar.seg[1]);
                                }
                            } }
                        },
                        scales: {
                            ...baseOpts.scales,
                            x: { ...baseOpts.scales.x,
                                 ticks: { ...baseOpts.scales.x.ticks, maxRotation: 30, minRotation: 0,
                                          callback: function (v) {
                                              const s = String(this.getLabelForValue(v));
                                              return s.length > 16 ? s.slice(0, 15) + '…' : s;
                                          } } }
                        }
                    }
                });
                return () => { if (movementInst.current) { movementInst.current.destroy(); movementInst.current = null; } };
            }, [movement, baseOpts, dmx]);

            /* ================================================================
               SECTION 5 — Cash outflow breakdown
               ================================================================
               Economic outflows only. Two exclusions, both on signals the
               application sets itself rather than on a guess about the name:

                 flow_type = TRANSFER                       (the parser's own
                                                             own-account flag)
                 category_path ... "Own Account Transfer"    (the classifier's)

               Money moved between the company's own accounts is not a cost, and
               leaving it in was what made "Transfers" swallow the old donut.
               Note what is NOT excluded: "Transfers > Person to Person" is a
               real payment to a real party and stays in, which is why the split
               is drawn at the tree's second level. Grouping at level 1 would
               put those payments back under a single "Transfers" bar and undo
               the point of the exercise. */
            const outflowMix = React.useMemo(() => {
                const d = outflowMixData;
                if (!d || !d.available) {
                    return { available: false,
                             excludedValue: (d && d.excluded_value) || 0,
                             excludedCount: (d && d.excluded_count) || 0 };
                }
                // Field names are adapted here rather than in the render, so the
                // panel below is untouched by where its numbers came from.
                return {
                    available: true,
                    rows: d.rows.map(r => ({ label: r.label, value: r.value,
                                             count: r.count, share: r.share })),
                    total: d.total,
                    excludedValue: d.excluded_value,
                    excludedCount: d.excluded_count,
                    categoriesFound: d.categories_found
                };
            }, [outflowMixData]);

            /* Ranked horizontal bars share one set of options: rankings read
               top-down, values sit on the value axis, and the label axis never
               wraps. Anything that differs between the two rankings is passed
               in rather than redefined. */
            const rankedBarOpts = React.useCallback((labels, fullLabels, tooltipLabel) => ({
                responsive: true,
                maintainAspectRatio: false,
                animation: { duration: 200 },
                indexAxis: 'y',
                plugins: {
                    legend: { display: false },
                    tooltip: { ...tooltipStyle, displayColors: false, callbacks: {
                        title: (items) => fullLabels[items[0].dataIndex] || items[0].label,
                        label: tooltipLabel
                    } }
                },
